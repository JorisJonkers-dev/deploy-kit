# The project file this case's Platform document is read beside.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: broker-a
    l4Exposure:
      - {address: lan-mqtt, port: 1883, protocol: tcp, process: broker-a, surface: mqtt}
    processes:
      - name: broker-a
        lifecycle: application
        image: library
        runtime: none
        provides:
          mqtt: 1883
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 1883 }
        startupBudget: 30s
        cutover: interrupted
  - id: broker-b
    l4Exposure:
      - {address: lan-mqtt, port: 1883, protocol: tcp, process: broker-b, surface: mqtt}
    processes:
      - name: broker-b
        lifecycle: application
        image: library
        runtime: none
        provides:
          mqtt: 1883
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 1883 }
        startupBudget: 30s
        cutover: interrupted
  - id: edge-proxy
    processes:
      - name: edge-proxy
        lifecycle: application
        image: traefik
        runtime: none
        provides:
          http: 8080
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 30s
        cutover: continuous
