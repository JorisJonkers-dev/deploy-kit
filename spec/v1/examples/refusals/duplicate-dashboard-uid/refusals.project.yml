# REFUSED: E_DUPLICATE_DASHBOARD_UID
#
# Two Applications ship a dashboard whose uid is board. Grafana keys a
# dashboard by its uid, so the second would replace the first
# (spec/v1/10-project-intent.md #dashboards).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: board-0
    dashboards:
      - {from: dashboards/board.json}
    processes:
      - name: board-0
        lifecycle: application
        image: board
        runtime: none
        provides:
          http: 8080
        placement:
          memory: 64Mi
          cpu: 10m
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 20s
        cutover: interrupted
  - id: board-1
    dashboards:
      - {from: dashboards/other.json}
    processes:
      - name: board-1
        lifecycle: application
        image: board
        runtime: none
        provides:
          http: 8080
        placement:
          memory: 64Mi
          cpu: 10m
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 20s
        cutover: interrupted
