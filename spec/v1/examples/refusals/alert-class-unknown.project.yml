# REFUSED: schema validation, against the closed AlertClass enumeration
#
# `AlertClass` is a closed vocabulary: `business-hours`, `urgent`, `page`
# (spec/v1/10-project-intent.md). There is no `none` member: an Application that
# wants no monitoring omits the block. A value outside the vocabulary is refused
# at schema validation, before composition runs, so no new error code carries
# this case.
#
# The Application publishes a signal, which isolates the defect: the only thing
# wrong here is the class itself.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0


project: refusals
owner: joris

applications:
  - id: unknown-class
    # Not a member of the enumeration. The signal beside it is well-formed, so
    # the class is the only defect.
    observability:
      alertClass: critical
      scrape:
        process: unknown-class-api
        surface: http
        path: /metrics

    processes:
      - name: unknown-class-api
        lifecycle: application
        image: unknown-class-api
        runtime: node

        provides:
          http: 8080

        placement:
          memory: 128Mi
          cpu: 25m

        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }

        startupBudget: 20s
        cutover: continuous
