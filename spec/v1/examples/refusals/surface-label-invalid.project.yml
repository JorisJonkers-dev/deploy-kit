# REFUSED: E_SURFACE_LABEL_INVALID
#
# Every pod that consumes a surface carries a label named by the Application's
# id and the surface, joined by a dot, and the provider's policy admits that
# label. A label's name is at most 63 characters, so this Application's id and
# its `http` surface name none
# (spec/v1/16-dependencies.md #the-consumer-label).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: surface-label-invalid-an-application-whose-id-runs-past-the-limit
    processes:
      - name: surface-label-invalid-api
        lifecycle: application
        image: surface-label-invalid-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
