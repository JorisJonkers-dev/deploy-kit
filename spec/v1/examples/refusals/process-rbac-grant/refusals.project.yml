# The refusal: the proxy declares Kubernetes API access, and the Platform
# document it is read beside admits no Application to hold any
# (spec/v1/16-dependencies.md#kubernetes-api-access-is-declared-and-admitted).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: edge-proxy
    processes:
      - name: edge-proxy
        lifecycle: application
        image: traefik
        runtime: none
        provides:
          http: 8080
        placement: { memory: 128Mi, cpu: 50m }
        api:
          reason: >-
            it reads the Secrets its routes name
          rules:
            - group: core
              objects: [secrets]
              verbs: [get, list, watch]
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 30s
        cutover: continuous
