# REFUSED: E_DASHBOARD_NOT_FOUND
#
# The Application ships dashboards/board.json, and no such file sits beside
# the project file. A dashboard is vendored JSON, never fetched, so there is
# nothing to render (spec/v1/10-project-intent.md #dashboards).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: board-0
    dashboards:
      - {from: dashboards/board.json}
    processes:
      - name: board-0
        lifecycle: application
        image: board
        runtime: none
        provides:
          http: 8080
        placement:
          memory: 64Mi
          cpu: 10m
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 20s
        cutover: interrupted
