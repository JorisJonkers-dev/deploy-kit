# ACCEPTED. The counterpart to cutover-rolling-over-rwo.project.yml.
#
# The same Process over the same `ReadWriteOnce` storage, declaring the cutover
# its storage can honour. The owner accepts stop-then-start, and the adapter
# derives the safe Kubernetes strategy (`Recreate`, with no surge) from the
# declared intent and the storage facts. No Kubernetes token appears here:
# `RollingUpdate`, `maxSurge` and `maxUnavailable` are the adapter's, not the
# Application author's (spec/v1/10-project-intent.md #cutover-is-declared-not-promised).
#
# Rendering that strategy is renderer proof, and there is no renderer yet. What
# this fixture proves today is the accepted half of the pair at the fixture
# layer: recreate over RWO is expressible and valid where rolling is refused.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

expect: accepted

project: refusals
owner: joris

applications:
  - id: recreate-over-rwo
    # No `observability` block: this fixture isolates the cutover defect.

    processes:
      - name: recreate-over-rwo-store
        lifecycle: application
        image: recreate-over-rwo-store
        runtime: static
        engine: valkey

        provides:
          redis: 6379

        placement:
          memory: 256Mi
          cpu: 50m

        probes:
          readiness: { path: /healthz/ready, port: 6379 }
          liveness: { path: /healthz/live, port: 6379 }

        startupBudget: 20s

        # The honest declaration over storage that cannot surge.
        cutover: recreate

        volumes:
          - claim: recreate-over-rwo-data
            mountAt: /data
            size: 1Gi
            durability: reconstructible
