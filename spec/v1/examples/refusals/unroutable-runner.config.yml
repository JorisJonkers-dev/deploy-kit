# REFUSED: the observability runner's own build fails.
#
# A copy of the estate's runner configuration with one receiver removed. Every
# class here is a valid member of `AlertClass`, and a Service declaring `page`
# publishes a signal, so nothing the model owns is wrong — the model has already
# accepted this estate. What fails is the runner: it cannot map `page` to a
# receiver, and it must fail rather than collect a signal that notifies nobody.
#
# This is the second of the two guarantees in
# spec/v1/examples/observability/README.md, stated as a fixture.

schemaVersion: 1.0.0
schema: observability.jorisjonkers.dev/v1

scrape:
  interval: 30s
  scrapeTimeout: 10s

# `page` is missing. That absence is the refusal.
receivers:
  none: null
  business-hours: discord-daytime
  urgent: discord-oncall

ruleCatalog:
  baseline: [target-absent, restart-loop, probe-failing]
  postgres: [replication-lag, connections-exhausted]
  rabbitmq: [queue-depth, consumers-zero]

requirement:
  every-class-above-none-maps-to-a-signal-and-a-receiver: true
