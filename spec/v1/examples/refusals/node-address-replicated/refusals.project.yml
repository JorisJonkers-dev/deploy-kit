# The project file this case's Platform document is read beside.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: mail
    l4Exposure:
      - {address: mail-node, port: 25, protocol: tcp, process: mail, surface: smtp}
    processes:
      - name: mail
        lifecycle: application
        image: stalwart
        runtime: none
        provides:
          smtp: 25
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 25 }
        startupBudget: 30s
        cutover: interrupted
        replicas: { count: 2, reason: two copies take mail while one restarts }
  - id: edge-proxy
    processes:
      - name: edge-proxy
        lifecycle: application
        image: traefik
        runtime: none
        provides:
          http: 8080
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 30s
        cutover: continuous
