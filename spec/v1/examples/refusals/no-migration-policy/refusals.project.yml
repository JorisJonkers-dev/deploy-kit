# REFUSED: E_NO_MIGRATION_POLICY
#
# `api` moves its schema with a changelog, which builds on the platform's
# migration runner, and this Platform document offers none
# (spec/v1/14-platform-intent.md#migration-policy).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: edge-proxy
    processes:
      - name: edge-proxy
        lifecycle: application
        image: traefik
        runtime: none
        provides:
          http: 8080
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 30s
        cutover: continuous
  - id: store
    processes:
      - name: store
        lifecycle: application
        image: postgres
        runtime: none
        engine: postgres
        provides:
          postgres: 5432
        placement: { memory: 256Mi, cpu: 50m }
        probes:
          readiness: { tcp: 5432 }
        startupBudget: 30s
        cutover: interrupted
        volumes:
          - { claim: store-data, mountAt: /var/lib/postgresql, size: 1Gi, durability: recoverable }
  - id: api
    migration:
      changelog: api/db/changelog.yml
    processes:
      - name: api
        lifecycle: application
        image: api
        runtime: node
        placement: { memory: 128Mi, cpu: 25m }
        startupBudget: 20s
        cutover: continuous
        dependsOn:
          - { application: store, surface: postgres }
