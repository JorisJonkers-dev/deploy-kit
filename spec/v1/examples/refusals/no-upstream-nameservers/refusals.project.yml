# The project file this case's Platform document is read beside.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: resolver
    l4Exposure:
      - {address: lan-dns, port: 53, protocol: udp, process: resolver, surface: dns}
      - {address: lan-dns, port: 53, protocol: tcp, process: resolver, surface: dns}
    processes:
      - name: resolver
        lifecycle: application
        image: library
        runtime: none
        provides:
          dns: 5353
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 5353 }
        startupBudget: 30s
        cutover: interrupted
  - id: edge-proxy
    processes:
      - name: edge-proxy
        lifecycle: application
        image: traefik
        runtime: none
        provides:
          http: 8080
        placement: { memory: 128Mi, cpu: 50m }
        probes:
          readiness: { tcp: 8080 }
        startupBudget: 30s
        cutover: continuous
