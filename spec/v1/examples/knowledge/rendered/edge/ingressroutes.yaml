# adapter: traefik-public
# real path: platform/cluster/flux/apps/edge/traefik-ingressroutes.yaml
#
# ESTATE-SCOPED FILE. The traefik-public adapter emits one file holding every
# public route in the estate; only the knowledge entries are shown. Nothing in
# this domain's own tree references it.
#
# No traefik-lan file: this exposure carries no `lan` audience, so the
# `traefik-lan` adapter renders nothing for knowledge.
#
# ONE exposure entry with five path rules becomes TWO IngressRoutes, because the
# rules carry two audiences and audience is what selects the middleware chain.
# Traefik orders rules by match specificity, so the four anonymous predicates
# beat the `/` catch-all without a priority field.
#
# The hostname is ASSIGNED -- the label + the tier's hostname policy + the
# cluster domain -- and read back from resolved.yml. It is also the one thing
# here with no declaring site: chapter 10's exposure entry has no field for the
# label at all (chapter 10, "Still to be graded" item 3). README, gap G-26.
#
# This single block replaces the six independent declarations of
# kb.jorisjonkers.dev: both catalogs, both IngressRoutes, the reachability
# channel and the Gatus endpoint.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knowledge-anonymous
  namespace: edge-system        # the route tier's namespace, not the Service's
  labels:
    app.kubernetes.io/name: knowledge-api
    app.kubernetes.io/part-of: knowledge
    app.kubernetes.io/managed-by: deploy-kit
  annotations:
    # The tier's DNS policy: the default rule is ingress.<publicDomain>, which a
    # tier may override with its own target. This example set carries no Cluster
    # Context document, so the default rule is what is applied.
    external-dns.alpha.kubernetes.io/target: ingress.jorisjonkers.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # audience: anonymous on all four rules. NO middlewares block -- that
      # absence is the whole derivation, and it is why /mcp answers a
      # workstation holding only a bearer token.
      match: Host(`kb.jorisjonkers.dev`) && (Path(`/mcp`) || PathPrefix(`/mcp/`) || Path(`/install.sh`) || Path(`/install-agents.sh`))
      services:
        - name: knowledge-api
          namespace: knowledge-system
          port: 8080
  tls: {}      # the default certificate comes from the edge pack's TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knowledge
  namespace: edge-system
  labels:
    app.kubernetes.io/name: knowledge-api
    app.kubernetes.io/part-of: knowledge
    app.kubernetes.io/managed-by: deploy-kit
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.jorisjonkers.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`kb.jorisjonkers.dev`) && PathPrefix(`/`)
      middlewares:
        # audience: authenticated on a public tier derives forward-auth. The
        # Service never names a middleware, a tier or an authMode; it names an
        # audience, and this is what the audience buys.
        - name: forward-auth
          namespace: edge-system
      services:
        - name: knowledge-api
          namespace: knowledge-system
          port: 8080
  tls: {}
