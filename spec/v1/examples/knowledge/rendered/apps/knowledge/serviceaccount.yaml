# adapter: kubernetes
# real path: platform/cluster/flux/apps/knowledge/knowledge/serviceaccount.yaml
#
# TWO ServiceAccounts for ONE Service. This is the per-Workload identity
# decision made visible (chapter 16): the account, the Vault Kubernetes auth
# role and the Vault policy are named for the WORKLOAD ALONE, in the domain's
# namespace. `knowledge-system.knowledge-api`, never
# `knowledge-system.knowledge-knowledge-api`. No Service prefix, and no
# collapsing rule.
#
# The registered `kubernetes` adapter's serviceAccountName() returns the Service
# name, so it emits ONE account today and both pods authenticate as one
# principal -- which would give knowledge-api, serving anonymous paths from the
# public internet, read on the ingest worker's SSH deploy key. See README,
# gap G-09.
#
# Uniqueness of these two names is checked across the whole DOMAIN file
# (E_DUPLICATE_WORKLOAD_NAME), not within the Service, because the namespace is
# the other half of Vault's binding and the namespace is shared.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledge-api
  namespace: knowledge-system
  labels:
    app.kubernetes.io/name: knowledge-api
    app.kubernetes.io/part-of: knowledge
    app.kubernetes.io/managed-by: deploy-kit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledge-ingest-worker
  namespace: knowledge-system
  labels:
    app.kubernetes.io/name: knowledge-ingest-worker
    app.kubernetes.io/part-of: knowledge
    app.kubernetes.io/managed-by: deploy-kit
