# adapter: kubernetes
# real path: platform/cluster/flux/apps/knowledge/knowledge/pvc.yaml
#
# ONE claim, declared by name on knowledge-ingest-worker. A PersistentVolumeClaim
# and no PersistentVolume: local-path provisions dynamically on first consumer,
# so the PV and its node affinity are created by the provisioner, not rendered.
#
# storageClassName is `local-path`. Longhorn is declared eligible on four nodes
# and no PVC in fleet-infra sets a storageClassName, so nothing in this estate
# is on Longhorn and this render does not pretend otherwise.
#
# ReadWriteOnce follows from local-path having no other mode, and it is what
# forces `Recreate` on the Deployment that mounts it -- the author's
# `zeroDowntime: false` records the same fact from the other side.
#
# `volumeClaimTemplate` is forbidden: a template ties the claim to the
# Workload's name, so renaming the Workload orphans the data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-vault-clone
  namespace: knowledge-system
  labels:
    app.kubernetes.io/name: knowledge-ingest-worker
    app.kubernetes.io/part-of: knowledge
    app.kubernetes.io/managed-by: deploy-kit
  annotations:
    # The one fact only the owning Service knows. Carried onto the object so a
    # delivery mechanism can refuse to prune it -- the model's second demand on
    # the separately-defined delivery work. The annotation KEY is a convention
    # this render is choosing; no chapter names one. README, gap G-14.
    deploy-kit.jorisjonkers.dev/durability: irreplaceable
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # CANNOT DERIVE. Capacity is platform-ASSIGNED and the author is forbidden
      # to write it, but no pinned input in this example set carries an
      # assignment: the node contract publishes disks[].usable_gib and no rule
      # allocates a number to a claim. For a claim that already exists the
      # bound PV's capacity would come from the ClusterState snapshot, and there
      # is no snapshot here. A PVC without this field does not apply.
      # See README, gap G-15.
      storage: null
