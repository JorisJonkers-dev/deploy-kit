# Worked example — the knowledge domain's Intent Fragment
#
#   services/knowledge/platform/knowledge.yml
#
# One file per domain, one file one Intent Fragment
# (docs/adr/0063-intent-authored-per-domain.md). The knowledge domain owns one
# Service today; the namespace derives from the header as knowledge-system,
# which is the namespace it already runs in.
#
# Exercises: two Workloads on two runtimes and therefore two identities, five
# path rules with mixed audiences, `probes: none` for a Workload with no
# listener, grants at BOTH levels, a split Subtree path beside an unsplit one,
# and an irreplaceable volume.
#
# Companion env files, one per WORKLOAD
# (docs/adr/0011-configuration-env-files-per-workload.md):
#   platform/env/knowledge-api/base.env
#     -- reproduced as examples/knowledge-api.base.env
#   platform/env/knowledge-ingest-worker/base.env
#     -- reproduced as examples/knowledge-ingest-worker.base.env

# The data model's own semver, not the toolkit's
# (docs/adr/0039-artifact-schema-versioning.md).
schemaVersion: 1.0.0

domain: knowledge
owner: joris              # the only field raised to the domain header

services:
  # =============================================================== knowledge
  - id: knowledge
    alertClass: business-hours    # per Service; never raised to the domain

    # The two Workloads below switch together, because they are one Service and
    # a Service is the unit of atomic release
    # (docs/adr/0062-service-is-the-release-unit.md). Nothing declares that: the
    # boundary carries it. If the ingest worker misses its startup budget, the
    # API stays on its old version too, and a rollback takes both back.
    #
    # A Service is still not a Reconcile Unit: `platform-postgres` before
    # `knowledge` is ordering, derived from the edge set
    # (docs/adr/0032-reconcile-unit-derived.md), and the later unit waits rather
    # than being held.

    # Shared grants. Both Workloads read the same Postgres and RabbitMQ
    # credentials, so declaring them once here is the difference between one
    # edit and two when a key is added. A Service-level grant is held by every
    # Workload, including ones added later; a grant that must NOT be shared
    # moves down a level, and there is no removal syntax
    # (docs/adr/0022-grants-live-on-the-service.md).
    #
    # `secrets` stays on the Service and is never raised to the domain header: a
    # domain-level grant would hand every Service in the file a reader slot on
    # the whole path (docs/adr/0009-vault-read-is-per-path.md).
    #
    # `delivery: env` and `delivery: file` render a Kubernetes Secret, so both
    # are refused unless the pinned Cluster Context advertises
    # `secretsEncryption: true` -- E_SECRETS_AT_REST_REQUIRED
    # (docs/adr/0028-secrets-at-rest-gate.md). Until that flag lands on the
    # pinned k3s version, knowledge cannot ship.
    secrets:
      # SPLIT PATH, one path per reader set
      # (docs/adr/0023-grant-unit-is-the-path.md). A KV-v2 read returns the
      # whole document, so the only boundary the store can enforce is the path:
      # while every consumer's credentials shared secret/data/platform/postgres,
      # these pods could read auth-api's database password. The reader set here
      # is knowledge's two Workloads; auth-api reads .../postgres/auth.
      - path: secret/data/platform/postgres/kb
        keys: [user, password]
        access: read
        delivery: env
        rotation: {tolerates: restart}

      # NOT split. Its reader set is already exactly this Service's two
      # Workloads, and the rule is one path per reader SET, not one path per
      # consumer. It splits on the day a second Service is granted it.
      - path: secret/data/platform/rabbitmq
        keys: [rabbitmq.user, rabbitmq.password]
        access: read
        delivery: env
        rotation: {tolerates: restart}

    workloads:
      # ------------------------------------------------------ knowledge-api
      - name: knowledge-api
        # Identity is the Workload name under the domain namespace:
        # `knowledge-system.knowledge-api`
        # (docs/adr/0024-identity-per-workload.md).
        lifecycle: service
        image: knowledge-api    # alias -> digest through the images lock
        runtime: jvm            # -> otel-jvm profile: 10 OTEL, 6 PYROSCOPE

        # Surfaces are a property of the process, so they sit on the Workload.
        # The rendered Kubernetes port name is the surface name, which is how
        # 'http' survives. A consumer names the Service and the surface, never
        # a port integer: `dependsOn: {service: knowledge, surface: http}`.
        provides:
          http: 8080

        # Hard dimensions, all of which must match
        # (docs/adr/0061-placement-is-hard-dimensions.md).
        placement:
          memory: 768Mi         # a JVM service at its default heap. Raw, not a
                                # class: a class name cannot be compared to a
                                # node's allocatable without carrying the table,
                                # and the comparison is now arithmetic
          cpu: 250m             # request only; no cpu limit is derived
          capabilities: [public-ingress]
          # frankfurt-contabo-1 is the only node advertising public-ingress, so
          # this replaces `nodeSelector: {site: frankfurt}` without naming a
          # site. It is a hard filter like every other dimension: if the
          # capability leaves the fleet, the build fails with
          # E_PLACEMENT_UNSATISFIABLE rather than the pod placing anywhere and
          # the surface going dark.

        # No `hardening` block. The default `restricted` class applies
        # unstated: runAsNonRoot, readOnlyRootFilesystem, drop ALL, seccomp
        # RuntimeDefault. This image is built here and meets it
        # (docs/adr/0016-pod-hardening.md).

        dependsOn:
          - {service: platform-postgres, surface: postgres}
          - {service: platform-rabbitmq, surface: amqp}

        exposure:
          - port: 8080          # integer, at its point of use
            audience: authenticated
            paths:
              - {path: /mcp,               match: exact,  audience: anonymous}
              - {path: /mcp/,              match: prefix, audience: anonymous}
              - {path: /install.sh,        match: exact,  audience: anonymous}
              - {path: /install-agents.sh, match: exact,  audience: anonymous}
              - {path: /, match: prefix, audience: authenticated}
            # No hostname. kb.jorisjonkers.dev is assigned, and this block
            # replaces the six places it used to be declared independently.

        probes:
          readiness:
            path: /api/actuator/health/readiness
            port: 8080
          liveness:
            path: /api/actuator/health/liveness
            port: 8080
          # Distinct paths, stated. A liveness probe on the readiness endpoint
          # turns a Postgres outage into a crash-loop
          # (docs/adr/0014-probes-are-siblings.md).

        startupBudget: 600s     # JVM cold start measured at ~250-300s
        zeroDowntime: true      # the MCP endpoint 503s if a roll opens a gap

        scrape:
          port: 8080            # resolves to port name 'http' via provides
          path: /api/actuator/prometheus

        # Workload-level grant: the API serves /mcp, the worker does not. This
        # is an access boundary only because identity is per Workload -- this
        # pod authenticates as `knowledge-api` and the worker as
        # `knowledge-ingest-worker`, each bound to exactly its own effective
        # grant set, which is the Service-level list plus this one
        # (docs/adr/0024-identity-per-workload.md).
        secrets:
          - path: secret/data/knowledge-system/mcp-bearer
            keys: [workstation]
            access: read
            delivery: env
            rotation: {tolerates: restart}

      # --------------------------------------------- knowledge-ingest-worker
      - name: knowledge-ingest-worker
        lifecycle: service
        image: knowledge-ingest-worker
        runtime: python         # a different profile: 5 OTEL keys plus
                                # OTEL_PYTHON_LOG_CORRELATION, no JVM batch
                                # tuning

        # No `provides`. A RabbitMQ consumer opens no listener, so it declares
        # no surface, nothing can depend on it, and the derived default-deny
        # policy gives it no ingress at all
        # (docs/adr/0035-network-policy-default-deny.md).

        placement:
          memory: 256Mi         # a single-consumer queue worker, not a server
          cpu: 50m
          # Nothing else is declared, and the volume below is why nothing more
          # is needed: a `local-path` PV pins this Workload to the node holding
          # it. That pinning is DERIVED -- read from the pinned ClusterState
          # snapshot (docs/adr/0034-cluster-state-pinned-input.md) -- rather
          # than restated here as a dimension that could disagree with the
          # binding.

        # Default `restricted` again, and nothing here fights it: the deploy key
        # arrives on a projected volume, not on the root filesystem, so
        # readOnlyRootFilesystem costs this Workload nothing.

        dependsOn:
          - {service: platform-rabbitmq, surface: amqp}
          - {service: platform-postgres, surface: postgres}

        # A RabbitMQ consumer with no listener. Declared, not omitted, so the
        # absence is a decision rather than an oversight
        # (docs/adr/0014-probes-are-siblings.md).
        probes: none

        startupBudget: 120s
        zeroDowntime: false     # forced, not chosen: the ReadWriteOnce
                                # local-path volume below cannot attach to two
                                # pods at once, so the strategy derives to
                                # Recreate

        stateful: true
        volumes:
          - claim: knowledge-vault-clone
            mountAt: /var/lib/knowledge-vault
            durability: irreplaceable
            # The one fact only the owning Service knows
            # (docs/adr/0015-durability-class-per-volume.md); schedule, sweep
            # and destination are derived. `irreplaceable` renders a backup job
            # with retention plus an off-cluster copy, and its restore must be
            # rehearsed before the first production apply
            # (docs/adr/0057-datastore-and-restore.md).
            #
            # Not declared: storage class and volume size -- both draw on finite
            # node disk and are assigned. A `placement.disk` dimension filters
            # which nodes are ELIGIBLE to hold a claim; it does not decide how
            # large the claim is.

        # Workload-level, and `delivery: file` because an SSH private key cannot
        # be an environment variable. This is the grant that makes per-Workload
        # identity load-bearing: under one identity per Service the
        # internet-facing API Workload would authenticate as a principal holding
        # `read` on this key, and the store cannot narrow a read below the path
        # (docs/adr/0009-vault-read-is-per-path.md).
        secrets:
          - path: secret/data/knowledge-system/vault-deploy-key
            keys: [key]
            access: read
            delivery: file
            mountAt: /home/worker/.ssh/id_ed25519
            fileMode: "0400"
            rotation: {tolerates: restart}
