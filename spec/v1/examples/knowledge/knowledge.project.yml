# Worked example: the knowledge project's Intent Fragment
#
#   applications/knowledge/platform/knowledge.yml
#
# One file per project, one file one Intent Fragment
# (docs/adr/model/0063-intent-authored-per-project.md). The knowledge project owns one
# Application today; the namespace derives from the header as knowledge-system,
# which is the namespace it already runs in.
#
# Exercises: two Processes on two runtimes and therefore two identities, one
# authored hostname whose five routes carry mixed audiences -- four anonymous
# overrides inside an authenticated host -- `probes: none` for a Process with
# no listener, grants at BOTH levels, a split Subtree path beside an unsplit
# one, and an irreplaceable volume.
#
# Companion env files, one per PROCESS
# (docs/adr/model/0011-configuration-env-files-per-process.md):
#   platform/env/knowledge-api/base.env
#     -- reproduced as examples/knowledge-api.base.env
#   platform/env/knowledge-ingest-worker/base.env
#     -- reproduced as examples/knowledge-ingest-worker.base.env

# The data model's own semver, not the toolkit's
# (docs/adr/model/0039-artifact-schema-versioning.md).
apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: knowledge
owner: joris              # the only field raised to the project header

applications:
  # =============================================================== knowledge
  - id: knowledge
    # Per Application; never raised to the project. The api Process publishes for
    # the Application, and the ingest worker publishes nothing of its own.
    observability:
      alertClass: business-hours
      scrape:
        process: knowledge-api
        surface: http
        path: /api/actuator/prometheus

    # The two Processes below switch together, because they are one Application and
    # an Application is the unit of atomic release
    # (docs/adr/model/0062-application-is-the-release-unit.md). Nothing declares that: the
    # boundary carries it. If the ingest worker misses its startup budget, the
    # API stays on its old version too, and a rollback takes both back.
    #
    # An Application is still not a Reconcile Unit: `platform-postgres` before
    # `knowledge` is ordering, derived from the edge set
    # (docs/adr/model/0032-reconcile-unit-derived.md), and the later unit waits rather
    # than being held.

    # Shared grants. Both Processes read the same Postgres and RabbitMQ
    # credentials, so declaring them once here is the difference between one
    # edit and two when a key is added. An Application-level grant is held by every
    # Process, including ones added later; a grant that must NOT be shared
    # moves down a level, and there is no removal syntax
    # (docs/adr/model/0022-grants-live-on-the-application.md).
    #
    # `secrets` stays on the Application and is never raised to the project header: a
    # project-level grant would hand every Application in the file a reader slot on
    # the whole path (docs/adr/model/0009-vault-read-is-per-path.md).
    #
    # `delivery: env` and `delivery: file` render a Kubernetes Secret, so both
    # are refused unless the pinned Platform document advertises
    # `secretsEncryption: true` -- E_SECRETS_AT_REST_REQUIRED
    # (docs/adr/model/0028-secrets-at-rest-gate.md). Until that flag lands on the
    # pinned k3s version, knowledge cannot ship.
    secrets:
      # SPLIT PATH, one path per reader set
      # (docs/adr/model/0023-grant-unit-is-the-path.md). A KV-v2 read returns the
      # whole document, so the only boundary the store can enforce is the path:
      # while every consumer's credentials shared secret/data/platform/postgres,
      # these pods could read auth-api's database password. The reader set here
      # is knowledge's two Processes; auth-api reads .../postgres/auth.
      - path: secret/data/platform/postgres/kb
        keys: [user, password]
        access: read
        delivery: env
        rotation: {tolerates: restart}

      # NOT split. Its reader set is already exactly this Application's two
      # Processes, and the rule is one path per reader SET, not one path per
      # consumer. It splits on the day a second Application is granted it.
      - path: secret/data/platform/rabbitmq
        keys: [rabbitmq.user, rabbitmq.password]
        access: read
        delivery: env
        rotation: {tolerates: restart}

    # ONE hostname, ONE Process behind it -- and it still belongs to the
    # Application, because `exposure` says *this hostname routes here* while
    # `provides` says *this process listens on this port*
    # (review/EXPOSURE-MANIFEST.md). knowledge-ingest-worker declares no
    # `provides`, so no route can name it and it appears in none below.
    #
    # `host` is the full FQDN, authored. Nothing derives it: the estate also
    # answers on kb.jorisjonkers.dev, `platform-rabbitmq` serves rabbitmq, and
    # `status` belongs to no Application -- a `<application>.<zone>` rule would be right
    # here and silently wrong there, and the wrong ones are the ones nobody
    # checks. This block replaces the six places the hostname used to be
    # declared independently: both catalogs, both IngressRoutes, the
    # reachability channel and the Gatus endpoint.
    exposure:
      - name: public              # unique within the Application, and what
                                  # ${exposure:knowledge.public#url} addresses
        host: knowledge.jorisjonkers.dev
        audience: authenticated   # the exposure's audience is the default for
                                  # every route under it
        routes:
          # PER-ROUTE `audience` IS AN OVERRIDE, and this is the case it exists
          # for: anonymous paths inside an authenticated host. /mcp answers a
          # workstation holding only a bearer token, and the two install
          # scripts are fetched by curl before any session exists. The `/`
          # catch-all keeps the Application's audience, so everything else is
          # behind forward-auth -- derived from the audience, never named here
          # (docs/adr/model/0018-exposure-by-audience.md).
          #
          # Written as block mappings rather than one-liners only because five
          # fields do not fit a line; the shape is the same one auth's two
          # routes use.
          - path: /mcp
            match: exact
            process: knowledge-api
            surface: http
            audience: anonymous     # override
          - path: /mcp/
            match: prefix
            process: knowledge-api
            surface: http
            audience: anonymous     # override
          - path: /install.sh
            match: exact
            process: knowledge-api
            surface: http
            audience: anonymous     # override
          - path: /install-agents.sh
            match: exact
            process: knowledge-api
            surface: http
            audience: anonymous     # override
          - path: /
            match: prefix
            process: knowledge-api
            surface: http           # no `audience`: the Application's stands
        # No `contentPolicy`: this Application picks no CSP profile, so it takes the
        # baseline the tier derives. The field is optional and the vocabulary
        # stops there -- `contentPolicy` and `redirectTo` are the whole of what
        # an author may say about the proxy.

    processes:
      # ------------------------------------------------------ knowledge-api
      - name: knowledge-api
        # Identity is the Process name under the project namespace:
        # `knowledge-system.knowledge-api`
        # (docs/adr/model/0024-identity-per-process.md).
        lifecycle: application
        image: knowledge-api    # alias -> digest through the images lock
        runtime: jvm            # -> otel-jvm profile: 10 OTEL, 6 PYROSCOPE

        # The JVM writes to /tmp. Declared, mounted as an emptyDir, and the
        # read-only root control stays intact
        # (docs/adr/model/0092-writable-paths-are-declared.md).
        writablePaths: [/tmp]

        # Surfaces are a property of the process, so they sit on the Process.
        # The rendered Kubernetes port name is the surface name, which is how
        # 'http' survives. A consumer names the Application and the surface, never
        # a port integer: `dependsOn: {application: knowledge, surface: http}`.
        provides:
          http: 8080

        # Hard dimensions, all of which must match
        # (docs/adr/model/0061-placement-is-hard-dimensions.md).
        placement:
          memory: 768Mi         # a JVM application at its default heap. Raw, not a
                                # class: a class name cannot be compared to a
                                # node's allocatable without carrying the table,
                                # and the comparison is now arithmetic
          cpu: 250m             # request only; no cpu limit is derived
          capabilities: [public-ingress]
          # frankfurt-contabo-1 is the only node advertising public-ingress, so
          # this replaces `nodeSelector: {site: frankfurt}` without naming a
          # site. It is a hard filter like every other dimension: if the
          # capability leaves the fleet, the build fails with
          # E_PLACEMENT_UNSATISFIABLE rather than the pod placing anywhere and
          # the surface going dark.

        # No `hardening` block. The default `restricted` class applies
        # unstated: runAsNonRoot, readOnlyRootFilesystem, drop ALL, seccomp
        # RuntimeDefault. This image is built here and meets it
        # (docs/adr/model/0016-pod-hardening.md).

        dependsOn:
          - {application: platform-postgres, surface: postgres}
          - {application: platform-rabbitmq, surface: amqp}

        # No `exposure` here: the five routes and the hostname they hang off
        # sit on the Application above, and each route names this Process and its
        # `http` surface. `provides` is what stays.

        probes:
          readiness:
            path: /api/actuator/health/readiness
            port: 8080
          liveness:
            path: /api/actuator/health/liveness
            port: 8080
          # Distinct paths, stated. A liveness probe on the readiness endpoint
          # turns a Postgres outage into a crash-loop
          # (docs/adr/model/0014-probes-are-siblings.md).

        startupBudget: 600s     # JVM cold start measured at ~250-300s

        # REQUIRED, no default. This Process holds no volume, and its owner
        # requires continuity: the MCP endpoint 503s if a roll opens a gap.
        cutover: rolling

        # No `replicas` block: the derived count is one. Capacity is the only
        # local exception to a derived value, and this Process needs none.

        # Process-level grant: the API serves /mcp, the worker does not. This
        # is an access boundary only because identity is per Process -- this
        # pod authenticates as `knowledge-api` and the worker as
        # `knowledge-ingest-worker`, each bound to exactly its own effective
        # grant set, which is the Application-level list plus this one
        # (docs/adr/model/0024-identity-per-process.md).
        secrets:
          - path: secret/data/knowledge-system/mcp-bearer
            keys: [workstation]
            access: read
            delivery: env
            rotation: {tolerates: restart}

      # --------------------------------------------- knowledge-ingest-worker
      - name: knowledge-ingest-worker
        lifecycle: application
        image: knowledge-ingest-worker
        runtime: python         # a different profile: 5 OTEL keys plus
                                # OTEL_PYTHON_LOG_CORRELATION, no JVM batch
                                # tuning

        # No `provides`. A RabbitMQ consumer opens no listener, so it declares
        # no surface, nothing can depend on it, and the derived default-deny
        # policy gives it no ingress at all
        # (docs/adr/model/0035-network-policy-default-deny.md).

        placement:
          memory: 256Mi         # a single-consumer queue worker, not a server
          cpu: 50m
          # Nothing else is declared, and the volume below is why nothing more
          # is needed: a `local-path` PV pins this Process to the node holding
          # it. That pinning is DERIVED -- read from the pinned ClusterState
          # snapshot (docs/adr/model/0034-cluster-state-pinned-input.md) -- rather
          # than restated here as a dimension that could disagree with the
          # binding.

        # Default `restricted` again, and nothing here fights it: the deploy key
        # arrives on a projected volume, not on the root filesystem, so
        # readOnlyRootFilesystem costs this Process nothing.

        dependsOn:
          - {application: platform-rabbitmq, surface: amqp}
          - {application: platform-postgres, surface: postgres}

        # A RabbitMQ consumer with no listener. Declared, not omitted, so the
        # absence is a decision rather than an oversight
        # (docs/adr/model/0014-probes-are-siblings.md).
        probes: none

        startupBudget: 120s

        # `recreate`, and it is the only honourable answer: the ReadWriteOnce
        # local-path volume below cannot attach to two pods at once, so
        # `cutover: rolling` here is E_CUTOVER_UNHONOURABLE rather than a
        # strategy silently derived to Recreate. The owner states the
        # stop-then-start that the storage already forces.
        cutover: recreate

        # A file-level copy is the backup method for a directory of files, and
        # `irreplaceable` derives one -- so the engine is required here
        # (docs/adr/model/0077-durability-derives-a-backup.md,
        # docs/adr/model/0078-engine-is-process-vocabulary.md).
        engine: files

        volumes:
          - claim: knowledge-vault-clone
            mountAt: /var/lib/knowledge-vault
            size: 20Gi
            durability: irreplaceable
            # The one fact only the owning Application knows
            # (docs/adr/model/0015-durability-class-per-volume.md); schedule, sweep
            # and destination are derived. `irreplaceable` renders a backup job
            # with retention plus an off-cluster copy, and its restore must be
            # rehearsed before the first production apply
            # (docs/adr/model/0057-datastore-and-restore.md).
            #
            # Not declared: storage class and volume size -- both draw on finite
            # node disk and are assigned. A `placement.disk` dimension filters
            # which nodes are ELIGIBLE to hold a claim; it does not decide how
            # large the claim is.

        # Process-level, and `delivery: file` because an SSH private key cannot
        # be an environment variable. This is the grant that makes per-Process
        # identity load-bearing: under one identity per Application the
        # internet-facing API Process would authenticate as a principal holding
        # `read` on this key, and the store cannot narrow a read below the path
        # (docs/adr/model/0009-vault-read-is-per-path.md).
        secrets:
          - path: secret/data/knowledge-system/vault-deploy-key
            keys: [key]
            access: read
            delivery: file
            mountAt: /home/worker/.ssh/id_ed25519
            fileMode: "0400"
            rotation: {tolerates: restart}
