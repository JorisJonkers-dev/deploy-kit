# applications/knowledge/.github/workflows/publish-fragment.yml
#
# Publishes this repository's Intent Fragment once its images are built.
#
#   images built on main -> validate -> resolve image digests -> build fragment
#                                                            -> oras push
#                                                            -> oras resolve
#                                                            -> verify digest
#
# ONE PROJECT FILE IS ONE FRAGMENT (docs/adr/model/0063-intent-authored-per-project.md).
# This repository holds one, platform/knowledge.project.yml, so it publishes one
# fragment; a repository holding several project files runs these steps once per
# file, and a project never spans repositories, so no fragment is ever a partial
# project.
#
# Fires AFTER this repository's image build on main, never beside it. A
# fragment names only images that exist: every alias it names is resolved to a
# digest, a UID and a GID in the fragment's own share of the images lock, so a
# composition never renders a reference nothing can pull
# (docs/adr/model/0133-a-project-is-delivered-as-a-signed-artifact-pinned-by-digest.md,
# amending docs/adr/model/0037-composition-oci-fragments.md). The image build
# runs on every merge to main, so an intent-only change still publishes, a few
# minutes later, and never waits for a version tag
# (docs/adr/model/0038-participants-list-staleness.md). Whether and how a change
# is co-tested against other units before it reaches a cluster stays parked:
# see docs/adr/deferred/README.md.
#
# ONE job, many steps. Jobs are billed by the minute rounded up, so splitting a
# fast pipeline across parallel jobs multiplies its cost while the work stays
# identical. Each step carries `if: ${{ !cancelled() }}` so a single failure
# still surfaces the rest.
name: Publish Intent Fragment

on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-fragment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    # Only a build that succeeded has images to name.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the images were built from, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install the toolkit at this repository's pinned version
        run: |
          # The version lives in ONE place: this repository's own lockfile,
          # bumped by Renovate behind the ordering gate
          # (docs/adr/model/0040-renovate-ordering-gate.md). Restating it here is how
          # the previous render-local.sh copies went stale by four minor
          # releases.
          #
          # It is NOT read from the project file's schemaVersion. That
          # field is the DATA MODEL's own semver and no longer tracks the
          # package version (docs/adr/model/0039-artifact-schema-versioning.md):
          # reading it as a package version pins the toolkit to a release that
          # may not exist, and hides the real pin from Renovate. Composition
          # checks the fragment's schemaVersion against the composing toolkit's
          # range -- same major, minor <= toolkit -- and that check belongs
          # there, over the union, not here.
          npm ci

      - name: Validate intent locally
        if: ${{ !cancelled() }}
        run: |
          # Local-only checks: schema shape, forbidden fields, and
          # placeholder-to-grant agreement WITHIN this repository -- every
          # ${secret:...} byte-matches a granted path and every delivery: env
          # grant has a placeholder (docs/adr/model/0027-secret-reference-join-key.md).
          # Estate-wide invariants cannot be checked here and are
          # composition's job.
          npx --no-install deploy-config-schema intent validate \
            --project platform/knowledge.project.yml \
            --env-dir platform/env \
            --strict

      - name: Resolve every image this project names
        if: ${{ !cancelled() }}
        run: |
          # The fragment's own share of the images lock: each alias the project
          # file names, resolved to the digest the build just pushed, with the
          # numeric UID and GID the image runs as
          # (docs/adr/model/0082-images-lock-carries-uid-and-gid.md). A tag in
          # this file would be a mutable input, so it holds digests only, and
          # an alias with no image yet fails here rather than at pod start.
          npx --no-install deploy-config-schema intent lock-images \
            --project platform/knowledge.project.yml \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --commit "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --out images.lock

      - name: Build the fragment tree
        if: ${{ !cancelled() }}
        run: |
          # --env-dir holds one directory per PROCESS
          # (docs/adr/model/0011-configuration-env-files-per-process.md):
          # platform/env/knowledge-api/base.env and
          # platform/env/knowledge-ingest-worker/base.env, each with its own
          # per-cluster overlay. Process names are unique within a project, so
          # one directory per Process is unambiguous across every Application the
          # file declares (docs/adr/model/0024-identity-per-process.md).
          npx --no-install deploy-config-schema intent pack \
            --project platform/knowledge.project.yml \
            --env-dir platform/env \
            --images images.lock \
            --out fragment/

          # inputsSha covers AUTHORED inputs only, never generated output.
          # homelab-inventory derives inventorySourceSha the same way; a hash
          # that included generated output would change on every publish and
          # detect nothing.
          find platform -type f -print0 | sort -z \
            | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > fragment/INPUTS_SHA

          # Per-file digests, so a consumer can verify the package it pulled.
          ( cd fragment && find . -type f -not -name MANIFEST.sha256 \
              | sort | xargs sha256sum > MANIFEST.sha256 )

      - uses: oras-project/setup-oras@v1
        if: ${{ !cancelled() }}

      - name: Push and resolve
        id: resolve
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="ghcr.io/${{ github.repository_owner }}/intent-knowledge:latest"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          ( cd fragment && oras push "$REF" \
              --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
              --annotation "dev.jorisjonkers.inputs-sha=$(cat INPUTS_SHA)" \
              . )

          # An artefact cannot contain its own digest, so it is resolved AFTER
          # the push and recorded by the consumer. This is why the composition
          # lock is an output rather than an input
          # (docs/adr/model/0037-composition-oci-fragments.md).
          DIGEST="$(oras resolve "$REF")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify the value, not the command
        if: ${{ !cancelled() }}
        run: |
          # A successful push is not evidence that a consumer can read what we
          # meant. Pull it back by digest and check the content.
          oras pull "ghcr.io/${{ github.repository_owner }}/intent-knowledge@${{ steps.resolve.outputs.digest }}" \
            --output verify/
          ( cd verify && sha256sum -c MANIFEST.sha256 )
          test "$(cat verify/INPUTS_SHA)" = "$(cat fragment/INPUTS_SHA)"
          echo "verified: $(cat verify/INPUTS_SHA)"
