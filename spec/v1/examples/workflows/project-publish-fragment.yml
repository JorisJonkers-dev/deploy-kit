# applications/knowledge/.github/workflows/publish-fragment.yml
#
# Publishes this repository's Intent Fragment once a release's images are built.
#
#   images built on a release tag -> validate -> resolve image digests -> build fragment
#                                                            -> oras push
#                                                            -> oras resolve
#                                                            -> verify digest
#
# ONE PROJECT FILE IS ONE FRAGMENT (docs/adr/model/0009-intent-is-authored-one-file-per-project.md).
# This repository holds one, platform/knowledge.project.yml, so it publishes one
# fragment; a repository holding several project files runs these steps once per
# file, and a project never spans repositories, so no fragment is ever a partial
# project.
#
# Fires AFTER this repository's image build for a release tag, never beside it,
# and never for a merge that is not released: release-please tags the release,
# the tag builds the images, and only then does the fragment publish, carrying
# the release's version
# (docs/adr/model/0083-a-fragment-publishes-on-a-release-tag.md). A fragment
# names only images that exist: every alias it names is resolved to a digest, a
# UID and a GID in the fragment's own share of the images lock, so a
# composition never renders a reference nothing can pull
# (docs/adr/model/0051-a-project-is-delivered-as-a-signed-artifact.md). Whether and how a change
# is co-tested against other units before it reaches a cluster stays parked:
# see docs/adr/deferred/README.md.
#
# ONE job, many steps. Jobs are billed by the minute rounded up, so splitting a
# fast pipeline across parallel jobs multiplies its cost while the work stays
# identical. Each check carries `if: ${{ !cancelled() }}` so a single failure
# still surfaces the rest; the push runs only when every check succeeded, so a
# failed validation or an image that does not resolve publishes nothing.
name: Publish Intent Fragment

on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
    # A tag-triggered run reports the tag as its head branch.
    branches: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-fragment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    # Only a build that succeeded has images to name.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the images were built from, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install the toolkit at this repository's pinned version
        run: |
          # The version lives in ONE place: this repository's own lockfile,
          # bumped by Renovate behind the ordering gate
          # (docs/adr/model/0047-one-publication-path.md). Restating it here is how
          # the previous render-local.sh copies went stale by four minor
          # releases.
          #
          # It is NOT read from the project file's schemaVersion. That
          # field is the DATA MODEL's own semver and no longer tracks the
          # package version (docs/adr/model/0044-artifact-schema-versioning.md):
          # reading it as a package version pins the toolkit to a release that
          # may not exist, and hides the real pin from Renovate. Composition
          # checks the fragment's schemaVersion against the composing toolkit's
          # range -- same major, minor <= toolkit -- and that check belongs
          # there, over the union, not here.
          npm ci

      - name: Validate intent locally
        if: ${{ !cancelled() }}
        run: |
          # Local-only checks: schema shape, forbidden fields, and
          # placeholder-to-grant agreement WITHIN this repository -- every
          # ${secret:...} byte-matches a granted path and every delivery: env
          # grant has a placeholder (docs/adr/model/0030-secret-delivery-is-env-file-or-self.md).
          # Estate-wide invariants cannot be checked here and are
          # composition's job. A directory is read as every file below it, so
          # the env files reach the project file they sit beside.
          npx --no-install deploy-kit validate \
            platform/knowledge.project.yml \
            platform/env

      - uses: oras-project/setup-oras@v1
        if: ${{ !cancelled() }}

      - name: Lock the release's images
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every image this repository builds, resolved to the digest THIS
          # release's build pushed, with the user the image runs as, read from
          # the image itself (docs/adr/model/0020-hardening-is-one-platform-posture.md).
          # Nothing here names a digest by hand, and nothing later reads a tag.
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          {
            echo "apiVersion: lock.jorisjonkers.dev/v1"
            echo "kind: ImagesLock"
            echo "schemaVersion: 1.0.0"
            echo "name: knowledge"
            echo "images:"
            # The two Processes' images, and the migration image built FROM the
            # platform's runner with the Application's changelog in it.
            for alias in knowledge-api knowledge-ingest-worker knowledge-migration; do
              repository="ghcr.io/${{ github.repository }}/${alias}"
              digest="$(oras resolve "${repository}:${TAG}")"
              # The user is the image's own, and numeric: a name is
              # E_IMAGE_USER_NOT_NUMERIC, because the posture runs a number.
              user="$(oras manifest fetch-config "${repository}@${digest}" | jq -r '.config.User')"
              echo "  ${alias}:"
              echo "    repository: ${repository}"
              echo "    digest: \"${digest}\""
              echo "    uid: ${user%%:*}"
              echo "    gid: ${user##*:}"
            done
          } > images.lock.yml

      - name: Pack the fragment
        if: ${{ !cancelled() }}
        run: |
          # The fragment is the project file, the env files under platform/env
          # -- one directory per PROCESS
          # (docs/adr/model/0013-configuration-is-dotenv-at-three-scopes.md),
          # each with its own per-cluster overlay -- the Asset files it names,
          # and the migration proof beside it. fragment.yml records the release
          # and inputsSha, which covers AUTHORED inputs only, never generated
          # output: homelab-inventory derives inventorySourceSha the same way,
          # and a hash that included generated output would change on every
          # publish and detect nothing.
          #
          # The fragment's own share of the images lock is packed from the
          # lock the step above wrote: the aliases the project file names and
          # no other. An alias that lock does not hold is E_UNLOCKED_IMAGE
          # here, so a fragment never names an image nothing can pull
          # (docs/adr/model/0090-composition-unions-each-fragments-share-of-the-images-lock.md).
          TAG="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          npx --no-install deploy-kit publish platform/knowledge.project.yml \
            --repository "${{ github.repository }}" \
            --source-sha "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --version "${TAG#v}" \
            --images-lock images.lock.yml \
            --out fragment/

          # Per-file digests, so a consumer can verify the package it pulled.
          ( cd fragment && find . -type f -not -name MANIFEST.sha256 \
              | sort | xargs sha256sum > MANIFEST.sha256 )

      - name: Push and resolve
        id: resolve
        if: ${{ success() }}
        run: |
          REF="ghcr.io/${{ github.repository_owner }}/intent-knowledge:latest"

          # The release's version, without the tag's leading v.
          TAG="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          ( cd fragment && oras push "$REF" \
              --annotation "org.opencontainers.image.version=${TAG#v}" \
              --annotation "org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}" \
              --annotation "dev.jorisjonkers.inputs-sha=$(yq '.spec.inputsSha' fragment.yml)" \
              . )

          # An artefact cannot contain its own digest, so it is resolved AFTER
          # the push and recorded by the consumer. This is why the composition
          # lock is an output rather than an input
          # (docs/adr/model/0042-declarations-compose-from-intent-fragments.md).
          DIGEST="$(oras resolve "$REF")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify the value, not the command
        if: ${{ success() }}
        run: |
          # A successful push is not evidence that a consumer can read what we
          # meant. Pull it back by digest and check the content.
          oras pull "ghcr.io/${{ github.repository_owner }}/intent-knowledge@${{ steps.resolve.outputs.digest }}" \
            --output verify/
          ( cd verify && sha256sum -c MANIFEST.sha256 )
          cmp verify/fragment.yml fragment/fragment.yml
          echo "verified: $(yq '.spec.inputsSha' verify/fragment.yml)"
