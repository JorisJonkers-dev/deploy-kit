# estate/.github/workflows/compose.yml
#
# Composes every published Intent Fragment into one ComposedIntent, asserts the
# estate-wide invariants, publishes the result with its lock, then renders and
# delivers: one signed OCI artifact per Project, and one pin commit moving each
# Project whose render changed. Composition and delivery are both part of the
# model (docs/adr/model/0037-composition-oci-fragments.md,
# docs/adr/model/0133-a-project-is-delivered-as-a-signed-artifact-pinned-by-digest.md).
#
#   fragment publishes -> repository_dispatch -> pull all participants
#                                             -> verify + union
#                                             -> assert the invariants
#                                             -> prove the gate can fail
#                                             -> publish ComposedIntent + lock
#                                             -> render, one artifact per Project
#                                             -> sign keyless, read back, verify
#                                             -> commit the moved pins [ci skip]
#
# The pin commit is the deploy: Flux fetches each Project's OCIRepository by
# the digest this workflow writes, and verifies it against this workflow's own
# OIDC identity, which the Platform document records as
# bootstrap.flux.artifacts.signer (spec/v1/55-delivery.md#rendered-artifacts-and-pins).
#
# Triggered by the publish, NOT by a schedule. The estate measured Actions
# crons at four to seven runs per repo per day regardless of the declared
# interval, running late by hours, and raising the frequency does not help. A
# fragment publish needs a prompt reaction, so it pushes rather than being
# polled. The nightly schedule below is a safety net for a missed dispatch, not
# the primary path.
name: Compose

on:
  repository_dispatch:
    types: [fragment-published]
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'      # safety net only; see the note above

permissions: {}

concurrency:
  # Composition must be serialised: two concurrent runs would race on the
  # previous lock digest and break the lock chain.
  group: compose-production
  cancel-in-progress: false

jobs:
  compose:
    name: Compose and assert
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # the pin commit, and nothing else, writes
      packages: write
      id-token: write         # the keyless signature's identity
    outputs:
      composed-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1

      - name: Install the toolkit at this repository's pinned version
        id: toolkit
        run: |
          # Bare `npx deploy-config-schema` resolves from the registry at
          # invocation time, so two runs of the same inputs could compose with
          # different toolkits and produce different render hashes. Every step
          # below calls `npx --no-install`, which can only use what this step
          # installed.
          #
          # The version comes from this repository's own lockfile, bumped by
          # Renovate behind the ordering gate
          # (docs/adr/model/0040-renovate-ordering-gate.md). It is NOT read from any
          # document's schemaVersion: schemaVersion is the data model's own
          # semver and no longer tracks the package version
          # (docs/adr/model/0039-artifact-schema-versioning.md).
          npm ci
          TOOLKIT="$(node -p "require('./package-lock.json') \
            .packages['node_modules/@jorisjonkers-dev/deploy-config-schema'].version")"
          test -n "$TOOLKIT"
          echo "toolkit=${TOOLKIT}" >> "$GITHUB_OUTPUT"
          echo "composing with toolkit ${TOOLKIT}"

      - name: Require a digest-pinned Platform document
        if: ${{ !cancelled() }}
        env:
          CONTEXT_REF: ${{ vars.CONTEXT_REF }}
        run: |
          # Every assignment is a function of pinned, digested inputs
          # (docs/adr/model/0006-pinned-inputs.md). A tag in this variable is a
          # mutable input nothing records, so the ref must carry a digest.
          case "$CONTEXT_REF" in
            *@sha256:*) echo "context ${CONTEXT_REF}" ;;
            *) echo "CONTEXT_REF must be digest-pinned, got '${CONTEXT_REF}'"; exit 1 ;;
          esac

      - name: Resolve every participant
        id: pull
        if: ${{ !cancelled() }}
        run: |
          # participants.yml is the one central artefact. It changes when a
          # project is added or retired, not when a declaration changes.
          npx --no-install deploy-config-schema compose pull \
            --participants participants.yml \
            --out fragments/ \
            --record fragments/RESOLVED.json
          # Fails with E_PARTICIPANT_MISSING, or E_PARTICIPANT_STALE past the
          # participant's maxAge -- seven days by default
          # (docs/adr/model/0038-participants-list-staleness.md). Not pedantry: the
          # composed union is the estate's only complete picture, so a project
          # that silently stops publishing yields a ComposedIntent that looks
          # entirely valid and is missing every Application that project owns. What
          # then happens to the objects those Applications already have in a
          # cluster is a delivery question, defined separately from the model:
          # see docs/adr/deferred/README.md.

      - name: Verify each package against its own manifest
        if: ${{ !cancelled() }}
        run: |
          for d in fragments/*/; do ( cd "$d" && sha256sum -c MANIFEST.sha256 ); done

      - name: Union and assert the invariants
        if: ${{ !cancelled() }}
        run: |
          npx --no-install deploy-config-schema compose union \
            --fragments fragments/ \
            --context-ref "${{ vars.CONTEXT_REF }}" \
            --out composed/ \
            --report composed/invariants.json
          # Identity, references, secrets, completeness -- chapter 40 holds the
          # list and its error codes. Any failure produces no ComposedIntent,
          # so nothing downstream can render.
          #
          # The secret checks are string comparisons over the union, with no
          # mount table and no Vault read: a ${secret:...} placeholder must
          # byte-match a granted path (E_UNAUTHORISED_SECRET_REFERENCE), and a
          # delivery: env grant must have a placeholder (E_UNBOUND_SECRET_GRANT)
          # -- docs/adr/model/0027-secret-reference-join-key.md.

      - name: Prove the gate can fail, on the right error
        if: ${{ !cancelled() }}
        run: |
          # Check your own gate can fail before trusting that it passed. The
          # fixture is otherwise valid, so the union reaches the identity check
          # rather than tripping on something else on the way in.
          #
          # The assertion is on the ERROR CODE, not the exit status. A step
          # that accepted any non-zero exit would keep printing success while
          # proving a different invariant -- exactly the failure this fixture
          # exists to detect, one level up.
          set +e
          out="$(npx --no-install deploy-config-schema compose union \
            --fragments spec/v1/examples/negative/duplicate-application-id/ \
            --context-ref "${{ vars.CONTEXT_REF }}" \
            --out /tmp/should-fail 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo "gate did not fail"; exit 1
          fi
          printf '%s' "$out" | grep -q 'E_DUPLICATE_APPLICATION_ID' || {
            echo "gate failed, but not on E_DUPLICATE_APPLICATION_ID"; exit 1; }
          echo "gate rejects a duplicate Application Id with E_DUPLICATE_APPLICATION_ID"

      - name: Prove the process-name gate can fail, on the right error
        if: ${{ !cancelled() }}
        run: |
          # One negative fixture per invariant. This one is a single project
          # file whose two Applications both name a Process `api`: Process names
          # are unique within a project, because the ServiceAccount and the
          # Vault role are the Process name under the project's namespace
          # (docs/adr/model/0024-identity-per-process.md,
          # docs/adr/model/0063-intent-authored-per-project.md). It needs no second
          # fragment -- a project never spans repositories, so one file holds
          # every name that must be compared.
          #
          # Again the assertion is the ERROR CODE. The fixture is otherwise
          # valid, so a non-zero exit could just as easily mean a schema slip.
          set +e
          out="$(npx --no-install deploy-config-schema compose union \
            --fragments spec/v1/examples/negative/duplicate-process-name/ \
            --context-ref "${{ vars.CONTEXT_REF }}" \
            --out /tmp/should-fail-process 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo "gate did not fail"; exit 1
          fi
          printf '%s' "$out" | grep -q 'E_DUPLICATE_PROCESS_NAME' || {
            echo "gate failed, but not on E_DUPLICATE_PROCESS_NAME"; exit 1; }
          echo "gate rejects a duplicate Process name with E_DUPLICATE_PROCESS_NAME"

      - name: Publish ComposedIntent and its lock
        id: publish
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLKIT: ${{ steps.toolkit.outputs.toolkit }}
        run: |
          REF="ghcr.io/${{ github.repository_owner }}/composed:latest"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # The previous lock digest is READ FROM THE REGISTRY, not from a
          # repository variable. A variable no step updates is either stale
          # forever -- every lock claiming the same ancestor -- or maintained
          # by hand out of band, which is the mutable remembered state the
          # pinned-input rule forbids (docs/adr/model/0006-pinned-inputs.md).
          # Absent on the very first composition, which is the one legitimate
          # empty ancestor.
          PREVIOUS="$(oras resolve "$REF" 2>/dev/null || true)"
          echo "previous lock ancestor: ${PREVIOUS:-<none, first composition>}"

          # The lock records what was composed -- every resolved fragment
          # digest and the exact toolkit version that produced this tree, since
          # the accepted schemaVersion RANGE is not enough to replay with
          # (docs/adr/model/0039-artifact-schema-versioning.md). It is written INSIDE
          # the package minus its own digest, which cannot exist yet.
          npx --no-install deploy-config-schema compose lock \
            --resolved fragments/RESOLVED.json \
            --composed composed/ \
            --toolkit "$TOOLKIT" \
            --previous "$PREVIOUS" \
            --out composed/composition-lock.yml

          ( cd composed && oras push "$REF" . )
          DIGEST="$(oras resolve "$REF")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Read the composed digest back
        if: ${{ !cancelled() }}
        run: |
          # A successful push is not evidence that a consumer can read what was
          # meant. Pull it back by digest and verify the content.
          oras pull "ghcr.io/${{ github.repository_owner }}/composed@${{ steps.publish.outputs.digest }}" \
            --output check/
          npx --no-install deploy-config-schema compose verify --composed check/

      - uses: sigstore/cosign-installer@v3
        if: ${{ !cancelled() }}

      - name: Render, and publish one signed artifact per Project
        id: render
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCK: ${{ steps.publish.outputs.digest }}
        run: |
          # The render is a function of the composed intent and the pinned
          # inputs alone, so its renderHash names what reproduces it. One
          # directory per Project; each Reconcile Unit applies its own path
          # inside its Project's artifact.
          npx --no-install deploy-config-schema render \
            --composed check/ \
            --context-ref "${{ vars.CONTEXT_REF }}" \
            --out rendered/
          REPOSITORY="$(npx --no-install deploy-config-schema platform get \
            --context-ref "${{ vars.CONTEXT_REF }}" bootstrap.flux.artifacts.repository)"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          : > moved.txt
          for dir in rendered/*/; do
            project="$(basename "$dir")"
            RENDER_HASH="$(cat "$dir/RENDER_HASH")"
            ( cd "$dir" && oras push "${REPOSITORY}/${project}:latest" \
                --annotation "dev.jorisjonkers.render-hash=${RENDER_HASH}" \
                --annotation "dev.jorisjonkers.lock-digest=${LOCK}" \
                --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
                . )
            DIGEST="$(oras resolve "${REPOSITORY}/${project}:latest")"

            # Keyless: the identity is this run's OIDC token, so no signing key
            # exists to store, rotate or leak.
            cosign sign --yes "${REPOSITORY}/${project}@${DIGEST}"

            # A render that did not change pushes the same digest and moves no
            # pin, so another Project's publish never redeploys this one.
            PINNED="$(yq '.spec.ref.digest' "projects/${project}/source.yaml")"
            if [ "$PINNED" != "$DIGEST" ]; then
              echo "${project} ${DIGEST}" >> moved.txt
            fi
          done
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Verify the value, not the command
        if: ${{ !cancelled() }}
        env:
          REPOSITORY: ${{ steps.render.outputs.repository }}
        run: |
          # A push and a signature that succeeded are not evidence Flux will
          # accept what it fetches. Verify each moved artifact the way Flux
          # will: by digest, against this workflow's identity.
          while read -r project digest; do
            cosign verify "${REPOSITORY}/${project}@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              > /dev/null
            echo "verified ${project}@${digest}"
          done < moved.txt

      - name: Commit the moved pins
        if: ${{ !cancelled() }}
        run: |
          # The deploy. One commit moves every Project whose digest changed;
          # the estate's git history is its deploy log. [ci skip] keeps this
          # commit from starting a composition of its own. A rollback is a
          # revert in the application repository, which moves the pin forward
          # again; reverting this commit directly is break-glass.
          test -s moved.txt || { echo "no render changed; nothing to deploy"; exit 0; }
          while read -r project digest; do
            yq -i ".spec.ref.digest = \"${digest}\"" "projects/${project}/source.yaml"
          done < moved.txt
          git config user.name "estate-composition"
          git config user.email "estate-composition@users.noreply.github.com"
          git add projects/
          git commit -m "chore(deploy): $(cut -d' ' -f1 moved.txt | paste -sd, -) [ci skip]"
          git push origin HEAD:main
