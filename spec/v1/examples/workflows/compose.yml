# estate/.github/workflows/compose.yml
#
# Composes every published Intent Fragment into one ComposedIntent, asserts the
# estate-wide invariants, publishes the result with its lock, then renders and
# delivers: one signed OCI artifact per Project, and one pin commit moving each
# Project whose render changed. Composition and delivery are both part of the
# model (docs/adr/model/0042-declarations-compose-from-intent-fragments.md,
# docs/adr/model/0051-a-project-is-delivered-as-a-signed-artifact.md).
#
#   fragment publishes -> workflow_dispatch -> pull all participants
#                                             -> verify each package
#                                             -> prove the gate can fail
#                                             -> deploy-kit compose: union, invariants,
#                                                isolation, render, lock
#                                             -> publish the lock
#                                             -> publish one artifact per moved Project
#                                             -> sign keyless, read back, verify
#                                             -> commit the moved pins [ci skip]
#                                             -> report: statuses, issues, Discord
#
# The toolkit reads and writes directories only: this workflow pulls every
# fragment, the previous lock and the pins into the workspace, runs
# `deploy-kit compose` once, and pushes what it wrote.
#
# The pin commit is the deploy: Flux fetches each Project's OCIRepository by
# the digest this workflow writes, and verifies it against this workflow's own
# OIDC identity, which the Platform document records as
# bootstrap.flux.artifacts.signer (spec/v1/55-delivery.md#rendered-artifacts-and-pins).
#
# Triggered by the publish, NOT by a schedule. The estate measured Actions
# crons at four to seven runs per repo per day regardless of the declared
# interval, running late by hours, and raising the frequency does not help. A
# fragment publish needs a prompt reaction, so it pushes rather than being
# polled. The nightly schedule below is a safety net for a missed dispatch, not
# the primary path.
name: Compose

on:
  # The publish starts this workflow through the dispatch GitHub App, whose
  # actions: write can start a run and cannot push (spec/v1/60-setup.md#the-estate-repository).
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'      # safety net only; see the note above

permissions: {}

concurrency:
  # Composition must be serialised: two concurrent runs would race on the
  # previous lock digest and break the lock chain.
  group: compose-production
  cancel-in-progress: false

jobs:
  compose:
    name: Compose and assert
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # the pin commit, and nothing else, writes
      packages: write
      id-token: write         # the keyless signature's identity
    outputs:
      composed-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1

      - name: Install the toolkit at this repository's pinned version
        id: toolkit
        run: |
          # Bare `npx deploy-kit` resolves from the registry at
          # invocation time, so two runs of the same inputs could compose with
          # different toolkits and produce different render hashes. Every step
          # below calls `npx --no-install`, which can only use what this step
          # installed.
          #
          # The version comes from this repository's own lockfile, bumped by
          # Renovate behind the ordering gate
          # (docs/adr/model/0047-one-publication-path.md). It is NOT read from any
          # document's schemaVersion: schemaVersion is the data model's own
          # semver and no longer tracks the package version
          # (docs/adr/model/0044-artifact-schema-versioning.md).
          npm ci
          TOOLKIT="$(node -p "require('./package-lock.json') \
            .packages['node_modules/@jorisjonkers-dev/deploy-kit'].version")"
          test -n "$TOOLKIT"
          echo "toolkit=${TOOLKIT}" >> "$GITHUB_OUTPUT"
          echo "composing with toolkit ${TOOLKIT}"

      - name: Require a digest-pinned Platform document
        if: ${{ !cancelled() }}
        env:
          CONTEXT_REF: ${{ vars.CONTEXT_REF }}
        run: |
          # Every assignment is a function of pinned, digested inputs
          # (docs/adr/model/0006-pinned-inputs.md). A tag in this variable is a
          # mutable input nothing records, so the ref must carry a digest.
          case "$CONTEXT_REF" in
            *@sha256:*) echo "context ${CONTEXT_REF}" ;;
            *) echo "CONTEXT_REF must be digest-pinned, got '${CONTEXT_REF}'"; exit 1 ;;
          esac

      - name: Pull every participant, the previous lock and the pins
        id: pull
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT_REF: ${{ vars.CONTEXT_REF }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          # participants.yml is the one central artefact. It changes when a
          # project is added or retired, not when a declaration changes. Each
          # fragment lands in its own directory beside the `ref` its pull
          # resolved: an artefact cannot contain its own digest, so the puller
          # records it (spec/v1/40-composition.md#publication-and-why-the-lock-is-an-output).
          #
          # Beside `ref` goes `published`: when the fragment was pushed, from
          # the manifest's own created annotation. A fragment is deterministic
          # and carries no time, so staleness is read here
          # (spec/v1/40-composition.md#participants).
          created() { oras manifest fetch "$1" | jq -r '.annotations["org.opencontainers.image.created"]'; }
          # The Platform document is a participant like any project, pinned by
          # digest rather than resolved from a tag.
          oras pull "$CONTEXT_REF" --output platform/
          echo "$CONTEXT_REF" > platform/ref
          created "$CONTEXT_REF" > platform/published
          platform="$(yq '.spec.project' platform/fragment.yml)"
          mkdir -p fragments
          for project in $(yq '.participants | keys | .[]' participants.yml); do
            [ "$project" = "$platform" ] && continue
            image="ghcr.io/${{ github.repository_owner }}/intent-${project}"
            # A participant that published nothing is not pulled, and is not a
            # failure of this step: composition reads its absence against the
            # list and reports E_PARTICIPANT_MISSING.
            ref="$(oras resolve "${image}:latest" 2>/dev/null)" || continue
            oras pull "${image}@${ref}" --output "fragments/${project}/"
            echo "${image}@${ref}" > "fragments/${project}/ref"
            created "${image}@${ref}" > "fragments/${project}/published"
          done

          # The previous lock, and the estate commit it was committed in, READ
          # FROM THE REGISTRY and the repository rather than a variable no step
          # updates (docs/adr/model/0006-pinned-inputs.md). Absent on the very
          # first composition, which is the one legitimate empty ancestor.
          if oras pull "ghcr.io/${{ github.repository_owner }}/composed:latest" --output previous/ 2>/dev/null; then
            echo "lock=--lock previous/lock.json --lock-commit $(cat previous/COMMIT)" >> "$GITHUB_OUTPUT"
          fi

          # Every earlier fragment the previous lock or a Rollback names, so an
          # isolated Project composes at the fragment it last composed at
          # (spec/v1/40-composition.md#a-refused-project-is-isolated).
          for ref in $( { [ -f previous/lock.json ] && jq -r '.spec.fragments[].ref' previous/lock.json; \
                          yq '.metadata.annotations["estate.jorisjonkers.dev/rollback-fragment"] // ""' projects/*/source.yaml; } | sort -u ); do
            oras pull "$ref" --output "held/$(echo "$ref" | sha256sum | cut -c1-12)/"
            echo "$ref" > "held/$(echo "$ref" | sha256sum | cut -c1-12)/ref"
          done
          mkdir -p held

          # Each delivered Project's pin: the content hash its pinned artifact
          # carries, and the Pause and Rollback annotations on its source
          # (spec/v1/55-delivery.md#pause-and-rollback).
          REPOSITORY="$(yq '.bootstrap.flux.artifacts.repository' platform/platform.intent.yml)"
          echo '{}' > pins.json
          for source in projects/*/source.yaml; do
            [ -f "$source" ] || continue
            project="$(basename "$(dirname "$source")")"
            content="$(oras manifest fetch "${REPOSITORY}/${project}@$(yq '.spec.ref.digest' "$source")" \
              | jq -r '.annotations["dev.jorisjonkers.content-hash"]')"
            jq --arg p "$project" --arg c "$content" \
               --argjson a "$(yq -o=json '.metadata.annotations // {} | with_entries(select(.key | test("^estate\\.jorisjonkers\\.dev/")))' "$source")" \
               '.[$p] = {contentHash: $c, annotations: $a}' pins.json > pins.next && mv pins.next pins.json
          done
          # E_PARTICIPANT_MISSING and E_PARTICIPANT_STALE, past the
          # participant's maxAge -- seven days by default
          # (docs/adr/model/0043-participants-list-staleness.md) -- are the
          # toolkit's to say: `compose` is handed the list and each publish
          # time, and isolates the participant rather than failing the run.

      - name: Verify each package against its own manifest
        if: ${{ !cancelled() }}
        run: |
          for d in fragments/*/ platform/; do ( cd "$d" && sha256sum -c MANIFEST.sha256 ); done

      - name: Prove the gate can fail, on the right error
        if: ${{ !cancelled() }}
        run: |
          # Check your own gate can fail before trusting that it passed. Each
          # negative fixture is otherwise valid, so the set reaches the one
          # check it exists to trip rather than something else on the way in.
          #
          # The assertion is on the ERROR CODE, not the exit status. A step
          # that accepted any non-zero exit would keep printing success while
          # proving a different invariant -- exactly the failure this fixture
          # exists to detect, one level up.
          # Each is read beside the worked foundation, because the reference
          # invariants resolve against the Platform document's providers.
          examples=spec/v1/examples
          for fixture in duplicate-project:E_DUPLICATE_PROJECT \
                         duplicate-application-id:E_DUPLICATE_APPLICATION_ID \
                         duplicate-process-name:E_DUPLICATE_PROCESS_NAME \
                         duplicate-exposure-name:E_DUPLICATE_EXPOSURE_NAME \
                         duplicate-host:E_DUPLICATE_HOST \
                         unresolved-application:E_UNRESOLVED_APPLICATION \
                         unknown-surface:E_UNKNOWN_SURFACE \
                         dependency-cycle:E_DEPENDENCY_CYCLE; do
            set +e
            out="$(npx --no-install deploy-kit validate "$examples/platform/platform.intent.yml" \
              "$examples/delivery/" "$examples/edge/" "$examples/observability/" "$examples/secrets/" \
              "$examples/negative/${fixture%%:*}/" --json)"
            status=$?
            set -e
            [ "$status" -eq 1 ] || { echo "${fixture%%:*}: gate did not refuse (exit ${status})"; exit 1; }
            printf '%s' "$out" | jq -e --arg c "${fixture##*:}" 'map(.code) | index($c)' > /dev/null || {
              echo "${fixture%%:*}: refused, but not on ${fixture##*:}"; exit 1; }
            echo "gate refuses ${fixture%%:*} with ${fixture##*:}"
          done

      - name: Compose
        if: ${{ !cancelled() }}
        env:
          LOCK: ${{ steps.pull.outputs.lock }}
        run: |
          # The union, every estate-wide invariant, isolation and the render,
          # in one run. An error isolates the fragment it names and composition
          # runs again over the rest; only a refused Platform document, or an
          # error no changed fragment caused, exits 1 and composes nothing
          # (spec/v1/40-composition.md#a-refused-project-is-isolated). A
          # Project the handover ledger still puts on the old path is composed
          # and checked, never delivered, and the estate-scoped artifact waits
          # until none is (spec/v1/60-setup.md#handing-over-one-project-at-a-time).
          # shellcheck disable=SC2086 # LOCK is two options or none
          npx --no-install deploy-kit compose \
            --platform platform/ \
            --fragments fragments/ \
            --participants participants.yml \
            --held held/ \
            --pins pins.json \
            $LOCK \
            --cluster-state cluster-state.yml \
            --schema-package-integrity "$(node -p "require('./package-lock.json').packages['node_modules/@jorisjonkers-dev/deploy-kit'].integrity")" \
            --out composed/

      - name: Publish the lock
        id: publish
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          # The lock records what was composed -- every fragment by digest and
          # release, every isolation and why, and the toolkit that composed
          # them, since the accepted schemaVersion RANGE is not enough to
          # replay with (docs/adr/model/0044-artifact-schema-versioning.md).
          REF="ghcr.io/${{ github.repository_owner }}/composed:latest"
          git rev-parse HEAD > composed/COMMIT
          ( cd composed && oras push "$REF" lock.json composition.json COMMIT )
          DIGEST="$(oras resolve "$REF")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          # A successful push is not evidence that a consumer can read what was
          # meant. Pull it back by digest and compare.
          oras pull "${REF%:latest}@${DIGEST}" --output check/
          cmp check/lock.json composed/lock.json

      # Everything below deploys, so it runs only when every step above
      # succeeded, and only on main: a failed invariant, a failed gate proof or
      # a run from a branch publishes no artifact and moves no pin. Every step
      # above keeps `!cancelled()` so one failure still surfaces the rest.
      - uses: sigstore/cosign-installer@v3
        if: ${{ success() && github.ref == 'refs/heads/main' }}

      - name: Publish one signed artifact per moved Project
        id: render
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          COMPOSED: ${{ steps.publish.outputs.digest }}
        run: |
          # The toolkit decided which pins move: an unchanged render, and a
          # paused Project, move none (spec/v1/55-delivery.md#rendered-artifacts-and-pins).
          REPOSITORY="$(yq '.bootstrap.flux.artifacts.repository' platform/platform.intent.yml)"
          RENDER_HASH="$(jq -r '.spec.composedDigest' composed/lock.json)"
          : > moved.txt
          for row in $(jq -r '.artifacts[] | select(.moves) | "\(.name)=\(.contentHash)"' composed/composition.json); do
            project="${row%%=*}"; content="${row#*=}"
            # An artifact delivered for the first time has no pinned source
            # yet. The toolkit wrote one, from the Platform document and the
            # Reconcile Unit DAG, for exactly the artifacts whose pin it was
            # not handed; it is taken once, and afterwards only its digest
            # moves (spec/v1/55-delivery.md#rendered-artifacts-and-pins).
            if [ ! -f "projects/${project}/source.yaml" ]; then
              mkdir -p "projects/${project}"
              cp "composed/projects/${project}/source.yaml" "projects/${project}/source.yaml"
            fi
            # The digest is taken from the push itself, never re-read through a
            # mutable tag another run could move in between.
            DIGEST="$( cd "composed/artifacts/${project}" && oras push "${REPOSITORY}/${project}:${content#sha256:}" \
                --annotation "dev.jorisjonkers.content-hash=${content}" \
                --annotation "dev.jorisjonkers.render-hash=${RENDER_HASH}" \
                --annotation "dev.jorisjonkers.lock-digest=${COMPOSED}" \
                --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
                --format go-template='{{.digest}}' . )"
            # Keyless: the identity is this run's OIDC token, so no signing key
            # exists to store, rotate or leak.
            cosign sign --yes "${REPOSITORY}/${project}@${DIGEST}"
            echo "${project} ${DIGEST}" >> moved.txt
          done
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "issuer=$(yq '.bootstrap.flux.artifacts.signer.issuer' platform/platform.intent.yml)" >> "$GITHUB_OUTPUT"
          echo "subject=$(yq '.bootstrap.flux.artifacts.signer.subject' platform/platform.intent.yml)" >> "$GITHUB_OUTPUT"

      - name: Verify the value, not the command
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          REPOSITORY: ${{ steps.render.outputs.repository }}
          ISSUER: ${{ steps.render.outputs.issuer }}
          SUBJECT: ${{ steps.render.outputs.subject }}
        run: |
          # A push and a signature that succeeded are not evidence Flux will
          # accept what it fetches. Verify each new artifact the way Flux will:
          # by digest, against the signer the Platform document records, not
          # against whichever identity this run happens to have.
          while read -r project digest; do
            cosign verify "${REPOSITORY}/${project}@${digest}" \
              --certificate-oidc-issuer "$ISSUER" \
              --certificate-identity "$SUBJECT" \
              > /dev/null
            echo "verified ${project}@${digest}"
          done < moved.txt

      - name: Commit the moved pins
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          # The deploy. One commit moves every Project whose artifact changed;
          # the estate's git history is its deploy log. [ci skip] keeps the
          # estate repository's push checks off a commit that only moves
          # digests. A rollback is a revert in the application repository,
          # which moves the pin forward again; reverting this commit directly
          # is break-glass.
          test -s moved.txt || { echo "no render changed; nothing to deploy"; exit 0; }
          # A source file holds the pin and the units that apply it: the digest
          # is the OCIRepository's, and no other object's.
          while read -r project digest; do
            DIGEST="$digest" yq -i '(select(.kind == "OCIRepository") | .spec.ref.digest) = strenv(DIGEST)' "projects/${project}/source.yaml"
          done < moved.txt
          git config user.name "estate-composition"
          git config user.email "estate-composition@users.noreply.github.com"
          git add projects/
          git commit -m "chore(deploy): $(cut -d' ' -f1 moved.txt | paste -sd, -) [ci skip]"
          git push origin HEAD:main

      - name: Report what composition decided
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A commit status on every commit that published a fragment, and one
          # issue per Project condition, opened when it starts, commented when
          # it recurs, closed when it clears; its Discord line is posted when
          # the issue opens or closes (spec/v1/55-delivery.md#notifications).
          test -f composed/composition.json || exit 0
          jq -c '.statuses[]' composed/composition.json | while read -r status; do
            gh api "repos/$(jq -r .repository <<< "$status")/statuses/$(jq -r .sha <<< "$status")" \
              -f state="$(jq -r .state <<< "$status")" \
              -f context=estate/compose \
              -f description="$(jq -r .description <<< "$status")"
          done
          jq -c '.conditions[]' composed/composition.json > conditions.jsonl
          # Opening, commenting on and closing each condition's issue, and the
          # Discord post, are the composition workflow's own (estate#2).
