    - name: platform-postgres.baseline
      rules:
        - alert: TargetAbsent
          expr: absent(up{job="postgres"}) == 1
          for: 10m
          labels:
            severity: page
            receiver: pushover-page
            service: platform-postgres
          annotations:
            summary: postgres is not being scraped
