# adapter: gatus
# real path: platform/cluster/flux/apps/utility-system/gatus/gatus-endpoints-configmap.yaml
#
# ESTATE-WIDE OBJECT. One ConfigMap holds every endpoint in the estate (41 today,
# in 288 lines); this is the data domain's contribution. It lives in
# utility-system, a namespace this domain does not own, and E_FOREIGN_NAMESPACE
# is satisfied only because the `gatus` adapter owns the path rather than the
# Service.
#
# ONE ENTRY FOR THREE SERVICES, AND IT DOES NOT COMPOSE. Read the two failures
# below in order; they are the most useful thing in this file.
#
# 1. THE DATASTORE IS UNMONITORED, CORRECTLY. A Gatus check is EXTERNAL -- it
#    goes through the edge -- so the derivation is `exposure` + `probes.readiness`
#    per Workload. platform-postgres declares no `exposure`, so it gets no entry.
#    That is the right output and the wrong outcome: `alertClass: page`, the
#    loudest value in the vocabulary, is declared on the Service eight others
#    queue behind, and between this file (no entry) and the absent PrometheusRule
#    (no producer) it results in nothing being watched anywhere. The same holds
#    for platform-valkey. A model whose only health surface is external cannot
#    see its own data tier. README, gap G-33.
#
# 2. THE ONE ENTRY THAT EXISTS CANNOT BE COMPLETED. platform-rabbitmq exposes
#    15672 and declares `probes.readiness: {tcp: 5672}`. The two halves of the
#    derivation name different ports and different protocols: the readiness probe
#    is a TCP accept on the AMQP listener, and the routed surface is the HTTP
#    management UI. The route now supplies the path -- `/` -- so the URL is
#    complete; what is still undeclared is the HTTP status, and anything at all
#    that says what "healthy" means to a caller arriving through the edge. On
#    top of that the exposure is `audience: authenticated`, so an
#    unauthenticated prober is answered by forward-auth with a redirect, never a
#    200 -- so even a guessed `[STATUS] == 200` would be wrong by construction.
#    README, gap G-34.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-endpoints
  namespace: utility-system
  labels:
    app.kubernetes.io/managed-by: deploy-kit
data:
  config.yaml: |
    endpoints:
      # from the `management` exposure -- authored host, plus its one route
      #    {path: /, match: prefix, workload: rabbitmq, surface: management}
      #    + probes.readiness {tcp: 5672}   <- different port, different protocol
      - name: rabbitmq
        group: data                     # the domain
        url: https://rabbitmq.jorisjonkers.dev/    # host + route path, both
                                                   # authored on the exposure.
                                                   # What is still missing is
                                                   # not the URL but what a
                                                   # healthy answer to it looks
                                                   # like -- see below
        # NO `conditions:`. The readiness declaration this entry is supposed to
        # derive from is a TCP probe on a port the edge does not serve, and the
        # audience guarantees a non-200 for any prober without a session. A Gatus
        # endpoint with no conditions is not valid configuration and will not
        # load -- which is the finding, not a formatting choice. Writing
        # `[STATUS] == 200` here would be inventing the answer to G-34.
        #
        # NO `interval` either: no field declares one and no chapter names a
        # default.

# NOT EMITTED: the `alerts:` block, and the `alerting:` section it would resolve
# against. THREE Services in this one domain file declare THREE different Alert
# Classes -- page, urgent, business-hours -- deliberately kept per Service so the
# file does not page as loudly as its loudest member. All three derive the same
# thing here: nothing. The live ConfigMap has `storage` and `ui` and no
# `alerting` section at all: 41 endpoints notifying nobody. The mapping from an
# Alert Class to a Gatus alert -- receiver type, failure threshold,
# send-on-resolved -- is stated in no chapter, and the receiver is a platform
# fact. README, gap G-33.
