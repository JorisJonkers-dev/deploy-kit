# adapter: kubernetes
# real path: platform/cluster/flux/apps/data/platform-valkey/serviceaccount.yaml
#
# `data-system.valkey`. The third principal in the namespace. Like rabbitmq's it
# holds no policy; unlike rabbitmq's it never will, because a cache with no
# credential has nothing to be granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey
  namespace: data-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: platform-valkey
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: deploy-kit
# automountServiceAccountToken is not set. README, gap G-14.
