# adapter: kubernetes
# real path: platform/cluster/flux/apps/data/platform-valkey/workload.yaml
#
# The third Service, and the smallest derived file set in the example set: one
# Deployment, one Service, one identity, one claim, one policy. Everything it
# does NOT get is a declaration it did not make -- no scrape, so no
# ServiceMonitor; no exposure, so no IngressRoute and no Gatus entry; no grants,
# so no VSO objects and no Secret Store egress; `durability: reconstructible`, so
# no backup job at all.
#
# That last one is the only absence in this domain that is a decision rather than
# a hole. The estate's own words for this volume are "deliberately unbacked as
# reconstructible cache", and stating the class is what makes that a decision
# instead of an omission.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: data-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: platform-valkey
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: deploy-kit
spec:
  replicas: 1                           # forced by the RWO volume
  strategy:
    # Recreate, forced by the RWO volume -- on a CACHE, where losing the volume
    # costs a rebuild and a rolling restart would have been harmless. The
    # derivation reads `volumes`, not `durability`, so the one Workload in this
    # domain that could tolerate a surge does not get one. Whether
    # `reconstructible` should relax the strategy rule is not asked anywhere.
    type: Recreate
  progressDeadlineSeconds: 90           # startupBudget 30s x 3
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: platform-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: platform-valkey
        app.kubernetes.io/part-of: data
        app.kubernetes.io/managed-by: deploy-kit
    spec:
      serviceAccountName: valkey        # the third identity in this namespace
      # NO nodeSelector and NO nodeAffinity: `placement` declares only the two
      # required quantities, so all seven nodes are eligible -- which is what a
      # cache should be. Note what is NOT written here: a `tailscale` capability
      # filter, advertised on 7 of 7 nodes, would have appeared to narrow this
      # to seven nodes while excluding none, teaching a reader that filters do
      # nothing. It left the vocabulary for exactly that reason.
      #
      # The same unchecked-architecture question as rabbitmq applies: three of
      # the seven eligible nodes are arm64 and nothing compares the locked digest
      # against them. README, gap G-27.
      securityContext:
        # hardening: restricted, NO exceptions -- all four controls.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey@sha256:f145ca54e04051616102729d3457c1952d8224f183bffbeef1d18993e9a6a716
          ports:
            - name: redis               # the surface name: the WIRE PROTOCOL,
              containerPort: 6379       # not the product. auth's api Workload
                                        # writes {surface: redis} and would not
                                        # have to change if the product did.
          resources:
            # The smallest placement in the domain, and the shape rules are the
            # same two: memory request == limit, cpu request with no limit.
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # NO `env`, NO `envFrom`. No grants, `runtime: none`, and no env file
          # for this Workload in the example set. README, gap G-28.
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 6         # startupBudget 30s / 5s
          readinessProbe:
            tcpSocket:
              port: redis
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            timeoutSeconds: 5
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-data
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: platform-valkey
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: deploy-kit
spec:
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: platform-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
