# adapter: kubernetes
# real path: platform/cluster/flux/apps/data/platform-rabbitmq/serviceaccount.yaml
#
# `data-system.rabbitmq`. A second principal in a namespace that already holds
# `data-system.postgres`, bound to nothing, because platform-rabbitmq declares
# no `secrets` at either level -- its CLIENTS hold the broker credentials.
#
# An identity with no policy is not waste. It is what stops the namespace half of
# a future Vault binding being the whole boundary: the day this Service is
# granted a path, the grant lands on `rabbitmq` and not on a principal shared
# with the datastore next door.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: data-system
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: platform-rabbitmq
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: deploy-kit
# automountServiceAccountToken is not set. This Workload holds no grant and
# needs no projected token; "no grant -> no token" is a derivation nobody has
# written down, so the hardened default is not rendered. README, gap G-14.
