# adapter: networking -- NOT REGISTERED. See ../platform-postgres/networkpolicy.yaml.
# real path: platform/cluster/flux/apps/data/platform-rabbitmq/networkpolicy.yaml
#
# The second provider policy in this namespace, and the proof that the namespace
# wall is not doing the work: this object does not admit `postgres` or `valkey`,
# the two pods beside it, and `postgres`'s object does not admit this one. Three
# Services, three policies, one namespace, zero east-west reachability between
# them -- all of it from declared edges, none of it from the namespace.
#
# THREE SURFACES, THREE DIFFERENT INGRESS DERIVATIONS, one per rule below:
#   amqp 5672        <- inbound `dependsOn` edges, over the composed union
#   management 15672 <- an `exposure` entry, from the route tier
#   metrics 15692    <- `scrape`, from the metrics stack
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
  namespace: data-system
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: platform-rabbitmq
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: deploy-kit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: platform-rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ---- consumers of surface `amqp` (5672) --------------------------------
    # {service: platform-rabbitmq, surface: amqp} declared by auth-api
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-api
      ports:
        - protocol: TCP
          port: 5672
    # declared by knowledge-api
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knowledge-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge-api
      ports:
        - protocol: TCP
          port: 5672
    # declared by knowledge-ingest-worker -- the Workload the queue actually
    # exists for. Its sibling api Workload declares the same edge separately and
    # gets its own rule; neither inherits the other's.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knowledge-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge-ingest-worker
      ports:
        - protocol: TCP
          port: 5672
    #
    # NO OTHER CONSUMERS RESOLVE. auth and knowledge are the only other domains
    # publishing an Intent Fragment in this example set. Over the real union the
    # set is larger, and the provider learns it only there. README, gap G-22.
    #
    # ---- from the route tier carrying the audience -------------------------
    # derived from `exposure: [{port: 15672, audience: authenticated}]`. The peer
    # is the edge, not the caller: forward-auth runs in the edge pod, so what
    # this rule admits is Traefik, and the user's identity is checked before the
    # request is proxied. Nothing at this layer knows who the user was.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system     # CONTEXT: the edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik              # CONTEXT
      ports:
        - protocol: TCP
          port: 15672
    # ---- from the metrics stack, to the scrape port ------------------------
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utility-system  # CONTEXT
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus           # CONTEXT
      ports:
        - protocol: TCP
          port: 15692
  egress:
    # The baseline, and NOTHING else. platform-rabbitmq declares no `dependsOn`
    # and holds no grant, so it gets DNS and no other egress in the estate. This
    # is the minimal derived policy -- and the contrast with postgres's file is
    # the point: postgres gets an extra egress rule solely because it holds one
    # `delivery: env` grant, a rule its pod never uses. README, gap G-23.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system     # CONTEXT
          podSelector:
            matchLabels:
              k8s-app: kube-dns                            # CONTEXT
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
