# adapter: kubernetes
# real path: platform/cluster/flux/apps/data/platform-postgres/serviceaccount.yaml
#
# One ServiceAccount per WORKLOAD, named for the Workload ALONE:
# `data-system.postgres`, never `data-system.platform-postgres-postgres`. The
# Service id (`platform-postgres`) is the repository and product name and does
# not appear in an identity.
#
# This is the domain where that rule is load-bearing rather than tidy. Vault's
# Kubernetes auth method binds a role to ServiceAccount NAMES and NAMESPACES and
# to nothing finer, and `data-system` holds three Services. So the namespace half
# of every binding in this domain is shared, and the ServiceAccount name is the
# ENTIRE boundary between platform-postgres, platform-rabbitmq and
# platform-valkey. That is why uniqueness is checked across the whole domain file
# (E_DUPLICATE_WORKLOAD_NAME) rather than within one Service.
#
# The exporter sidecar has no identity of its own. It runs in this pod and
# presents this token, which is how it reads the grant declared on this Workload
# -- and is also why a grant scoped "to the exporter" is in practice scoped to
# the database container too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: data-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: platform-postgres
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: deploy-kit
# automountServiceAccountToken is not set. This Workload holds one grant with
# `delivery: env`, which the Vault Secrets Operator reads on its behalf -- the
# pod itself never authenticates to Vault, so "holds a grant" does not imply
# "needs a projected token" the way it does under `delivery: self`. The
# derivation ("no grant -> no token") is stated in no chapter and does not fit
# this case either way. README, gap G-14.
