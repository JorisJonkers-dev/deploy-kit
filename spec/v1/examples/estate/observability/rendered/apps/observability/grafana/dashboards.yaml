ame=~\"$node\"})","refId":"A"}],"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","textMode":"auto"},"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":80},{"color":"red","value":92}]},"decimals":1},"overrides":[]}},{"type":"stat","title":"Hottest sensor","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":4,"w":6,"x":18,"y":0},"targets":[{"expr":"max(node_hwmon_temp_celsius * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"})","refId":"A"}],"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","textMode":"auto"},"fieldConfig":{"defaults":{"unit":"celsius","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":70},{"color":"red","value":85}]},"decimals":1},"overrides":[]}},{"type":"text","title":"","gridPos":{"h":3,"w":24,"x":0,"y":4},"options":{"mode":"markdown","content":"Per-node hardware telemetry for the whole fleet. Use the **node** variable to focus. Coverage is not uniform, by hardware rather than by configuration: temperature and CPU frequency come from the 5 Enschede machines \u2014 `frankfurt-contabo-1` is a virtualised VPS and exposes no physical sensors. GPU rows appear only for nodes running dcgm-exporter (NVIDIA only; the AMD RX 7900 XTX is not covered). **Power draw** is GPU-only today \u2014 see the panel description."}},{"type":"timeseries","title":"CPU utilization","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":0,"y":7},"targets":[{"expr":"(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)) * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"{{nodename}}","refId":"A"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"percent","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true},"min":0,"max":100},"overrides":[]}},{"type":"timeseries","title":"Memory used","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":12,"y":7},"targets":[{"expr":"((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"{{nodename}}","refId":"A"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"percent","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true},"min":0,"max":100},"overrides":[]}},{"type":"timeseries","title":"Load average per core","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":0,"y":14},"targets":[{"expr":"(node_load1 / on(instance) group_left() count by (instance) (node_cpu_seconds_total{mode=\"idle\"})) * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"1m {{nodename}}","refId":"A"},{"expr":"(node_load15 / on(instance) group_left() count by (instance) (node_cpu_seconds_total{mode=\"idle\"})) * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"15m {{nodename}}","refId":"B"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"short","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true}},"overrides":[]},"description":"Load normalised by core count, so 1.0 means fully committed on any node regardless of size."},{"type":"timeseries","title":"Temperature (hwmon sensors)","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":12,"y":14},"targets":[{"expr":"node_hwmon_temp_celsius * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"{{nodename}} {{chip}}/{{sensor}}","refId":"A"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"celsius","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true}},"overrides":[]},"description":"Physical sensors. Absent on frankfurt-contabo-1: a VPS guest has no hwmon."},{"type":"timeseries","title":"Temperature (kernel thermal zones)","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":0,"y":21},"targets":[{"expr":"node_thermal_zone_temp * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"{{nodename}} {{type}} z{{zone}}","refId":"A"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"celsius","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true}},"overrides":[]}},{"type":"timeseries","title":"CPU frequency","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":12,"y":21},"targets":[{"expr":"node_cpu_scaling_frequency_hertz * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"{{nodename}} cpu{{cpu}}","refId":"A"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"hertz","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true}},"overrides":[]},"description":"Live scaling frequency per core."},{"type":"timeseries","title":"Memory detail","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":0,"y":28},"targets":[{"expr":"node_memory_MemTotal_bytes * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"total {{nodename}}","refId":"A"},{"expr":"node_memory_MemAvailable_bytes * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"available {{nodename}}","refId":"B"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"bytes","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true}},"overrides":[]}},{"type":"timeseries","title":"Filesystem used","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":12,"y":28},"targets":[{"expr":"((1 - (node_filesystem_avail_bytes{fstype!~\"tmpfs|ramfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|ramfs|overlay\"})) * 100) * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"{{nodename}} {{mountpoint}}","refId":"A"}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","mean","max"]},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"percent","custom":{"drawStyle":"line","fillOpacity":10,"lineWidth":2,"showPoints":"never","spanNulls":true},"min":0,"max":100},"overrides":[]}},{"type":"timeseries","title":"Disk throughput","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":7,"w":12,"x":0,"y":35},"targets":[{"expr":"(sum by (instance) (rate(node_disk_read_bytes_total[5m]))) * on(instance) group_left(nodename) node_uname_info{nodename=~\"$node\"}","legendFormat":"read {{nodename}}","refId":"A"},{"expr":"(sum by (instance) (rate(node_disk_written_bytes_total[5m]))) * on(instance) group_left(nodename) node_uname_info{nodename=~