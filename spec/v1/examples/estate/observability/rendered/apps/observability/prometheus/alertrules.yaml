# GENERATED. Never hand-edit.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-platform
  namespace: observability-system
  labels:
    app.kubernetes.io/part-of: prometheus
    app.kubernetes.io/managed-by: deploy-kit
spec:
  groups:
    - name: platform-edge
      rules:
        - alert: PlatformIngressErrorsHigh
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Elevated ingress 5xx rate
            description: Traefik 5xx ratio > 1% over the last 5m.
        - alert: PlatformIngressLatencyHigh
          expr: histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Edge p95 latency above 1s
            description: Traefik p95 request duration > 1s for 10 minutes.
        - alert: PlatformTLSCertExpiringSoon
          expr: (traefik_tls_certs_not_after - time()) < (14 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: TLS certificate near expiry
            description: A certificate exposed by Traefik expires in < 14 days.
    - name: platform-slo
      rules:
        - alert: ServiceErrorBudgetFastBurn
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR",service!="traefik"}[1h]))
              /
              sum by (service) (rate(traces_spanmetrics_calls_total{service!="traefik"}[1h]))
            ) > (14.4 * 0.001)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }}: SLO fast-burn"
            description: Error rate consumes >14.4× error budget over 1h. Page.
        - alert: ServiceErrorBudgetSlowBurn
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR",service!="traefik"}[6h]))
              /
              sum by (service) (rate(traces_spanmetrics_calls_total{service!="traefik"}[6h]))
            ) > (1 * 0.001)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}: SLO slow-burn"
            description: Error rate consumes >1× error budget over 6h. Open a ticket.
    - name: platform-services
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod restarting frequently: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "{{ $labels.container }} has restarted >3 times in 15m."
        - alert: PodOOMKilled
          expr: increase(container_oom_events_total[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "OOM kill: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: Pod was OOM killed at least once in the last 10 minutes.
        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="true"} == 0 and on (namespace, pod) kube_pod_status_phase{phase="Running"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod not ready: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: Pod is Running but not Ready for 10 minutes.
    - name: platform-jvm
      rules:
        - alert: JvmHeapHigh
          expr: |
            sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.application }}: JVM heap > 90%"
            description: Old generation heap is sustained > 90% — risk of OOM/GC thrash.
        - alert: JvmGcPauseHigh
          expr: histogram_quantile(0.95, sum by (le, application) (rate(jvm_gc_pause_seconds_bucket[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.application }}: GC pause p95 > 500ms"
            description: Garbage-collection p95 pause time > 500ms for 5 minutes.
    - name: platform-data
      rules:
        - alert: PostgresMetricsMissing
          expr: absent(pg_up)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: No Postgres metrics are being ingested
            description: PostgresDown and PostgresConnectionsHigh cannot fire while this is firing. Check the postgres Service carries app.kubernetes.io/name=postgres, which its ServiceMonitor selects on.
        - alert: ValkeyMetricsMissing
          expr: absent(redis_up)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No Valkey metrics are being ingested
            description: Valkey eviction, memory and fragmentation alerts cannot fire while this is firing. Check the valkey Service label.
        - alert: RabbitMQMetricsMissing
          expr: absent(rabbitmq_identity_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No RabbitMQ metrics are being ingested
            description: RabbitMQQueueDepthHigh cannot fire while this is firing. Check the rabbitmq Service label.
        - alert: ValkeyMemoryNearLimit
          expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Valkey above 80% of maxmemory
            description: Policy is noeviction, so writes start failing at 100% rather than older keys being dropped. Sessions live here.
        - alert: PostgresConnectionsHigh
          expr: (sum(pg_stat_activity_count) / max(pg_settings_max_connections)) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Postgres connections > 80% of max
            description: Connection saturation increases failure risk for new clients.
        - alert: PostgresCollationDrift
          expr: max by (datname) (pg_database_collation_drifted) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Postgres database {{ $labels.datname }} has a stale collation version
            description: Its recorded collation version differs from the C library's, so its text indexes may be sorted wrong. Run amcheck, REINDEX what fails, then ALTER DATABASE ... REFRESH COLLATION VERSION.
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Postgres exporter cannot reach the DB
        - alert: ValkeyEvictionsHappening
          expr: rate(redis_evicted_keys_total[10m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Valkey is evicting keys
            description: Cache memory pressure — consider raising maxmemory.
        - alert: ValkeyMemoryFragmentationHigh
          expr: redis_memory_fragmentation_ratio > 1.5
          for: 30m
          labels:
            severity: info
          annotations:
            summary: Valkey fragmentation > 1.5 (sustained 30m)
        - alert: RabbitMQQueueDepthHigh
          expr: rabbitmq_queue_messages_unacked > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "RabbitMQ unacked > 10k: {{ $labels.queue }}"
            description: Unacknowledged messages have piled up — consumer slow / dead.
    - name: platform-storage
      rules:
        - alert: PersistentVolumeFillingUp
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC > 85% full: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
            description: Volume is at >85% capacity. Resize or clean up before it hits 100%.
        - alert: PlatformNodeDiskPressure
          expr: max(kube_node_status_condition{condition="DiskPressure",status="true"}) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node reports disk pressure
            description: At least one Kubernetes node is under disk pressure.
    - name: platform-cluster
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node not Ready: {{ $labels.node }}"
            description: Kubelet has reported NotReady for 5 minutes.
        - alert: KubeletDown
          expr: up{job="kubelet"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubelet is down: {{ $labels.node }}"
    - name: platform-gpu
      rules:
        - alert: NvidiaDriverMismatch
          expr: (nvidia_driver_mismatch * on(instance) group_left(nodename) node_uname_info) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: NVIDIA module {{ $labels.loaded }} loaded on {{ $labels.nodename }}, generation installs {{ $labels.installed }}
            description: No CDI spec is written until the module matches, so the next pod to restart there cannot get its GPU. Run scripts/ops/reload-nvidia-modules.sh {{ $labels.nodename }} --reload in nix-config, or reboot the node if the kernel changed too.
        - alert: NvidiaCdiSpecMissing
          expr: (nvidia_cdi_spec_present * on(instance) group_left(nodename) node_uname_info) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No CDI spec on {{ $labels.nodename }}
            description: /var/run/cdi holds no spec, so a GPU pod that starts there fails with "unresolvable CDI devices". Check the driver with scripts/ops/reload-nvidia-modules.sh {{ $labels.nodename }}.
        - alert: NvidiaCdiStateStale
          expr: (time() - node_textfile_mtime_seconds{file=~".*nvidia-cdi.prom"}) > 600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: nvidia-cdi-state has not reported for 10 minutes on {{ $labels.instance }}
            description: The nvidia-cdi-state timer stopped writing, so the two GPU alerts above cannot fire there.
    - name: platform-release-gate
      rules:
        - alert: ReleaseCanaryFailedAndHeld
          expr: (time() - release_gate_held_since_timestamp_seconds{reason="analysis-failed"}) > release_gate_held_deadline_seconds
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.application }} is held: a member failed its analysis"
            description: It serves {{ $labels.serving }} while its pin names {{ $labels.pinned }}, past its gate deadline. Flagger will not analyse this revision again on its own. To retry it, restart the failed member's Deployment (kubectl -n {{ $labels.namespace }} rollout restart deployment/<member>); or move the Application's pin again.
        - alert: ReleaseHeld
          expr: (time() - release_gate_held_since_timestamp_seconds{reason!="analysis-failed"}) > release_gate_held_deadline_seconds
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.application }} is held: {{ $labels.reason }}"
            description: "It serves {{ $labels.serving }} while its pin names {{ $labels.pinned }}, past its gate deadline. stale-proof: the migration's proof names a revision that no longer serves, so publish a release proven against what serves. migration-failed: read the migration Job's log."
        - alert: ReleaseMigrationNotUndone
          expr: release_gate_undo_refused == 1
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.application }}: a migration stays applied ({{ $labels.condition }})"
            description: "The release is held and the gate will not run its Down, so the schema is ahead of what serves. The condition says why: first-release (no Down to run), new-copy-running, primaries-moved, non-transactional, or down-failed. The Down would return to tag {{ $labels.tag }}."
        - alert: ReleaseGateCannotReadApplication
          expr: release_gate_unanswerable == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The Release Gate cannot read {{ $labels.namespace }}/{{ $labels.application }}
            description: It answers no to every question about it, so its releases cannot move. The gate's log says why (release gate could not tend an Application).
        - alert: ReleaseGateNotTending
          expr: (time() - release_gate_tended_timestamp_seconds) > 120
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: The Release Gate has not finished a round of tending for over two minutes
            description: It tends every 15 seconds. Without a round nothing is recorded, started or undone, and held releases go unseen. Read kubectl -n delivery-system logs deploy/release-gate.
    - name: platform-gitops
      rules:
        - alert: FluxResourceNotReady
          expr: gotk_resource_ready{type="Ready",customresource_kind!~"GitRepository|HelmRepository|OCIRepository"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Flux not Ready: {{ $labels.customresource_kind }}/{{ $labels.name }}"
            description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been Ready=False for 10 minutes."
        - alert: FluxSourceFailing
          expr: gotk_resource_ready{type="Ready",customresource_kind=~"GitRepository|HelmRepository|OCIRepository"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Flux source failing: {{ $labels.customresource_kind }}/{{ $labels.name }}"
            description: Source {{ $labels.exported_namespace }}/{{ $labels.name }} has been Ready=False for 10 minutes, so everything downstream is reconciling against a stale artifact.
    - name: platform-vault
      rules:
        - alert: VaultSealed
          expr: kube_pod_status_ready{namespace="data-system", pod=~"vault-[0-9]+", condition="true"} == 0 and on (namespace, pod) kube_pod_status_phase{phase="Running"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Vault is sealed or not ready: {{ $labels.pod }}"
            description: "{{ $labels.pod }} is Running but its readiness probe (vault status) has failed for 2 minutes, which is what a sealed Vault looks like. Every workload that reads a secret stalls until it is unsealed: run scripts/ops/unseal-vault.sh."
        - alert: VaultAuditFailures
          expr: increase(vault_audit_log_request_failure[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Vault audit log write failure
        - alert: VaultMetricsUnreachable
          expr: up{job="vault"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Vault metrics scrape failing: check the metrics token"
    - name: platform-profiling
      rules:
        - alert: PyroscopeIngestErrors
          expr: rate(pyroscope_ingester_ingest_errors_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pyroscope is rejecting profile ingest
    - name: platform-jvm-pipeline
      rules:
        - alert: ControllerLatencyHighP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, service_name, http_route) (
                rate(traces_spanmetrics_latency_bucket{
                  span_name="pipeline.controller", service_name=~"auth-api|agents-api"
                }[5m])
              )
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} {{ $labels.http_route }}: p95 controller latency > 2s"
            description: |
              `pipeline.controller` p95 — wall clock spent inside the
              controller method body + Jackson response write — has been
              > 2s for 10 minutes on this route. Open the per-endpoint
              dashboard, filter by route + pod, check the pipeline.*
              breakdown.
        - alert: ResponseFinalizeLatencyHighP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, service_name, http_route) (
                rate(traces_spanmetrics_latency_bucket{
                  span_name="pipeline.response-finalize", service_name=~"auth-api|agents-api"
                }[5m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} {{ $labels.http_route }}: p95 response-finalize > 1s"
            description: Outbound network back-pressure or session write-back stall after handler returns.
    - name: platform-jvm-redis
      rules:
        - alert: LettuceCommandTimeouts
          expr: |
            sum by (service_name, db_operation) (
              rate(lettuce_seconds_count{error="CancellationException"}[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} Redis {{ $labels.db_operation }} timing out"
            description: Lettuce returned a CancellationException at >0.05/s for 5 min. Investigate Valkey load and the Lettuce event-loop concurrency.
        - alert: LettuceCommandLatencyHighP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, service_name, db_operation) (
                rate(lettuce_seconds_bucket{error="none"}[5m])
              )
            ) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} Redis {{ $labels.db_operation }} p95 > 200ms"
            description: Per-command Redis p95 has been > 200ms for 10 min. Healthy is single-digit ms on a local Valkey.
    - name: platform-jvm-hikari
      rules:
        - alert: HikariConnectionsPending
          expr: hikaricp_connections_pending{application=~"auth-api|agents-api"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.application }} ({{ $labels.instance }}): Hikari pool exhausted"
            description: Connections are queued waiting for a free DB connection. Pool size or query duration is wrong.
        - alert: HikariAcquireLatencyHighP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, application, instance) (
                rate(hikaricp_connections_acquire_seconds_bucket{application=~"auth-api|agents-api"}[5m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.application }} ({{ $labels.instance }}): Hikari acquire p95 > 1s"
            description: Time waiting for a connection from the pool is dominating request latency.
    - name: platform-jvm-gc
      rules:
        - alert: JvmGcPauseLong
          expr: |
            histogram_quantile(0.95,
              sum by (le, application, instance, cause) (
                rate(jvm_gc_pause_seconds_bucket{application=~"auth-api|agents-api"}[5m])
              )
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.application }} ({{ $labels.instance }}): GC pause p95 > 500ms ({{ $labels.cause }})"
            description: Overlay `gc.pause` spans in Tempo with the slow trace to confirm the gap is GC-driven.
    - name: platform-batch
      rules:
        - alert: KubeJobFailed
          expr: kube_job_failed{condition="true"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
            description: "A failed Job keeps firing until the Job object is deleted, which is deliberate: a one-shot Job that failed has work that never happened. Fix the cause or delete the Job to clear it."
        - alert: BackupNeverSucceeded
          expr: |
            kube_cronjob_info{cronjob=~".*(backup|snapshot).*"}
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: Backup {{ $labels.namespace }}/{{ $labels.cronjob }} has never succeeded
            description: The CronJob exists but kube-state-metrics records no successful completion, so no backup of this data has ever been taken.
        - alert: BackupStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob=~".*(backup|snapshot).*"}
              > (48 * 3600)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: Backup {{ $labels.namespace }}/{{ $labels.cronjob }} is stale
            description: Last successful run is older than 48h, so the newest restore point is stale.
        - alert: BackupCronJobSuspended
          expr: kube_cronjob_spec_suspend{cronjob=~".*(backup|snapshot).*"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Backup {{ $labels.namespace }}/{{ $labels.cronjob }} is suspended
            description: A suspended backup takes no restore points. Resume it or delete it, but do not leave it suspended silently.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-kube-prometheus
  namespace: observability-system
  labels:
    app.kubernetes.io/part-of: prometheus
    app.kubernetes.io/managed-by: deploy-kit
spec:
  groups:
    - name: alertmanager.rules
      rules:
        - alert: AlertmanagerFailedReload
          annotations:
            description: Configuration has failed to load for {{ $labels.namespace }}/{{ $labels.pod}}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedreload
            summary: Reloading an Alertmanager configuration has failed.
          expr: |-
            # Without max_over_time, failed scrapes could create false negatives, see
            # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
            max_over_time(alertmanager_config_last_reload_successful{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[5m]) == 0
          for: 10m
          labels:
            severity: critical
        - alert: AlertmanagerMembersInconsistent
          annotations:
            description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} has only found {{ $value }} members of the {{$labels.job}} cluster.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagermembersinconsistent
            summary: A member of an Alertmanager cluster has not found all other cluster members.
          expr: |-
            # Without max_over_time, failed scrapes could create false negatives, see
            # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
              max_over_time(alertmanager_cluster_members{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[5m])
            < on (namespace,service,cluster) group_left
              count by (namespace,service,cluster) (max_over_time(alertmanager_cluster_members{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[5m]))
          for: 15m
          labels:
            severity: critical
        - alert: AlertmanagerFailedToSendAlerts
          annotations:
            description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} failed to send {{ $value | humanizePercentage }} of notifications to {{ $labels.integration }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedtosendalerts
            summary: An Alertmanager instance failed to send notifications.
          expr: |-
            (
              rate(alertmanager_notifications_failed_total{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[15m])
            /
              ignoring (reason) group_left rate(alertmanager_notifications_total{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[15m])
            )
            > 0.01
          for: 5m
          labels:
            severity: warning
        - alert: AlertmanagerClusterFailedToSendAlerts
          annotations:
            description: The minimum notification failure rate to {{ $labels.integration }} sent from any instance in the {{$labels.job}} cluster is {{ $value | humanizePercentage }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedtosendalerts
            summary: All Alertmanager instances in a cluster failed to send notifications to a critical integration.
          expr: |-
            min by (namespace,service, integration) (
              rate(alertmanager_notifications_failed_total{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability", integration=~`.*`}[15m])
            /
              ignoring (reason) group_left rate(alertmanager_notifications_total{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability", integration=~`.*`}[15m]) > 0
            )
            > 0.01
          for: 5m
          labels:
            severity: critical
        - alert: AlertmanagerClusterFailedToSendAlerts
          annotations:
            description: The minimum notification failure rate to {{ $labels.integration }} sent from any instance in the {{$labels.job}} cluster is {{ $value | humanizePercentage }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedtosendalerts
            summary: All Alertmanager instances in a cluster failed to send notifications to a non-critical integration.
          expr: |-
            min by (namespace,service, integration) (
              rate(alertmanager_notifications_failed_total{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability", integration!~`.*`}[15m])
            /
              ignoring (reason) group_left rate(alertmanager_notifications_total{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability", integration!~`.*`}[15m]) > 0
            )
            > 0.01
          for: 5m
          labels:
            severity: warning
        - alert: AlertmanagerConfigInconsistent
          annotations:
            description: Alertmanager instances within the {{$labels.job}} cluster have different configurations.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerconfiginconsistent
            summary: Alertmanager instances within the same cluster have different configurations.
          expr: |-
            count by (namespace,service,cluster) (
              count_values by (namespace,service,cluster) ("config_hash", alertmanager_config_hash{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"})
            )
            != 1
          for: 20m
          labels:
            severity: critical
        - alert: AlertmanagerClusterDown
          annotations:
            description: "{{ $value | humanizePercentage }} of Alertmanager instances within the {{$labels.job}} cluster have been up for less than half of the last 5m."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterdown
            summary: Half or more of the Alertmanager instances within the same cluster are down.
          expr: |-
            (
              count by (namespace,service,cluster) (
                avg_over_time(up{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[5m]) < 0.5
              )
            /
              count by (namespace,service,cluster) (
                up{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}
              )
            )
            >= 0.5
          for: 5m
          labels:
            severity: critical
        - alert: AlertmanagerClusterCrashlooping
          annotations:
            description: "{{ $value | humanizePercentage }} of Alertmanager instances within the {{$labels.job}} cluster have restarted at least 5 times in the last 10m."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclustercrashlooping
            summary: Half or more of the Alertmanager instances within the same cluster are crashlooping.
          expr: |-
            (
              count by (namespace,service,cluster) (
                changes(process_start_time_seconds{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[10m]) > 4
              )
            /
              count by (namespace,service,cluster) (
                up{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}
              )
            )
            >= 0.5
          for: 5m
          labels:
            severity: critical
        - alert: AlertmanagerClusterFailedPeers
          annotations:
            description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} has {{ $value }} failed peers in the {{$labels.job}} cluster.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedpeers
            summary: An Alertmanager instance has failed peers in the cluster.
          expr: |-
            # Without max_over_time, failed scrapes could create false negatives, see
            # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
            max_over_time(alertmanager_cluster_failed_peers{job="metrics-stack-alertmanager",container="alertmanager",namespace="observability"}[5m]) > 0
          for: 15m
          labels:
            severity: warning
    - name: config-reloaders
      rules:
        - alert: ConfigReloaderSidecarErrors
          annotations:
            description: |-
              Errors encountered while the {{$labels.pod}} config-reloader sidecar attempts to sync config in {{$labels.namespace}} namespace.
              As a result, configuration for service running in {{$labels.pod}} may be stale and cannot be updated anymore.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus-operator/configreloadersidecarerrors
            summary: config-reloader sidecar has not had a successful reload for 10m
          expr: max_over_time(reloader_last_reload_successful{namespace=~".+"}[5m]) == 0
          for: 10m
          labels:
            severity: warning
    - name: etcd
      rules:
        - alert: etcdMembersDown
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": members are down ({{ $value }}).'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdmembersdown
            summary: etcd cluster members are down.
          expr: |-
            max without (endpoint) (
              sum without (instance, pod) (up{job=~".*etcd.*"} == bool 0)
            or
              count without (To) (
                sum without (instance, pod) (rate(etcd_network_peer_sent_failures_total{job=~".*etcd.*"}[120s])) > 0.01
              )
            )
            > 0
          for: 20m
          labels:
            severity: warning
        - alert: etcdInsufficientMembers
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": insufficient members ({{ $value }}).'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdinsufficientmembers
            summary: etcd cluster has insufficient number of members.
          expr: sum(up{job=~".*etcd.*"} == bool 1) without (instance, pod) < ((count(up{job=~".*etcd.*"}) without (instance, pod) + 1) / 2)
          for: 3m
          labels:
            severity: critical
        - alert: etcdNoLeader
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": member {{ $labels.instance }} has no leader.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdnoleader
            summary: etcd cluster has no leader.
          expr: etcd_server_has_leader{job=~".*etcd.*"} == 0
          for: 1m
          labels:
            severity: critical
        - alert: etcdHighNumberOfLeaderChanges
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": {{ $value }} leader changes within the last 15 minutes. Frequent elections may be a sign of insufficient resources, high network latency, or disruptions by other components and should be investigated.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberofleaderchanges
            summary: etcd cluster has high number of leader changes.
          expr: increase((max without (instance, pod) (etcd_server_leader_changes_seen_total{job=~".*etcd.*"}) or 0*absent(etcd_server_leader_changes_seen_total{job=~".*etcd.*"}))[15m:1m]) >= 4
          for: 5m
          labels:
            severity: warning
        - alert: etcdHighNumberOfFailedGRPCRequests
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": {{ $value }}% of requests for {{ $labels.grpc_method }} failed on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberoffailedgrpcrequests
            summary: etcd cluster has high number of failed grpc requests.
          expr: |-
            100 * sum(rate(grpc_server_handled_total{job=~".*etcd.*", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])) without (grpc_type, grpc_code)
              /
            sum(rate(grpc_server_handled_total{job=~".*etcd.*"}[5m])) without (grpc_type, grpc_code)
              > 1
          for: 10m
          labels:
            severity: warning
        - alert: etcdHighNumberOfFailedGRPCRequests
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": {{ $value }}% of requests for {{ $labels.grpc_method }} failed on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberoffailedgrpcrequests
            summary: etcd cluster has high number of failed grpc requests.
          expr: |-
            100 * sum(rate(grpc_server_handled_total{job=~".*etcd.*", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])) without (grpc_type, grpc_code)
              /
            sum(rate(grpc_server_handled_total{job=~".*etcd.*"}[5m])) without (grpc_type, grpc_code)
              > 5
          for: 5m
          labels:
            severity: critical
        - alert: etcdGRPCRequestsSlow
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": 99th percentile of gRPC requests is {{ $value }}s on etcd instance {{ $labels.instance }} for {{ $labels.grpc_method }} method.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdgrpcrequestsslow
            summary: etcd grpc requests are slow
          expr: |-
            histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{job=~".*etcd.*", grpc_method!="Defragment", grpc_type="unary"}[5m])) without(grpc_type))
            > 0.15
          for: 10m
          labels:
            severity: critical
        - alert: etcdMemberCommunicationSlow
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": member communication with {{ $labels.To }} is taking {{ $value }}s on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdmembercommunicationslow
            summary: etcd cluster member communication is slow.
          expr: |-
            histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket{job=~".*etcd.*"}[5m]))
            > 0.15
          for: 10m
          labels:
            severity: warning
        - alert: etcdHighNumberOfFailedProposals
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": {{ $value }} proposal failures within the last 30 minutes on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberoffailedproposals
            summary: etcd cluster has high number of proposal failures.
          expr: rate(etcd_server_proposals_failed_total{job=~".*etcd.*"}[15m]) > 5
          for: 15m
          labels:
            severity: warning
        - alert: etcdHighFsyncDurations
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": 99th percentile fsync durations are {{ $value }}s on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighfsyncdurations
            summary: etcd cluster 99th percentile fsync durations are too high.
          expr: |-
            histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
            > 0.5
          for: 10m
          labels:
            severity: warning
        - alert: etcdHighFsyncDurations
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": 99th percentile fsync durations are {{ $value }}s on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighfsyncdurations
            summary: etcd cluster 99th percentile fsync durations are too high.
          expr: |-
            histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
            > 1
          for: 10m
          labels:
            severity: critical
        - alert: etcdHighCommitDurations
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": 99th percentile commit durations {{ $value }}s on etcd instance {{ $labels.instance }}.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighcommitdurations
            summary: etcd cluster 99th percentile commit durations are too high.
          expr: |-
            histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
            > 0.25
          for: 10m
          labels:
            severity: warning
        - alert: etcdDatabaseQuotaLowSpace
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": database size exceeds the defined quota on etcd instance {{ $labels.instance }}, please defrag or increase the quota as the writes to etcd will be disabled when it is full.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcddatabasequotalowspace
            summary: etcd cluster database is running full.
          expr: (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]) / last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))*100 > 95
          for: 10m
          labels:
            severity: critical
        - alert: etcdExcessiveDatabaseGrowth
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": Predicting running out of disk space in the next four hours, based on write observations within the past four hours on etcd instance {{ $labels.instance }}, please check as it might be disruptive.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdexcessivedatabasegrowth
            summary: etcd cluster database growing very fast.
          expr: predict_linear(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[4h], 4*60*60) > etcd_server_quota_backend_bytes{job=~".*etcd.*"}
          for: 10m
          labels:
            severity: warning
        - alert: etcdDatabaseHighFragmentationRatio
          annotations:
            description: 'etcd cluster "{{ $labels.job }}": database size in use on instance {{ $labels.instance }} is {{ $value | humanizePercentage }} of the actual allocated disk space, please run defragmentation (e.g. etcdctl defrag) to retrieve the unused fragmented disk space.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcddatabasehighfragmentationratio
            summary: etcd database size in use is less than 50% of the actual allocated storage.
          expr: (last_over_time(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"}[5m]) / last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])) < 0.5 and etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"} > 104857600
          for: 10m
          labels:
            severity: warning
    - name: general.rules
      rules:
        - alert: TargetDown
          annotations:
            description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} namespace are down.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown
            summary: One or more targets are unreachable.
          expr: 100 * (count(up == 0) BY (cluster, job, namespace, service) / count(up) BY (cluster, job, namespace, service)) > 10
          for: 10m
          labels:
            severity: warning
        - alert: Watchdog
          annotations:
            description: |
              This is an alert meant to ensure that the entire alerting pipeline is functional.
              This alert is always firing, therefore it should always be firing in Alertmanager
              and always fire against a receiver. There are integrations with various notification
              mechanisms that send a notification when this alert is not firing. For example the
              "DeadMansSnitch" integration in PagerDuty.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/watchdog
            summary: An alert that should always be firing to certify that Alertmanager is working properly.
          expr: vector(1)
          labels:
            severity: none
        - alert: InfoInhibitor
          annotations:
            description: |
              This is an alert that is used to inhibit info alerts.
              By themselves, the info-level alerts are sometimes very noisy, but they are relevant when combined with
              other alerts.
              This alert fires whenever there's a severity="info" alert, and stops firing when another alert with a
              severity of 'warning' or 'critical' starts firing on the same namespace.
              This alert should be routed to a null receiver and configured to inhibit alerts with severity="info".
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/infoinhibitor
            summary: Info-level alert inhibition.
          expr: group by (namespace) (ALERTS{severity = "info"} == 1) unless on (namespace) group by (namespace) (ALERTS{alertname != "InfoInhibitor", alertstate = "firing", severity =~ "warning|critical"} == 1)
          labels:
            severity: none
    - name: k8s.rules.container_cpu_usage_seconds_total
      rules:
        - expr: |-
            sum by (cluster, namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])
            ) * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (
              1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
            )
          record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
        - expr: |-
            sum by (cluster, namespace, pod, container) (
              irate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])
            ) * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (
              1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
            )
          record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
    - name: k8s.rules.container_memory_cache
      rules:
        - expr: |-
            container_memory_cache{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}
            * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (1,
              max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
            )
          record: node_namespace_pod_container:container_memory_cache
    - name: k8s.rules.container_memory_rss
      rules:
        - expr: |-
            container_memory_rss{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}
            * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (1,
              max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
            )
          record: node_namespace_pod_container:container_memory_rss
    - name: k8s.rules.container_memory_swap
      rules:
        - expr: |-
            container_memory_swap{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}
            * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (1,
              max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
            )
          record: node_namespace_pod_container:container_memory_swap
    - name: k8s.rules.container_memory_working_set_bytes
      rules:
        - expr: |-
            container_memory_working_set_bytes{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}
            * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (1,
              max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
            )
          record: node_namespace_pod_container:container_memory_working_set_bytes
    - name: k8s.rules.container_resource
      rules:
        - expr: |-
            kube_pod_container_resource_requests{resource="memory",job="kube-state-metrics"}  * on (namespace, pod, cluster)
            group_left() max by (namespace, pod, cluster) (
              (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
            )
          record: cluster:namespace:pod_memory:active:kube_pod_container_resource_requests
        - expr: |-
            sum by (namespace, cluster) (
                sum by (namespace, pod, cluster) (
                    max by (namespace, pod, container, cluster) (
                      kube_pod_container_resource_requests{resource="memory",job="kube-state-metrics"}
                    ) * on (namespace, pod, cluster) group_left() max by (namespace, pod, cluster) (
                      kube_pod_status_phase{phase=~"Pending|Running"} == 1
                    )
                )
            )
          record: namespace_memory:kube_pod_container_resource_requests:sum
        - expr: |-
            kube_pod_container_resource_requests{resource="cpu",job="kube-state-metrics"}  * on (namespace, pod, cluster)
            group_left() max by (namespace, pod, cluster) (
              (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
            )
          record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests
        - expr: |-
            sum by (namespace, cluster) (
                sum by (namespace, pod, cluster) (
                    max by (namespace, pod, container, cluster) (
                      kube_pod_container_resource_requests{resource="cpu",job="kube-state-metrics"}
                    ) * on (namespace, pod, cluster) group_left() max by (namespace, pod, cluster) (
                      kube_pod_status_phase{phase=~"Pending|Running"} == 1
                    )
                )
            )
          record: namespace_cpu:kube_pod_container_resource_requests:sum
        - expr: |-
            kube_pod_container_resource_limits{resource="memory",job="kube-state-metrics"}  * on (namespace, pod, cluster)
            group_left() max by (namespace, pod, cluster) (
              (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
            )
          record: cluster:namespace:pod_memory:active:kube_pod_container_resource_limits
        - expr: |-
            sum by (namespace, cluster) (
                sum by (namespace, pod, cluster) (
                    max by (namespace, pod, container, cluster) (
                      kube_pod_container_resource_limits{resource="memory",job="kube-state-metrics"}
                    ) * on (namespace, pod, cluster) group_left() max by (namespace, pod, cluster) (
                      kube_pod_status_phase{phase=~"Pending|Running"} == 1
                    )
                )
            )
          record: namespace_memory:kube_pod_container_resource_limits:sum
        - expr: |-
            kube_pod_container_resource_limits{resource="cpu",job="kube-state-metrics"}  * on (namespace, pod, cluster)
            group_left() max by (namespace, pod, cluster) (
             (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
             )
          record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits
        - expr: |-
            sum by (namespace, cluster) (
                sum by (namespace, pod, cluster) (
                    max by (namespace, pod, container, cluster) (
                      kube_pod_container_resource_limits{resource="cpu",job="kube-state-metrics"}
                    ) * on (namespace, pod, cluster) group_left() max by (namespace, pod, cluster) (
                      kube_pod_status_phase{phase=~"Pending|Running"} == 1
                    )
                )
            )
          record: namespace_cpu:kube_pod_container_resource_limits:sum
    - name: k8s.rules.pod_owner
      rules:
        - expr: |-
            max by (cluster, namespace, workload, pod) (
              label_replace(
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"},
                  "replicaset", "$1", "owner_name", "(.*)"
                ) * on (cluster, replicaset, namespace) group_left(owner_name) topk by (cluster, replicaset, namespace) (
                  1, max by (cluster, replicaset, namespace, owner_name) (
                    kube_replicaset_owner{job="kube-state-metrics", owner_kind=""}
                  )
                ),
                "workload", "$1", "replicaset", "(.*)"
              )
            )
          labels:
            workload_type: replicaset
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            max by (cluster, namespace, workload, pod) (
              label_replace(
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"},
                  "replicaset", "$1", "owner_name", "(.*)"
                ) * on (replicaset, namespace, cluster) group_left(owner_name) topk by (cluster, replicaset, namespace) (
                  1, max by (cluster, replicaset, namespace, owner_name) (
                    kube_replicaset_owner{job="kube-state-metrics", owner_kind="Deployment"}
                  )
                ),
                "workload", "$1", "owner_name", "(.*)"
              )
            )
          labels:
            workload_type: deployment
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            max by (cluster, namespace, workload, pod) (
              label_replace(
                kube_pod_owner{job="kube-state-metrics", owner_kind="DaemonSet"},
                "workload", "$1", "owner_name", "(.*)"
              )
            )
          labels:
            workload_type: daemonset
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            max by (cluster, namespace, workload, pod) (
              label_replace(
                kube_pod_owner{job="kube-state-metrics", owner_kind="StatefulSet"},
              "workload", "$1", "owner_name", "(.*)")
            )
          labels:
            workload_type: statefulset
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            group by (cluster, namespace, workload, pod) (
              label_join(
                group by (cluster, namespace, job_name, pod, owner_name) (
                  label_join(
                    kube_pod_owner{job="kube-state-metrics", owner_kind="Job"}
                  , "job_name", "", "owner_name")
                )
                * on (cluster, namespace, job_name) group_left()
                group by (cluster, namespace, job_name) (
                  kube_job_owner{job="kube-state-metrics", owner_kind=~"Pod|"}
                )
              , "workload", "", "owner_name")
            )
          labels:
            workload_type: job
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            max by (cluster, namespace, workload, pod) (
              label_replace(
                kube_pod_owner{job="kube-state-metrics", owner_kind="", owner_name=""},
              "workload", "$1", "pod", "(.+)")
            )
          labels:
            workload_type: barepod
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            max by (cluster, namespace, workload, pod) (
              label_replace(
                kube_pod_owner{job="kube-state-metrics", owner_kind="Node"},
              "workload", "$1", "pod", "(.+)")
            )
          labels:
            workload_type: staticpod
          record: namespace_workload_pod:kube_pod_owner:relabel
        - expr: |-
            group by (cluster, namespace, workload, workload_type, pod) (
              label_join(
                label_join(
                  group by (cluster, namespace, job_name, pod) (
                    label_join(
                      kube_pod_owner{job="kube-state-metrics", owner_kind="Job"}
                    , "job_name", "", "owner_name")
                  )
                  * on (cluster, namespace, job_name) group_left(owner_kind, owner_name)
                  group by (cluster, namespace, job_name, owner_kind, owner_name) (
                    kube_job_owner{job="kube-state-metrics", owner_kind!="Pod", owner_kind!=""}
                  )
                , "workload", "", "owner_name")
              , "workload_type", "", "owner_kind")

              OR

              label_replace(
                label_replace(
                  label_replace(
                    kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"}
                    , "replicaset", "$1", "owner_name", "(.+)"
                  )
                  * on (cluster, namespace, replicaset) group_left(owner_kind, owner_name)
                  group by (cluster, namespace, replicaset, owner_kind, owner_name) (
                    kube_replicaset_owner{job="kube-state-metrics", owner_kind!="Deployment", owner_kind!=""}
                  )
                , "workload", "$1", "owner_name", "(.+)")
                OR
                label_replace(
                  group by (cluster, namespace, pod, owner_name, owner_kind) (
