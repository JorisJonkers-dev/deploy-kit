# adapter: kubernetes
# real path: platform/cluster/flux/apps/auth/auth/serviceaccount.yaml
#
# One ServiceAccount per WORKLOAD, named for the Workload alone:
# `auth-system.auth-api`, never `auth-system.auth-auth-api`. The name is what
# Vault's Kubernetes auth method binds a role to, and it is already the live
# role name (VAULT_KUBERNETES_ROLE: auth-api), so the identity rule derives
# what runs rather than renaming it.
#
# auth-ui gets one too, and it holds no policy. That is the point of moving
# auth-api's three grants down a level: two Workloads of one Service are two
# principals, so the nginx container cannot present a token that reads the
# database credentials. Under a per-SERVICE account they would be one principal
# holding the union, and the two grant levels would be documentation.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-api
  namespace: auth-system
  labels:
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/instance: auth
    app.kubernetes.io/part-of: auth
    app.kubernetes.io/managed-by: deploy-kit
# automountServiceAccountToken is not set. auth-api needs its projected token
# for Vault Kubernetes auth; auth-ui holds no grant and needs none, so a
# derivation exists ("no grant -> no token") and no chapter states it.
# README, gap G-15.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-ui
  namespace: auth-system
  labels:
    app.kubernetes.io/name: auth-ui
    app.kubernetes.io/instance: auth
    app.kubernetes.io/part-of: auth
    app.kubernetes.io/managed-by: deploy-kit
