# adapter: gatus
# real path: platform/cluster/flux/apps/utility-system/gatus/gatus-endpoints-configmap.yaml
#
# ESTATE-WIDE OBJECT. One ConfigMap holds every endpoint in the estate (41
# today, in 288 lines); this is the auth domain's contribution to it, reproduced
# here so the domain reads in one place. The object lives in utility-system,
# which belongs to another domain entirely -- so this file is a Deliverable of
# the auth domain landing in a namespace auth does not own, and the
# E_FOREIGN_NAMESPACE rule is satisfied only because the `gatus` adapter, not
# the Service, owns the path. README, gap G-24.
#
# Two entries, one per exposed Workload, each derived from that Workload's own
# exposure plus its own readiness probe. The Gatus check is EXTERNAL -- it goes
# through the edge -- so it carries the same undeclared hostname the
# IngressRoutes do (G-03), and the same tie between the two routes: /` may be
# answered by either Workload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-endpoints
  namespace: utility-system
  labels:
    app.kubernetes.io/managed-by: deploy-kit
data:
  config.yaml: |
    endpoints:
      # from exposure {port: 80, audience: anonymous}
      #    + probes.readiness {path: /, port: 80}
      - name: auth-ui
        group: auth                     # the domain
        url: https://auth.jorisjonkers.dev/          # NOT DERIVABLE (G-03)
        conditions:
          - "[STATUS] == 200"           # the probe is an httpGet
        # no `interval`: no field declares one and no chapter names a default

      # from exposure {port: 8081, audience: anonymous}
      #    + probes.readiness {path: /api/actuator/health/readiness, port: 8081}
      - name: auth-api
        group: auth
        url: https://auth.jorisjonkers.dev/api/actuator/health/readiness   # NOT DERIVABLE (G-03)
        conditions:
          - "[STATUS] == 200"
# NOT EMITTED: the `alerts:` block, and the `alerting:` section it would resolve
# against. Service `auth` declares `alertClass: page` -- the loudest value in
# the vocabulary, on the Service every forward-auth protected route depends on
# -- and nothing in the rendered tree turns it into a notification. The live
# ConfigMap has `storage` and `ui` and no `alerting` section at all: 41
# endpoints notifying nobody. The mapping from an Alert Class to a Gatus alert
# (receiver type, failure threshold, send-on-resolved) is stated in no chapter,
# and the receiver itself is a platform fact. README, gap G-16.
