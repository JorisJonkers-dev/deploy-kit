# Worked example — the auth domain's Intent Fragment
#
#   services/auth/platform/auth.yml
#
# Intent is authored ONE FILE PER DOMAIN, holding every Service that domain
# owns, and one file is one Intent Fragment
# (docs/adr/0063-intent-authored-per-domain.md). The namespace derives from the
# header -- auth-system -- and no field exists that could divert it.
#
# Exercises: two Workloads that switch together because they are one Service,
# ONE authored hostname fronting both of them through two routes -- the case
# that forced `exposure` from the Workload to the Service -- placement as hard
# dimensions carrying an arch set and a capability, three `delivery: self`
# grants including a Transit key that takes no placeholder, four dependencies,
# one hardening exception with a reason, and config that is almost entirely
# derived.
#
# Companion env files, one per WORKLOAD
# (docs/adr/0011-configuration-env-files-per-workload.md):
#   platform/env/auth-api/base.env   -- reproduced as examples/auth-api.base.env
#   platform/env/auth-ui/base.env

# The DATA MODEL's own semver, not the toolkit package's version
# (docs/adr/0039-artifact-schema-versioning.md). It starts at 1.0.0 and is
# bumped only when the model changes, so a literal here is legitimate and does
# not go stale on a toolkit release. Composition admits same-major, minor <=
# toolkit; the composition lock records the exact versions that ran.
schemaVersion: 1.0.0

# The header is three fields, and `owner` is the ONLY one raised to the domain.
# `alertClass` stays per Service -- raising it makes a domain page as loudly as
# its loudest member -- and so does `secrets`, because a domain-level grant
# hands every Service in the file a reader slot on the whole path
# (docs/adr/0009-vault-read-is-per-path.md,
# docs/adr/0063-intent-authored-per-domain.md).
domain: auth
owner: joris

services:
  # ==================================================================== auth
  # This Service was two Services -- `auth-api` and `auth-ui` -- coupled by a
  # `releaseUnit: auth` name that each declared in its own repository. That
  # field is deleted. A Service is itself the unit of atomic release
  # (docs/adr/0062-service-is-the-release-unit.md): its Workloads switch
  # together or none switches. No Workload's new version receives traffic until
  # every Workload's new version is healthy by its own declared readiness, and
  # if any misses its `startupBudget`, none of them switch and the old versions
  # keep serving. Rollback is Service-scoped for the same reason.
  #
  # The requirement is unchanged; only the mechanism is. A new UI against an old
  # API is a broken product even though both pods report healthy, and that is
  # now carried by the boundary drawn here rather than by a name two files had
  # to agree on. The two Workloads below are adjacent, so a reader sees the
  # coupling without searching the composed union.
  #
  # The merge costs no reference: auth's estate-wide role is the forward-auth
  # middleware derived from every route's exposure audience
  # (docs/adr/0018-exposure-by-audience.md), never a `dependsOn` edge, and
  # nothing in the estate names `auth-ui` at all.
  #
  # Still not a Reconcile Unit. That one is DERIVED from the dependency graph
  # and answers ordering (postgres before auth); this one is DECLARED, by
  # drawing a boundary, and answers atomicity
  # (docs/adr/0032-reconcile-unit-derived.md).
  - id: auth
    alertClass: page        # every forward-auth protected route depends on it

    # No Service-level `secrets`. The three grants below are auth-api's alone,
    # so they sit on that Workload: a Service-level grant is held by EVERY
    # Workload, including ones added later
    # (docs/adr/0022-grants-live-on-the-service.md), and leaving them here would
    # hand the nginx container a Vault identity holding `read` on the database
    # credentials. Folding the pair into one Service is what moved them down a
    # level, and the level is an access boundary only because identity is per
    # Workload (docs/adr/0024-identity-per-workload.md).

    # ONE HOSTNAME, TWO WORKLOADS -- the case that forced `exposure` up from the
    # Workload to the Service. `auth.jorisjonkers.dev/api` is auth-api and `/`
    # is auth-ui, and at the Workload level that is unsayable: two Workloads
    # each declaring a port and an audience produce two routes claiming the
    # whole host, which is exactly what this example's rendered tree used to
    # show. `provides` stays on the Workload, because the two are different
    # facts: `provides` is *this process listens on this port*, `exposure` is
    # *this hostname routes here* (review/EXPOSURE-MANIFEST.md,
    # docs/adr/0018-exposure-by-audience.md).
    #
    # `host` is the full FQDN, AUTHORED. No zone mapping, no `<service>.<zone>`
    # rule, no apex flag -- an apex host is written `host: jorisjonkers.dev`.
    # That it matches the Service id here is a coincidence and does not
    # generalise: `platform-rabbitmq` serves rabbitmq, `headlamp` serves
    # dashboard, and `status` belongs to no Service at all. The host is unique
    # across the estate -- E_DUPLICATE_HOST at composition, evaluated over the
    # composed union together with the Registered Unmanaged Surfaces.
    exposure:
      - name: public              # required, unique within the Service: what
                                  # ${exposure:auth.public#url} addresses and
                                  # what E_DUPLICATE_EXPOSURE_NAME checks
        host: auth.jorisjonkers.dev
        audience: anonymous       # both surfaces. This Service is what performs
                                  # authentication, so it cannot sit behind it;
                                  # the applications enforce their own
                                  # authorization and this describes the edge
        contentPolicy: strict     # one of the TWO authored proxy fields, the
                                  # other being `redirectTo` on a route. It
                                  # picks the CSP profile only: the
                                  # security-headers baseline, forward-auth,
                                  # the entryPoint, TLS and the chain all derive
                                  # from audience and tier, and no middleware
                                  # name, header block, timeout or rate limit is
                                  # authorable anywhere in layer 1
        routes:
          # A route names {path, match, workload, surface}, `match` being
          # `prefix` or `exact`. The surface must be one the named Workload
          # declares in `provides` (E_UNKNOWN_SURFACE otherwise), and two routes
          # on one exposure may not share a path + match pair
          # (E_DUPLICATE_ROUTE_MATCH).
          - {path: /api, match: prefix, workload: auth-api, surface: http}
          - {path: /,    match: prefix, workload: auth-ui,  surface: http}

    workloads:
      # ------------------------------------------------------------ auth-api
      - name: auth-api
        # The ServiceAccount and the Vault role are the WORKLOAD NAME, unique
        # within the domain: `auth-system.auth-api`, never
        # `auth-system.auth-auth-api` (docs/adr/0024-identity-per-workload.md).
        lifecycle: service

        # An ALIAS resolved to a digest through the images lock -- never a tag
        # and never a digest here. That is what keeps every rendered Deliverable
        # E_FLOATING_IMAGE clean without layer 1 carrying a hash.
        image: auth-api
        runtime: jvm

        # A port is a property of a process, so `provides` sits on the Workload
        # (chapter 10). `dependsOn` still targets `{service, surface}`: surface
        # names are unique within a Service, and a consumer names the Service,
        # never a Workload.
        provides:
          http: 8081

        # Placement is a set of HARD dimensions, every one of which must match
        # (docs/adr/0061-placement-is-hard-dimensions.md). A list is a SET of
        # equally acceptable values -- no ordering, no weight. There is no
        # `requires`/`prefers` split: the estate paid for the soft half once,
        # when a preference naming a capability no node advertised was discarded
        # by the scheduler without an event, a warning or a condition, and read
        # as GPU-aware placement while doing nothing. A dimension set no node
        # satisfies is E_PLACEMENT_UNSATISFIABLE, a build error, raised before
        # any manifest exists.
        placement:
          # `memory` and `cpu` are required on every Workload, as raw
          # quantities, and are matched against node ALLOCATABLE from the pinned
          # node contract -- total minus the reserve declared in the node file,
          # never a live read (docs/adr/0056-node-facts-single-source.md,
          # docs/adr/0006-pinned-inputs.md). This is ELIGIBILITY, not
          # bin-packing: three Workloads asking 2Gi each all pass against a
          # 4096Mi node, and the scheduler refuses the third at apply.
          #
          # Contention has not moved. Memory and cpu are contended values, and
          # contention decides who ARBITRATES, not who AUTHORS
          # (docs/adr/0004-contention-decides-authority.md): this Service states
          # its requirement, and the platform decides whether it fits and where.
          memory: 768Mi         # request == limit, derived: memory is
                                # incompressible, and a pod that cannot exceed
                                # its own request is not the one that puts a
                                # node under eviction pressure
          cpu: 250m             # request only, no limit, derived: a cpu limit
                                # throttles exactly the class-loading burst
                                # `startupBudget` exists to bound, and shows up
                                # as slow application code
          arch: [amd64]         # a set of one: this image is built amd64-only.
                                # Stated even though the only node carrying
                                # public-ingress today is amd64 -- the two are
                                # independent facts, and a second public-ingress
                                # node on arm64 must not silently become
                                # eligible for an image that cannot run there.
          capabilities: [public-ingress]
          # frankfurt-contabo-1 is the only node advertising public-ingress, so
          # this replaces `nodeSelector: {site: frankfurt}` without naming a
          # site or a label. Labels are not the Service's to name: the node
          # contract emits 110 of them for 7 nodes, 55 under a prefix named
          # after an archived repository that rejects pushes, and retiring that
          # prefix must not be an edit in every service repository
          # (docs/adr/0056-node-facts-single-source.md).
          #
          # `tailscale` is not written here and is no longer vocabulary: 7 of 7
          # nodes advertise it, so it excludes nothing, and a filter that never
          # excludes teaches authors that filters do nothing.

        # No `hardening` block. The class defaults to `restricted` --
        # runAsNonRoot, readOnlyRootFilesystem, all capabilities dropped,
        # seccomp RuntimeDefault -- and this image meets it: the JVM writes only
        # to /tmp, which the render supplies as an emptyDir. An image that
        # cannot meet the default declares the specific control it relaxes, with
        # a reason; auth-ui below does, and so does postgres in domains/data.yml
        # (docs/adr/0016-pod-hardening.md).

        dependsOn:
          - {service: platform-postgres, surface: postgres}
          - {service: platform-valkey,   surface: redis}
          - {service: platform-rabbitmq, surface: amqp}
          - {service: stalwart,          surface: smtp}

        # No `exposure` here, and none is missing: it sits on the Service
        # above, where one hostname can front both Workloads. What stays is
        # `provides` (http: 8081) -- the port this process listens on, and
        # `http` is the surface the `/api` route names.

        # Siblings, each carrying its own endpoint, neither falling back to the
        # other (docs/adr/0014-probes-are-siblings.md). Deliberately identical
        # endpoints would still be written twice.
        probes:
          readiness:
            path: /api/actuator/health/readiness
            port: 8081
          liveness:
            path: /api/actuator/health/liveness
            port: 8081

        startupBudget: 600s
        zeroDowntime: true

        # PROPOSED FIELD -- chapter 10, "Still to be graded". Two others were
        # listed beside it and both are now graded: `size` was replaced by the
        # `placement` block above
        # (docs/adr/0061-placement-is-hard-dimensions.md), and `sidecars` by
        # (docs/adr/0064-sidecars-are-workload-vocabulary.md). `minAvailable`
        # is what remains.
        #
        # This states the AVAILABILITY requirement, which is 1. The replica
        # count is not declared here and is not read from the live cluster: it
        # is assigned in layer 2 from the pinned ClusterState snapshot and its
        # digest (docs/adr/0034-cluster-state-pinned-input.md), so the same
        # inputs always produce the same number. Live runs two, recorded as a
        # capacity decision on freed Frankfurt budget rather than an
        # availability requirement.
        minAvailable: 1

        scrape:
          port: 8081            # resolves to port name 'http' via provides
          path: /api/actuator/prometheus

        # All three grants use `delivery: self` -- the application fetches them
        # through spring-cloud-vault at runtime, which is what it already does
        # in production via SPRING_CONFIG_IMPORT: vault:// and VAULT_DB_ENABLED:
        # true. Consequently this Workload's env file contains no ${secret:...}
        # placeholder at all, and the dead-grant check correctly does not fire.
        #
        # The grant unit is the PATH, never the key
        # (docs/adr/0023-grant-unit-is-the-path.md): a KV-v2 read returns the
        # whole document, so `keys:` documents the expected keys, feeds
        # validation, and confers nothing. No wildcard is expressible.
        secrets:
          # Dynamic database credentials, minted per lease by the database
          # engine and re-read at runtime. The only combination achieving
          # zero-downtime rotation: a pod's environment is fixed for its
          # lifetime, so `tolerates: reload` with `delivery: env` would be a
          # build error.
          #
          # SPLIT PATH. `secret/data/platform/postgres` used to be one document
          # holding every consumer's credentials, which made this Workload's
          # password readable by knowledge's pods. One path per reader set is
          # the layout rule; this path's reader set is auth-api alone, and
          # knowledge reads .../postgres/kb.
          - path: secret/data/platform/postgres/auth
            keys: [user, password]
            access: read
            delivery: self
            rotation:
              tolerates: reload
              maxAge: 168h

          # auth-api's own document: the static credentials for the three
          # dependencies whose credentials are not minted by an engine. They sit
          # here rather than under the platform Subtrees because the reader set
          # is this Workload alone -- 0023 asks for one path per reader set, not
          # one path per consumer. Only the Postgres pair above is dynamic,
          # which is why it must live under the data domain's mount.
          #
          # Every key is enumerated. A wildcard key list -- `keys` naming a
          # single star, which this grant used to carry -- left the vocabulary:
          # it appears in no field table and no invariant, and it made the
          # reader set undecidable without reading live Vault contents, which
          # the pinned-input rule forbids (docs/adr/0006-pinned-inputs.md).
          # Adding a key is now an edit to this file.
          - path: secret/data/auth-api
            keys:
              - mail.password
              - valkey.password
              - rabbitmq.user
              - rabbitmq.password
            access: read
            delivery: self
            rotation: {tolerates: reload}

          # JWT signing through Vault Transit. This Workload rotates the key
          # itself, so `self-roll` rather than `read` -- which derives the
          # `patch` capability on the named key rather than `update`, granting
          # no read access to anything else in the mount. No rollAffectsReaders
          # acknowledgement is needed: composition shows no other Service reads
          # it, and verifiers follow JWKS rather than caching the key.
          #
          # A non-KV mount takes NO placeholder and `delivery: self` is its only
          # legal delivery (docs/adr/0027-secret-reference-join-key.md): a
          # transit key is never materialised into an env var or a file, so
          # there is nothing for a ${secret:...} reference to carry. `keys:`
          # names the mount object.
          - path: transit/keys/auth-api-jwt
            keys: [auth-api-jwt]
            access: self-roll
            delivery: self
            rotation: {tolerates: reload}

      # ------------------------------------------------------------- auth-ui
      # The second half of the product. It is here, in this Service, because it
      # must cut over with auth-api and for no other reason
      # (docs/adr/0062-service-is-the-release-unit.md). Its identity is its own:
      # `auth-system.auth-ui`, holding none of the grants above.
      - name: auth-ui
        lifecycle: service
        image: auth-ui          # an alias, resolved through the images lock
        runtime: static         # nginx serving a built bundle: no OTEL_* or
                                # PYROSCOPE_* wiring to inject, and saying
                                # `static` is a decision rather than an omission
        provides:
          http: 80

        placement:
          # The two required dimensions, and nothing else. Every further
          # dimension would exclude nodes for nothing: the image is multi-arch,
          # it needs no node capability and it holds no volume, so all 7 nodes
          # are eligible. auth-api's public-ingress filter is deliberately NOT
          # repeated -- the two Workloads may land on different nodes and still
          # switch together, because atomic release is not co-location.
          memory: 64Mi          # the estate measures its nginx pods at
                                # "~10-20Mi RAM each"; this is the headroom
                                # above that, and request == limit
          cpu: 10m

        # The one control this image cannot meet, named specifically and with a
        # reason, in the shape derived-value overrides already use
        # (docs/adr/0031-derived-overrides-with-reason.md). There is no
        # `hardening: privileged` shorthand: the exception list is the estate's
        # inventory of what it cannot harden, and a shorthand would hide its
        # length (docs/adr/0016-pod-hardening.md).
        hardening:
          exceptions:
            - allow: writableRootFilesystem
              reason: >-
                nginx writes its temporary bodies and cache under
                /var/cache/nginx and its pid file under /var/run before it can
                serve the first request, and upstream publishes no
                read-only-root variant. The other three restricted controls
                stand unchanged: the pod runs non-root, drops all capabilities
                and takes seccomp RuntimeDefault. The exception retires when a
                rebuilt image relocates both paths onto a mounted emptyDir.

        # No `dependsOn`. The bundle is static and the API call is made by the
        # browser, not by this container, so there is no egress edge to declare
        # and the derived default-deny policy gives it none
        # (docs/adr/0035-network-policy-default-deny.md). A dependency edge
        # would claim a connection this pod never opens.

        # No `exposure` here either. The Service's `public` exposure routes
        # `/` to this Workload's `http` surface -- the login page is what
        # unauthenticated users are sent to, so it cannot sit behind the
        # authentication it starts.

        # Siblings, written twice on purpose. For a static server the two
        # questions genuinely have the same answer -- there is no dependency to
        # be unready for -- and 0014 still refuses to infer one from the other
        # (docs/adr/0014-probes-are-siblings.md).
        probes:
          readiness:
            path: /
            port: 80
          liveness:
            path: /
            port: 80

        startupBudget: 30s      # nginx serves within a second of starting; the
                                # budget is the gate auth-api's 600s dominates
        zeroDowntime: true

        # No `scrape`. This image exports no metrics surface, and a scrape path
        # the platform guessed would collect nothing and report success
        # (docs/adr/0021-observability-scrape-and-alert-class.md).

        # No `secrets`. Everything this Workload needs is baked into the bundle
        # at build time or reached through the browser, so no Vault role is
        # derived for it: `auth-system.auth-ui` is a ServiceAccount with no
        # policy bound to it, which is exactly what moving the three grants down
        # a level bought.
