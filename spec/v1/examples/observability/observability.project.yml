# The telemetry collector and the metrics stack as Project Intent: the
# Applications the worked Platform document's `telemetry` block names
# (spec/v1/14-platform-intent.md#telemetry).
#
# Every Process whose Runtime Profile exports telemetry is handed this
# collector's `otlp` surface as its endpoint
# (spec/v1/10-project-intent.md#runtime-profiles), so no project writes the
# address and none can write it wrong.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: observability # the namespace derives: observability-system
owner: joris

applications:
  - id: otel-collector
    processes:
      - name: otel-collector
        lifecycle: application
        image: otel-collector
        runtime: none
        provides:
          otlp: 4317
          health: 13133
        placement:
          memory: 256Mi
          cpu: 50m
        probes:
          readiness: { path: /, port: 13133 }
          liveness: { path: /, port: 13133 }
        startupBudget: 20s
        cutover: continuous

  # The metrics stack the Platform document's `telemetry.metrics` names: every
  # declared scrape surface admits it, and nothing else scrapes
  # (spec/v1/16-dependencies.md#the-derived-allow-set).
  - id: prometheus
    # The platform's alert rules: only the monitoring stack carries them
    # (spec/v1/10-project-intent.md#alert-rules).
    alertRules:
      - {from: rules/platform.yaml}
    processes:
      - name: prometheus
        lifecycle: application
        image: prometheus
        runtime: none
        provides:
          http: 9090
        placement:
          memory: 512Mi
          cpu: 100m
        writablePaths: [/prometheus]
        probes:
          readiness: { path: /-/ready, port: 9090 }
          liveness: { path: /-/healthy, port: 9090 }
        startupBudget: 60s
        cutover: continuous

  # The monitoring stack's Alertmanager, which the Platform document names by
  # role; the one routing of every alert renders into its namespace, and each
  # receiver's webhook reaches it through the one secret delivery
  # (spec/v1/14-platform-intent.md#monitoring).
  - id: alertmanager
    processes:
      - name: alertmanager
        lifecycle: application
        image: alertmanager
        runtime: none
        provides:
          http: 9093
        placement:
          memory: 128Mi
          cpu: 50m
        writablePaths: [/alertmanager]
        probes:
          readiness: { path: /-/ready, port: 9093 }
          liveness: { path: /-/healthy, port: 9093 }
        startupBudget: 30s
        cutover: continuous
