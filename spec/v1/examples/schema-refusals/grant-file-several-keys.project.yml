# REFUSED: schema, a kv grant delivered to a file with two keys
#
# Delivered `file`, a kv grant's one key lands as the file `mountAt`
# (spec/v1/10-project-intent.md#secrets). Of two keys, which would land there
# is not decided, so the grant is refused before any rule runs.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: grant-keys
    processes:
      - name: grant-keys-api
        lifecycle: application
        image: grant-keys-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
        secrets:
          # `file` at one place, with two keys.
          - path: secret/data/refusals/token
            keys: [token, refresh]
            access: read
            delivery: file
            mountAt: /run/secrets/token
            fileMode: "0400"
            rotation: { tolerates: restart }
