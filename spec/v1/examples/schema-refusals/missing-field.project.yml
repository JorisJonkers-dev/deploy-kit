# REFUSED: schema
#
# A Process with no `image`. The refusal points where the field would be.
# (spec/v1/10-project-intent.md#reading-a-file).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: missing-field
    processes:
      - name: missing-field-api
        lifecycle: application
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
