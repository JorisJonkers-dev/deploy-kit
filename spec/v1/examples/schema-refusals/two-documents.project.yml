apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: two-documents
    processes:
      - name: two-documents-api
        lifecycle: application
        image: two-documents-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
