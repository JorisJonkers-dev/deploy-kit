# REFUSED: schema, an edge's credential delivered to a file with no directory
#
# Delivered `file`, the credential an edge derives lands as two files,
# `username` and `password`, in the directory `mountAt` at `fileMode`
# (spec/v1/10-project-intent.md#migration). Without both there is nowhere to
# put them, so the edge is refused before composition runs.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: credentials-file
    processes:
      - name: credentials-file-api
        lifecycle: application
        image: credentials-file-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
        dependsOn:
          # `file` with neither `mountAt` nor `fileMode`.
          - application: platform-postgres
            surface: postgres
            credentials: { delivery: file, rotation: { tolerates: restart } }
