# REFUSED: schema, an edge's credential delivered to the root directory
#
# Delivered `file`, the credential an edge derives lands as two files in the
# directory `mountAt`, which the render mounts whole
# (spec/v1/10-project-intent.md#migration). `/` would cover the whole
# filesystem, so `mountAt` is an absolute directory other than `/`, refused at
# its value otherwise.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: credentials-root
    processes:
      - name: credentials-root-api
        lifecycle: application
        image: credentials-root-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
        dependsOn:
          # `file` into `/`.
          - application: platform-postgres
            surface: postgres
            credentials:
              delivery: file
              mountAt: /
              fileMode: "0400"
              rotation: { tolerates: restart }
