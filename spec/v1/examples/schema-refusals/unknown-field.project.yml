# REFUSED: schema
#
# Two fields the model does not have, on one Application. Each is refused at
# its own pointer, never at the object holding it.
# (spec/v1/10-project-intent.md#reading-a-file).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: unknown-field
    colour: blue
    size: 3
    processes:
      - name: unknown-field-api
        lifecycle: application
        image: unknown-field-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
