# REFUSED: schema
#
# A port written as a string. The refusal points at the value.
# (spec/v1/10-project-intent.md#reading-a-file).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: wrong-type
    processes:
      - name: wrong-type-api
        lifecycle: application
        image: wrong-type-api
        runtime: node
        provides:
          http: "8080"
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
