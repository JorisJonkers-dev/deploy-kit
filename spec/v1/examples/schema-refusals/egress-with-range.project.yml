# REFUSED: schema, internet egress with an authored range
#
# Internet egress names `to: internet` and a reason, and no destination
# (spec/v1/16-dependencies.md#internet-egress). The excepted ranges are fixed, so an authored range is a field the model does not have.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: refusals
owner: joris
applications:
  - id: crawler
    processes:
      - name: crawler-api
        lifecycle: application
        image: crawler-api
        runtime: node
        provides:
          http: 8080
        placement:
          memory: 128Mi
          cpu: 25m
        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }
        startupBudget: 20s
        cutover: continuous
        egress: { to: internet, reason: calls one API, cidr: 192.0.2.0/24 }
