# One Application, two exposures, one name: `public` no longer tells them apart.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: notes
owner: joris
cutover: interrupted

applications:
  - id: notes
    exposure:
      - name: public
        host: notes.jorisjonkers.dev
        audience: anonymous
        contentPolicy: strict
        routes:
          - { path: /, match: prefix, process: notes-api, surface: http }
      - name: public
        host: notes-beta.jorisjonkers.dev
        audience: anonymous
        contentPolicy: strict
        routes:
          - { path: /, match: prefix, process: notes-api, surface: http }
    processes:
      - name: notes-api
        lifecycle: application
        image: notes-api
        runtime: node
        provides: { http: 8080 }
        placement: { memory: 64Mi, cpu: 10m }
