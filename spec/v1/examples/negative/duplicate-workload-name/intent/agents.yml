# Fixture: one domain file, two Services, one Workload name.
#
# Otherwise valid and schema-complete, so composition reaches the identity check
# rather than failing earlier for an unrelated reason. It must fail with
# E_DUPLICATE_WORKLOAD_NAME and with nothing else.
schemaVersion: 1.0.0

# One file per domain (docs/adr/model/0063-intent-authored-per-domain.md). The
# namespace derives from this header as agents-system, and the ServiceAccount
# and Vault role of a Workload are its NAME under that namespace
# (docs/adr/model/0024-identity-per-workload.md) -- which is what makes the collision
# below an identity collision rather than a style complaint.
domain: agents
owner: joris

services:
  # Two Services in one file are ordinary: co-location couples nothing, and
  # these two release independently
  # (docs/adr/model/0062-service-is-the-release-unit.md). What is not ordinary is that
  # both name a Workload `api`.
  - id: agents-api
    alertClass: urgent
    workloads:
      - name: api                       # -> agents-system.api
        lifecycle: service
        image: agents-api
        runtime: jvm
        provides: {http: 8080}
        placement: {memory: 768Mi, cpu: 250m}
        probes:
          readiness: {path: /api/actuator/health/readiness, port: 8080}
          liveness:  {path: /api/actuator/health/liveness,  port: 8080}

  - id: lightrag
    alertClass: business-hours
    workloads:
      - name: api                       # -> agents-system.api, ALREADY TAKEN
        lifecycle: service
        image: lightrag
        runtime: python
        provides: {http: 9621}
        placement: {memory: 2Gi, cpu: 500m}
        probes:
          readiness: {path: /health, port: 9621}
          liveness:  {path: /health, port: 9621}
