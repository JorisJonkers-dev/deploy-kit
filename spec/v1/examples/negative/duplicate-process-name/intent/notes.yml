# One project, two Applications, one Process name: `api` is the identity of both
# in notes-system.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: notes
owner: joris
cutover: interrupted

applications:
  - id: notes
    processes:
      - name: api
        lifecycle: application
        image: notes-api
        runtime: node
        provides: { http: 8080 }
        placement: { memory: 64Mi, cpu: 10m }
  - id: notes-admin
    processes:
      - name: api
        lifecycle: application
        image: notes-api
        runtime: node
        provides: { http: 8081 }
        placement: { memory: 64Mi, cpu: 10m }
