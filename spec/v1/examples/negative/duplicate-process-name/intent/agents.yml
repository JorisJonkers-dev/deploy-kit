# Fixture: one project file, two Applications, one Process name.
#
# Otherwise valid and schema-complete, so composition reaches the identity check
# rather than failing earlier for an unrelated reason. It must fail with
# E_DUPLICATE_PROCESS_NAME and with nothing else.
schemaVersion: 1.0.0

# One file per project (docs/adr/model/0063-intent-authored-per-project.md). The
# namespace derives from this header as agents-system, and the ServiceAccount
# and Vault role of a Process are its NAME under that namespace
# (docs/adr/model/0024-identity-per-process.md) -- which is what makes the collision
# below an identity collision rather than a style complaint.
project: agents
owner: joris

applications:
  # Two Applications in one file are ordinary: co-location couples nothing, and
  # these two release independently
  # (docs/adr/model/0062-application-is-the-release-unit.md). What is not ordinary is that
  # both name a Process `api`.
  - id: agents-api
    alertClass: urgent
    processes:
      - name: api                       # -> agents-system.api
        lifecycle: application
        image: agents-api
        runtime: jvm
        provides: {http: 8080}
        placement: {memory: 768Mi, cpu: 250m}
        probes:
          readiness: {path: /api/actuator/health/readiness, port: 8080}
          liveness:  {path: /api/actuator/health/liveness,  port: 8080}

  - id: lightrag
    alertClass: business-hours
    processes:
      - name: api                       # -> agents-system.api, ALREADY TAKEN
        lifecycle: application
        image: lightrag
        runtime: python
        provides: {http: 9621}
        placement: {memory: 2Gi, cpu: 500m}
        probes:
          readiness: {path: /health, port: 9621}
          liveness:  {path: /health, port: 9621}
