# Fixture B: a different domain, in a different repository, claiming the same
# Service Id. Identity is flat and unique estate-wide
# (docs/adr/model/0010-flat-service-identity.md), so the union of these two fragments
# must fail with E_DUPLICATE_SERVICE_ID -- and with nothing else.
#
# The domain header does NOT namespace the id. Deriving the Kubernetes namespace
# from `domain` (docs/adr/model/0063-intent-authored-per-domain.md) would place these
# two in knowledge-system and agents-system, so nothing would collide at apply.
# That is exactly why the check exists at composition: the id is what one
# Service uses to reference another, and two Services answering to one string
# makes every `dependsOn: {service: knowledge, ...}` edge ambiguous.
apiVersion: intent.jorisjonkers.dev/v1
kind: Domain
schemaVersion: 1.0.0

# Accepted on its own, exactly as fixture A is: E_DUPLICATE_SERVICE_ID is a
# property of the union, and neither half of a pair can carry it alone.
expect: accepted

domain: agents
owner: joris

services:
  - id: knowledge
    workloads:
      - name: other-knowledge
        lifecycle: service
        image: other-knowledge
        runtime: jvm
        placement: {memory: 256Mi, cpu: 50m}
        probes: none
        startupBudget: 600s
        cutover: rolling
