# An edge to an Application in another project, whose alias takes a name a
# Process of this project already serves under.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: notes
owner: joris
cutover: interrupted

applications:
  - id: notes
    processes:
      - name: notes-api
        lifecycle: application
        image: notes-api
        runtime: node
        provides: { http: 8080 }
        placement: { memory: 64Mi, cpu: 10m }
        dependsOn:
          - { application: release-gate, surface: http }
      - name: release-gate
        lifecycle: application
        image: notes-api
        runtime: node
        provides: { http: 8081 }
        placement: { memory: 64Mi, cpu: 10m }
