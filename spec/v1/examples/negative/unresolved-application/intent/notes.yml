# An edge to an Application no fragment declares and no provider the platform
# lists.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0
project: notes
owner: joris
cutover: interrupted

applications:
  - id: notes
    processes:
      - name: notes-api
        lifecycle: application
        image: notes-api
        runtime: node
        provides: { http: 8080 }
        placement: { memory: 64Mi, cpu: 10m }
        dependsOn:
          - { application: search, surface: http }
