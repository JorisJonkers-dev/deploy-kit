# The Secret Store as Project Intent: the Application the worked Platform
# document's `secretStore` names (spec/v1/14-platform-intent.md#the-secret-store).
#
# Every grant in the estate is read from it, so every Process holding one
# egresses to its `http` surface, and every Application holding one is ordered
# after the unit that materialises the credentials it asks for.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: secrets # the namespace derives: secrets-system
owner: joris

applications:
  - id: vault
    processes:
      - name: vault
        lifecycle: application
        image: vault
        runtime: none
        # The image's own arguments are `server -dev`: an in-memory server,
        # unsealed, with its root token in its log. The server runs from its
        # configuration instead, and without the image's entrypoint, which
        # sets a file capability and changes ownership as root.
        command: [vault]
        args: [server, -config=/vault/config/vault.hcl]
        provides:
          http: 8200
        placement:
          memory: 256Mi
          cpu: 100m
        probes:
          # Sealed or uninitialised answers 503 or 501: not ready.
          readiness: { path: /v1/sys/health, port: 8200 }
          # A sealed server is alive. A health check that failed while sealed
          # would restart it, and every restart seals it again.
          liveness: { tcp: 8200 }
        startupBudget: 30s
        cutover: interrupted # one server on a ReadWriteOnce claim
        # The raft store: every secret, policy, role and lease.
        volumes:
          - claim: vault-data
            mountAt: /vault/data
            size: 10Gi
            durability: irreplaceable
        engine: files
        assets:
          - from: config/vault.hcl
            mountAt: /vault/config/vault.hcl
        # A snapshot restore stages the snapshot here before installing it.
        writablePaths: [/tmp]
        # The kubernetes auth method reviews every login's ServiceAccount
        # token with Vault's own, so it keeps no reviewer token.
        api:
          reason: >-
            Vault's kubernetes auth method reviews each login's ServiceAccount token with Vault's own, so every Process in the estate can sign in
          rules:
            - group: authentication.k8s.io
              objects: [tokenreviews]
              verbs: [create]

  # The Vault Secrets Operator: every grant's sync object is its, so it reads
  # them and writes the Secrets they land in, in every namespace. No agent
  # injector and no CSI provider run beside Vault.
  - id: vault-secrets-operator
    processes:
      - name: vault-secrets-operator
        lifecycle: application
        image: vault-secrets-operator
        runtime: none
        provides:
          metrics: 8080
          health: 8081
        placement:
          memory: 128Mi
          cpu: 50m
        probes:
          readiness: { path: /healthz, port: 8081 }
          liveness: { path: /healthz, port: 8081 }
        startupBudget: 30s
        cutover: interrupted
        api:
          reason: >-
            the operator syncs every grant's sync object into its Secret, cluster-wide, and restarts the Processes a rotation names
          rules:
            - group: secrets.hashicorp.com
              objects: [vaultstaticsecrets, vaultstaticsecrets/status, vaultdynamicsecrets, vaultdynamicsecrets/status, vaultauths, vaultauths/status, vaultconnections, vaultconnections/status]
              verbs: [get, list, watch, create, update, patch, delete]
            - group: core
              objects: [secrets]
              verbs: [get, list, watch, create, update, patch, delete]
            - group: core
              objects: [serviceaccounts/token]
              verbs: [create]
            - group: apps
              objects: [deployments, statefulsets, daemonsets]
              verbs: [get, list, watch, patch]
            - group: core
              objects: [events]
              verbs: [create, patch]
