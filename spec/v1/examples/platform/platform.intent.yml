# Platform Intent: the second authored document. What the estate offers, held to
# the same rule as a project file -- facts and policy, never mechanisms -- and
# published as an Intent Fragment by digest like any project
# (spec/v1/14-platform-intent.md, docs/adr/model/0045-platform-intent-is-the-second-authored-document.md).
#
# Every block is a value the contention test put on the platform's side
# (docs/adr/model/0004-contention-decides-authority.md). Nothing here names a
# Kubernetes field, a Traefik key, a k3s flag or a shell command
# (docs/adr/model/0011-authored-values-name-model-concepts.md).

apiVersion: intent.jorisjonkers.dev/v1
kind: Platform
schemaVersion: 1.0.0
owner: joris

metadata:
  cluster: production
  project: jorisjonkers.dev
  nodeContract: "sha256:a989e80337efb294fa1a7175b3ad3eea8bed9bf13fbd503a26691c9265575fc2"

# Facts about the cluster, named for what they are. How k3s is told is a
# derivation nobody authors (docs/adr/model/0049-datastore-and-restore.md).
substrate:
  kubernetesVersion: v1.31.4+k3s1
  datastore: sqlite
  serverCount: 1
  secretsEncryption: true # a delivery: env or file grant writes a secret into
  # the cluster, which is readable on disk unless this is on; the refusal fixtures
  # keep it off to prove the gate (docs/adr/model/0030-secret-delivery-is-env-file-or-self.md)
  cni: flannel
  networkPolicyController: embedded # no non-enforcing stage: default-deny stays
  # render-only (docs/adr/model/0035-network-policy-is-default-deny-and-render-only.md)
  clusterDns: kube-system # where the cluster's DNS runs: every egress policy admits it
  upstreamNameservers: [9.9.9.10, 149.112.112.10] # what a Process that serves DNS
  # resolves through, since it must not depend on the cluster's own DNS
  imagePull: 2m # the slowest pull a pod may wait on: the Pis boot from SD cards, so
  # every derived deadline allows for it (spec/v1/14-platform-intent.md#substrate-facts)

# What must exist before the first rendered object can apply. Recorded and
# enumerated, never declared; growing this table is a decision
# (docs/adr/model/0046-the-foundation-is-declared.md).
bootstrap:
  flux:
    sourceRef: flux-system/platform
    # Where each Project's render is published, one artifact per Project at
    # <repository>/<project>, and the keyless identity Flux verifies it
    # against: the estate repository's composition workflow on main
    # (spec/v1/55-delivery.md#rendered-artifacts-and-pins).
    artifacts:
      repository: ghcr.io/jorisjonkers-dev/render
      signer:
        issuer: "https://token.actions.githubusercontent.com"
        subject: "https://github.com/JorisJonkers-dev/estate/.github/workflows/compose.yml@refs/heads/main"
  vault:
    unsealed: true
  crds:
    - traefik.io/v1alpha1
    - secrets.hashicorp.com/v1beta1
    - monitoring.coreos.com/v1
    - flagger.app/v1beta1 # the Canary every blue-green Process renders
    - identity.jorisjonkers.dev/v1 # the Client every client block renders
    - metallb.io/v1beta1 # the address pools and advertisements l4-speaker renders

# Where the edge terminates. Four facts per tier; the traefik adapter owns every
# Traefik spelling. A route's audience is the only way it reaches a tier, so a
# lan exposure -- jellyfin's high-volume traffic, which may not be proxied
# through Frankfurt -- can reach the LAN proxy and no other, by construction.
tiers:
  - name: public-frankfurt
    audiences: [anonymous, authenticated]
    listener: tls
    certificates: acme
    forwardAuth: {provider: identity/identity, surface: http, path: /gate/forward} # the
    # sign-in provider's Gate, which every gated Client's routes ask
    proxiedBy: cloudflare # every public host is proxied, so a client is the address Cloudflare forwards
    traefik: edge/traefik-public # the declared Application in the platform edge project,
    # placed on the public-ingress node
    ingressClass: traefik-public # the class this Traefik admits routes of
    dns: {target: ingress.jorisjonkers.dev, proxied: true} # where every public name points, behind Cloudflare
    address: edge-frankfurt # the node's own address: ports 80 and 443 derive from `tls`
  - name: lan
    audiences: [lan]
    listener: plain
    certificates: none
    traefik: edge/traefik-lan # placed on a LAN node
    ingressClass: traefik-lan
    address: lan-edge # an address of the Enschede pool: port 80 derives from `plain`

# How an acme tier's proxy registers and proves its names
# (spec/v1/14-platform-intent.md#tiers): the account's email, the DNS provider
# that answers the DNS-01 challenge, and the Secret Store path holding its
# token, which only the proxy of an acme tier reads.
acme:
  email: hostmaster@jorisjonkers.dev
  dnsProvider: cloudflare
  token: secret/data/platform/cloudflare

# One policy per Durability Class (docs/adr/model/0018-durability-class-derives-a-backup.md).
durability:
  reconstructible: {}
  recoverable:
    schedule: "15 3 * * *"
    retain: 14
  irreplaceable:
    schedule: "45 2 * * *"
    retain: 90
    offCluster:
      destination: "s3://backup-storage/jorisjonkers-dev"
      credential: secret/data/platform/backup/off-cluster
      # The age public key each copy is encrypted to on the pod; the private
      # key is kept off the cluster, and only a restore holds it.
      recipient: age1s6v5qrx3mgcgk37gscv8y6z43rssksdct5lx3xk5xrtptjndqvhsnhj7h8
      # Where that destination is, as a network policy can say it: a policy
      # admits an address range and a port, never a hostname. It is what the
      # backup identity's own policy lets its pods reach.
      egress:
        - { cidr: 203.0.113.0/24, port: 443 }

# The method IS the image: one purpose-built image per engine, resolved through
# the images lock. Nothing executable is authored.
engines:
  # `surface` is the surface of the Process the method connects to: postgres
  # is dumped over its own protocol, rabbitmq through its management API, mongo
  # over its wire protocol. A method that reads the volume alone names none.
  # `catalog` applies the database catalog its consumers' edges derive
  # (spec/v1/14-platform-intent.md#catalog-methods).
  postgres: { backup: postgres-backup, surface: postgres, catalog: postgres-catalog, move: {image: postgres-move, breaksOn: major, reverse: never} } # reverse
  # is never until the drill that settles it has run (spec/v1/14-platform-intent.md#move-methods)
  rabbitmq: { backup: rabbitmq-backup, surface: management }
  # No `catalog`: no mongo consumer needs a database of its own yet
  # (spec/v1/16-dependencies.md#the-database-catalog).
  mongo: { backup: mongo-backup, surface: mongo }
  files: { backup: file-backup }
  # An object store is backed up by the files method over its volumes, and its
  # bucket catalog is applied over the admin API, not the S3 surface.
  s3: { backup: file-backup, catalog: garage-catalog, catalogSurface: admin }

# One cadence for every rendered monitor, for the same reason the probe cadence
# below is here: it is contended across the estate, and no Application knows better
# (docs/adr/model/0004-contention-decides-authority.md).
monitors:
  interval: 30s
  timeout: 10s
  # The live Prometheus selects its ServiceMonitors and PodMonitors by this
  # label, so every monitor the render writes carries it
  # (spec/v1/14-platform-intent.md#monitor-cadence).
  labels:
    release: metrics-stack

# Where every exporting Runtime Profile sends its telemetry, the collector's
# `otlp` surface, and the metrics stack every declared scrape surface admits,
# each named by the Application that is it, as a tier names its proxy
# (spec/v1/14-platform-intent.md#telemetry).
telemetry:
  collector: observability/otel-collector
  metrics: observability/prometheus
  # The Grafana every Application's dashboards ship to: the labels its
  # instance carries, and the data source a vendored dashboard's inputs map to.
  dashboards:
    instance: {dashboards: grafana}
    datasource: prometheus

# The monitoring stack by role, each a declared Application, and the one
# routing of every alert (spec/v1/14-platform-intent.md#monitoring). A
# receiver's webhook is read from Vault, never written here.
monitoring:
  grafana: observability/grafana
  prometheus: observability/prometheus
  alertmanager: observability/alertmanager
  receivers:
    - name: discord
      discord:
        webhook: {path: secret/data/platform/alertmanager-discord, key: webhook-url}
  routes:
    - {severity: critical, receiver: discord, repeat: 4h}
    - {severity: warning, receiver: discord, repeat: 12h}

# The Secret Store every grant is read from, on its `http` surface: the
# Application the worked `secrets` project declares
# (spec/v1/14-platform-intent.md#the-secret-store).
secretStore: secrets/vault

# Who issues sign-ins (spec/v1/14-platform-intent.md#sign-in): the Issuer every
# Client trusts, and the Identity Provider the worked `identity` project
# declares, whose Process writes every derived client credential.
signIn:
  issuer: "https://id.jorisjonkers.dev"
  provider: identity/identity
  # The Principal contract version identity serves, which every generated
  # identity file states (spec/v1/17-sign-in.md#generated-app-roles).
  contract: "1.2"

# NO rule catalog, no receivers, no severity map. Those belong to the monitoring
# stack, which reads the published projection; this document decides how often
# to scrape and nothing else about alerting
# (spec/v1/10-project-intent.md#observability).

# One posture for every container the estate renders. A Process authors no
# hardening at all: it declares the paths it writes, and an image that cannot
# meet this class is refused (docs/adr/model/0020-hardening-is-one-platform-posture.md).
hardening: restricted

# One cadence for every rendered probe
# (docs/adr/model/0016-probes-are-siblings-and-startup-targets-liveness.md).
probes:
  period: 10s
  timeout: 5s
  failures: 3

# The ephemeral default for a declared writable path
# (docs/adr/model/0020-hardening-is-one-platform-posture.md).
ephemeral:
  size: 64Mi

# The migration runner (spec/v1/14-platform-intent.md#migration-policy). Every
# Application that moves its schema through a changelog builds its migration
# image FROM this alias's digest, and its Job takes this deadline and these
# requests. One system for the estate: Liquibase, YAML changelogs.
migration:
  runner: liquibase-runner
  deadline: 10m
  memory: 256Mi
  cpu: 100m

# How a release is switched (spec/v1/14-platform-intent.md#delivery-policy).
# The machinery performs the switch and is never switched by it: a gate cannot
# gate its own release, and an edge proxy on a host port cannot run two copies.
# The analysis cadence is the platform's, one for every blue/green member.
delivery:
  machinery: [edge/traefik-public, edge/traefik-lan, delivery/flagger, delivery/release-gate]
  gate: delivery/release-gate
  reporter: delivery/reporter
  analysis:
    interval: 30s
    iterations: 4
    threshold: 3
    errorRate: 1%
    latency: 500ms
  # A Move's write pause may last five minutes, its source is kept a week once
  # the flip has held, and each of its step Jobs is a small client
  # (spec/v1/14-platform-intent.md#delivery-policy).
  move:
    timeout: 300s
    retention: 7d
    memory: 128Mi
    cpu: 100m

# Who may hold Kubernetes API access, and where the API answers
# (spec/v1/14-platform-intent.md#kubernetes-api-access). A Process declares
# what it asks of the API; only a Process of an Application named here may, and
# anyone else's declaration is E_PROCESS_RBAC_GRANT. `server` is what such a
# Process's egress policy admits: the API server is no pod a selector reaches.
apiAccess:
  holders: [delivery/flagger, delivery/release-gate, delivery/collector, delivery/reporter, edge/external-dns, secrets/vault-secrets-operator, observability/prometheus-operator, observability/kube-state-metrics, observability/grafana-operator, observability/gatus, observability/alloy]
  # Admitted to their own namespace alone: no privileged role, so no foundation.
  namespaceHolders: [agents/agents-api, utility/headlamp]
  server:
    - { cidr: 10.43.0.1/32, port: 443 }

# Who among people may use the cluster, and as what
# (spec/v1/14-platform-intent.md#human-grants): a group, written as the API
# server sees it, granted one of Kubernetes' built-in cluster roles,
# cluster-wide. Each grant renders one ClusterRoleBinding that no Application
# holds, so removing an Application removes no one's access.
# The priority classes the platform declares and renders: a datastore runs at
# the data class, and the foundation and the Applications named here at the
# critical one, so they keep scheduling when a node is short
# (spec/v1/14-platform-intent.md#priority). Nothing is authored on a Process.
priority:
  data: {name: platform-data, value: 1000000}
  critical: {name: platform-critical-app, value: 100000}
  criticalApplications: [auth/auth]

humanGrants:
  - group: oidc:k8s-admin
    clusterRole: cluster-admin
    reason: the platform owner administers the cluster with kubectl and headlamp over OIDC

# The job that writes the rendered Vault policies and auth roles into the Secret
# Store (spec/v1/14-platform-intent.md#the-vault-policy-job). It is derived, in
# the Secret Store's namespace, from the documents each render holds; `role` is
# the Vault role it logs in as, a fixture created with the auth method.
policyJob:
  image: vault-policy
  role: policy-admin
  memory: 64Mi
  cpu: 10m
  deadline: 120s

# Which delivery path each Project is on while the estate moves off
# fleet-infra's deploy/production branch, one Project at a time
# (spec/v1/60-setup.md#handing-over-one-project-at-a-time). No Project is on
# both, and after retireBy the old path is removed.
handover:
  retireBy: 2027-03-31
  legacy: [auth, data, knowledge, notes]
  estate: [agents, delivery, edge, identity, knowledge-platform, mail, observability, secrets, utility]
  # Where the old path keeps the legacy Postgres's administrative login, which
  # applies the catalog of the estate path's databases until data moves.
  serving:
    - application: platform-postgres
      namespace: data-system
      admin: { path: secret/data/platform/postgres, user: postgres.user, password: postgres.password }
    # And the legacy Garage's admin token, which applies the bucket catalog.
    - application: platform-garage
      namespace: data-system
      admin: { path: secret/data/platform/garage, token: admin-token }

# Things the estate runs and does not deploy, that an Application depends on. A fact
# with an address, resolvable by an edge -- not a hole, so no review date
# (docs/adr/model/0024-dependency-edges-resolve-against-the-union.md).
providers:
  - name: stalwart
    address: 10.0.0.12
    surfaces:
      smtp: 25
      http: 8080

# Directories on one node that several projects share, each granted by project,
# read or write (spec/v1/14-platform-intent.md#libraries). A Process mounting one
# is placed on its node and runs with its group; no render re-owns it.
libraries:
  media:
    node: enschede-t1000-1
    path: /srv/media
    gid: 3001
    grants:
      notes: write
      jellyfin: read

# What a Process that requires a GPU is handed, by the vendor of the card it
# lands on (spec/v1/14-platform-intent.md#gpus): one share of the device
# resource, and the runtime class that exposes the card to its container.
gpus:
  nvidia:
    resource: nvidia.com/gpu
    runtimeClass: nvidia-cdi

# The addresses a client off the cluster reaches a raw surface on
# (spec/v1/14-platform-intent.md#l4-addresses), by name. A pool is a range on
# one site's network segment: a Process exposed on it is held to that site, and
# each Service exposed on it takes one address of the range, so a range of one
# address is that address. Both pools sit outside the router's DHCP scope.
l4Addresses:
  lan-dns:
    kind: pool
    site: enschede
    range: 192.168.0.98/32
  lan-edge:
    kind: pool
    site: enschede
    range: 192.168.0.99/32
  lan-mqtt:
    kind: pool
    site: enschede
    range: 192.168.0.97/32
  # The public tier's proxy listens on the Frankfurt node's own address.
  edge-frankfurt:
    kind: node
    node: frankfurt-contabo-1
  # A node's own address, at a site with no pool: an exposure on it is a host
  # port, and holds its Process to the node.
  mail-node:
    kind: node
    node: frankfurt-contabo-1

# The host-privileged agents the nodes run
# (spec/v1/14-platform-intent.md#node-agents). The catalog is closed and its
# privileges are fixed; an entry pins the image and what each copy requests.
# Which nodes run an agent is derived: every node runs node-metrics, a node with
# an nvidia card gpu-device and gpu-metrics, and the nodes of a site with a pool
# l4-speaker, whose controller runs once.
nodeAgents:
  gpu-device: { image: nvidia-device-plugin, memory: 64Mi, cpu: 10m }
  gpu-metrics: { image: dcgm-exporter, memory: 256Mi, cpu: 50m }
  node-metrics: { image: node-exporter, memory: 64Mi, cpu: 20m }
  l4-speaker:
    image: metallb-speaker
    memory: 64Mi
    cpu: 20m
    controller: { image: metallb-controller, memory: 64Mi, cpu: 10m }

# The VPN an attached Process's traffic leaves through
# (spec/v1/14-platform-intent.md#vpn): one privileged container the render adds
# beside each attached Process, running this image with these settings. Each
# attached Process reads its own key below the credential prefix, one device per
# Process; the keys are the container's own variables, and it alone reads them.
vpn:
  image: gluetun
  credential: secret/data/platform/vpn
  memory: 128Mi
  cpu: 50m
  settings:
    VPN_SERVICE_PROVIDER: protonvpn
    VPN_TYPE: wireguard
    SERVER_COUNTRIES: Netherlands
    PORT_FORWARD_ONLY: "on"
    DOT: "off"
    DNS_KEEP_NAMESERVER: "on"
