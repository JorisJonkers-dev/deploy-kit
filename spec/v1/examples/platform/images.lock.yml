# The images lock: every image alias the estate's documents name, resolved to
# one digest and the user the image runs as
# (spec/v1/20-resolved-deployment.md#the-images-lock). A pinned input like any
# other, carried by digest in every Resolved Deployment rendered from it.
#
# An alias is what a Process's `image` names; nothing authored names a tag or a
# digest. `uid` and `gid` are what the image's own user is, read once when the
# lock is written, and what the one hardening posture runs it as.

