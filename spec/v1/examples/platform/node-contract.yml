# The node contract: what each node can hold.
#
# GENERATED from one authored file per node, and pinned with the Platform
# Intent, which names this document by digest
# (spec/v1/60-setup.md#node-facts, docs/adr/model/0056-node-facts-single-source.md).
# It is the other half of every placement comparison: a Process declares hard
# dimensions and layer 2 matches them against exactly these facts, never
# against a live cluster (docs/adr/model/0061-placement-is-hard-dimensions.md).
#
# `allocatable` is the node total minus the reserve the node's own file
# declares. It is an eligibility bound and NOT a budget: the contract records
# what a node has, never what already runs on it, so three Processes each
# declaring 2Gi all pass against a 4096Mi node and the scheduler refuses the
# third at apply. Nothing here, and nothing in layer 2, bin-packs.
#
# What this example takes from the specification, and what is its own:
#
#   from chapter 60  the seven nodes, their sites, architectures, cpu and
#                    memory totals, their disks, which cards they hold, and
#                    every capability count
#   its own          the seven reserves, which chapter 60 records as authored
#                    guesses awaiting reconciliation against `kubectl describe
#                    node`; the two GPU memory figures the chapter does not
#                    state; and which node carries `adguard`, `lan-ingress`,
#                    `llm-host` and `backup-store`, where the chapter gives the
#                    count but not the node
#
# The capabilities the chapter does determine are placed where it puts them:
# `nvidia` on the two nvidia cards, `amd-gpu` on the Radeon, `public-ingress`
# on the one node that advertises it, and `samba` on the node that lets
# jellyfin and immich avoid the Maxwell card. `tailscale` is on all seven
# nodes, so it is not a capability: a filter that excludes nothing teaches
# authors that filters do nothing. No node carries a taint.

apiVersion: contract.jorisjonkers.dev/v1
kind: NodeContract
schemaVersion: 1.0.0

cluster: production

# The selector key prefix. It comes from here rather than from the platform's
# name, so retiring a prefix changes rendered output for every Process carrying
# a selector, and retirement goes through this document rather than through a
# hand-applied label that drifts back on the next reconcile.
labelPrefix: platform.jorisjonkers.dev

nodes:
  # ---------------------------------------------------------------- enschede
  - name: enschede-t1000-1
    site: enschede
    arch: amd64
    allocatable: { cpu: 53500m, memory: 31488Mi } # 54000m / 32000Mi total
    capabilities: [nvidia, samba, lan-ingress, adguard]
    gpus:
      - { vendor: nvidia, model: t1000, class: transcode, memory_mib: 4096 }
    disks:
      - { media: nvme, usable_gib: 120 }
      - { media: nvme, usable_gib: 500 }
      - { media: hdd, usable_gib: 4096 }

  - name: enschede-rx7900xtx-1
    site: enschede
    arch: amd64
    allocatable: { cpu: 72300m, memory: 31488Mi } # 72800m / 32000Mi total
    capabilities: [amd-gpu, llm-host, backup-store, lan-ingress, adguard]
    gpus:
      # The fastest card in the estate, and not an nvidia one, which is why a
      # vendor string is not how a Process asks for a GPU.
      - {
          vendor: amd,
          model: rx7900xtx,
          class: render-compute,
          memory_mib: 24576,
        }
    disks:
      - { media: nvme, usable_gib: 160 }
      - { media: nvme, usable_gib: 1000 }
      - { media: hdd, usable_gib: 8192 }

  - name: enschede-gtx-960m-1
    site: enschede
    arch: amd64
    allocatable: { cpu: 28300m, memory: 15872Mi } # 28800m / 16384Mi total
    capabilities: [nvidia, lan-ingress]
    gpus:
      # Same `class` as the T1000 and a fifth of its memory. Only `memory_mib`
      # separates the two, which is the case chapter 60 names for structure
      # over strings.
      - { vendor: nvidia, model: gtx960m, class: transcode, memory_mib: 2048 }
    disks:
      - { media: ssd, usable_gib: 100 }
      - { media: ssd, usable_gib: 500 }
      - { media: hdd, usable_gib: 2048 }

  - name: enschede-pi-1
    site: enschede
    arch: arm64
    allocatable: { cpu: 5750m, memory: 7936Mi } # 6000m / 8192Mi total
    capabilities: [adguard]
    disks:
      # `sdcard` is a medium no Process may ask for: the Medium vocabulary of
      # chapter 10 is `nvme`, `ssd`, `hdd`. The fact is published anyway,
      # because the contract says what a node has
      # (docs/adr/model/0123-a-node-publishes-media-no-process-may-ask-for.md).
      - { media: sdcard, usable_gib: 64 }

  - name: enschede-pi-2
    site: enschede
    arch: arm64
    # 4096Mi total, where a 512Mi error in the reserve is an eighth of the
    # machine. This is the node a wrong reserve bites first.
    allocatable: { cpu: 5750m, memory: 3840Mi }
    capabilities: [adguard]
    disks:
      - { media: sdcard, usable_gib: 64 }

  - name: enschede-pi-3
    site: enschede
    arch: arm64
    allocatable: { cpu: 5750m, memory: 3840Mi } # 6000m / 4096Mi total
    capabilities: [adguard]
    disks:
      - { media: sdcard, usable_gib: 64 }

  # --------------------------------------------------------------- frankfurt
  - name: frankfurt-contabo-1
    site: frankfurt
    arch: amd64
    allocatable: { cpu: 15500m, memory: 32256Mi } # 16000m / 32768Mi total
    # The one node advertising `public-ingress`, which is what makes
    # knowledge-api's eligible set a single node.
    capabilities: [public-ingress]
    disks:
      - { media: ssd, usable_gib: 80 }
      - { media: ssd, usable_gib: 120 }
