# The pinned Cluster Context: every platform fact the render reads and no
# Service authors. Published by digest and never read live
# (docs/adr/model/0006-pinned-inputs.md).
#
# The worked domains under spec/v1/examples/ could not render without this file:
# each block below exists because a decision put a value on the platform's side
# of the contention test (docs/adr/model/0004-contention-decides-authority.md).

apiVersion: context.jorisjonkers.dev/v1
kind: ClusterContext
schemaVersion: 1.0.0

metadata:
  cluster: production
  domain: jorisjonkers.dev

# Cluster facts that decide other decisions
# (docs/adr/model/0057-datastore-and-restore.md, chapter 60).
platform:
  datastore: sqlite # not embedded etcd: decides whether a snapshot exists
  serverCount: 1 # single control plane, by design and now recorded
  k3sVersion: v1.31.4+k3s1
  serverFlags: ["--disable-network-policy"]
  secretsEncryption: false # gates delivery: env and file
  # (docs/adr/model/0028-secrets-at-rest-gate.md)
  cni: flannel # no non-enforcing policy stage, so default-deny stays
  # render-only (docs/adr/model/0084-render-only-is-the-v1-policy-stage.md)

# Where the edge terminates, per tier. A tier serving `authenticated` names the
# endpoint that authenticates for it
# (docs/adr/model/0076-middleware-has-one-producer.md).
tiers:
  - name: public-frankfurt
    audiences: [anonymous, authenticated]
    entryPoint: websecure
    certResolver: letsencrypt
    forwardAuth: http://auth-api.auth-system.svc.cluster.local:8081/api/auth/forward
  - name: lan
    audiences: [lan, internal]
    entryPoint: web
    certResolver: none

# One policy per Durability Class. The window is one node's IO and the
# destination is one remote target, so both are platform-assigned
# (docs/adr/model/0077-durability-derives-a-backup.md).
durability:
  reconstructible: {} # derives nothing
  recoverable:
    schedule: "15 3 * * *"
    retain: 14
  irreplaceable:
    schedule: "45 2 * * *"
    retain: 90
    offCluster:
      destination: s3://backup-storage/jorisjonkers-dev
      credentialPath: secret/data/platform/backup/off-cluster

# The backup and reload methods, keyed by `engine`. Nothing authored is
# executable (docs/adr/model/0012-assets-not-code.md), so the command lives here
# and arrives with the pinned blueprint packs.
engines:
  postgres:
    image: postgres-backup
    backup: ["/bin/sh", "-c", "pg_dump --format=custom"]
  rabbitmq:
    image: rabbitmq-backup
    backup: ["/bin/sh", "-c", "rabbitmqctl export_definitions -"]
  files:
    image: file-backup
    backup: ["/bin/sh", "-c", "tar -cf - ."]
  valkey: {} # present for completeness; reconstructible derives no backup

# Observability. The rule catalog and the class-to-receiver mapping feed both
# producers, so one declared urgency means one thing
# (docs/adr/model/0079-alert-class-derives-from-a-rule-catalog.md).
observability:
  scrape:
    interval: 30s
    scrapeTimeout: 10s
  receivers:
    none: null
    business-hours: discord-daytime
    urgent: discord-oncall
    page: pushover-page
  ruleCatalog:
    baseline: [target-absent, restart-loop, probe-failing]
    postgres: [replication-lag, connections-exhausted]
    rabbitmq: [queue-depth, consumers-zero]

# One cadence for every rendered probe, so a render is a complete description of
# how a pod is checked (docs/adr/model/0088-startup-probe-targets-liveness.md).
probes:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# The ephemeral default for a declared writable path
# (docs/adr/model/0092-writable-paths-are-declared.md).
ephemeral:
  sizeLimit: 64Mi

# Things the estate runs and this model does not deploy. An edge may target one,
# and then its coordinates are what the derived egress rule selects
# (docs/adr/model/0090-edges-resolve-against-the-register.md).
unmanagedSurfaces:
  - host: stalwart.jorisjonkers.dev
    owner: joris
    reason: mail server; migration to Service Intent not scheduled
    reviewBy: 2026-11-30
    address: 10.0.0.12
    surfaces:
      smtp: 25
      http: 8080
  - host: samba.lan.jorisjonkers.dev
    owner: joris
    reason: NixOS module; no Kubernetes workload exists
    reviewBy: 2026-11-30
  - host: wolf.jorisjonkers.dev
    owner: joris
    reason: deployed in neither target; public and unowned until this entry
    reviewBy: 2026-11-30
