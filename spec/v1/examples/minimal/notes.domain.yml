# The smallest complete Service Intent in the model.
#
# One domain, one Service, one Workload, and nothing that is not required.
# Everything absent from this file is either derived (chapter 20) or refused
# (chapter 10). It is the file to read first, and the file to copy when
# onboarding a Service that has no storage and no secrets.
#
# It is also the only worked example that renders on today's pinned inputs:
# it holds no grant, so the secrets-at-rest gate
# (docs/adr/model/0028-secrets-at-rest-gate.md) has nothing to refuse.

apiVersion: intent.jorisjonkers.dev/v1
kind: Domain
schemaVersion: 1.0.0

domain: notes # the namespace derives: notes-system
owner: joris # the only field raised to the domain header

services:
  - id: notes
    # Urgency, not routing. business-hours requires a signal, which the scrape
    # surface below provides; mapping it to a rule and a receiver is the
    # observability service's configuration, not this file's.
    alertClass: business-hours

    exposure:
      - name: public
        host: notes.jorisjonkers.dev # the full FQDN, authored
        audience: anonymous # selects the tier that carries it
        contentPolicy: strict
        routes:
          - { path: /, match: prefix, workload: notes-api, surface: http }

    workloads:
      - name: notes-api
        lifecycle: service
        image: notes-api # an alias; the lock resolves digest, uid and gid
        runtime: node

        provides:
          http: 8080 # above 1024: restricted drops CAP_NET_BIND_SERVICE

        # Two dimensions are required. Both are matched against what the node
        # contract publishes, never against free capacity
        # (docs/adr/model/0061-placement-is-hard-dimensions.md).
        placement:
          memory: 256Mi
          cpu: 50m

        probes:
          readiness: { path: /healthz/ready, port: 8080 }
          liveness: { path: /healthz/live, port: 8080 }

        startupBudget: 20s

        # REQUIRED, no default. No volumes, so a rolling cutover is honourable.
        cutover: rolling

        # No `replicas` block: the derived count is one, and one is what this
        # Workload runs. The block is for a count above one, with a reason.

        # The two observability facts Intent holds: the signal, and the urgency
        # on the Service above. Cadence, rules and receivers live in the
        # observability service's own configuration.
        scrape: {port: 8080, path: /metrics}
