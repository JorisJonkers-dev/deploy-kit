# CodeQL static analysis: JavaScript, TypeScript, and the workflow logic.
# Runs on pull requests and on a weekly schedule, out of band from `Pipeline
# Complete`, so a CodeQL finding never blocks a merge while results land in the
# repository's Security tab.
'name': 'CodeQL'

'on':
  'push':
    'branches':
      - 'main'
  'pull_request':
    'paths':
      - '**.js'
      - '**.mjs'
      - '**.ts'
      - '.github/workflows/*.yml'
  'schedule':
    - 'cron': '22 3 * * 1'

'permissions':
  'contents': 'read'

'jobs':
  'analyze':
    'name': 'Analyze'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 360
    'permissions':
      'actions': 'read'
      'contents': 'read'
      'security-events': 'write'

    'strategy':
      'fail-fast': false
      'matrix':
        'include':
          - 'language': 'javascript-typescript'
          - 'language': 'actions'

    'steps':
      - 'uses': 'actions/checkout@v7'

      - 'name': 'Initialize CodeQL'
        'uses': 'github/codeql-action/init@v3'
        'with':
          'languages': '${{ matrix.language }}'
          'queries': 'security-and-quality'

      - 'name': 'Autobuild'
        'uses': 'github/codeql-action/autobuild@v3'

      - 'name': 'Perform CodeQL Analysis'
        'uses': 'github/codeql-action/analyze@v3'
        'with':
          'category': '/language:${{matrix.language}}'