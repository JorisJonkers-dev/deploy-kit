# One job per gate, so a pull request shows which check failed instead of
# where in one long job it stopped. `Pipeline Complete` is the one required
# check the branch ruleset names: it fails when any gate job fails, is
# cancelled, or is skipped, so a required check can never go green by GitHub
# skipping a job whose `if:` did not match.
#
# Every job checks out and then runs .github/actions/setup (the pinned Node,
# npm ci), runs with only `contents: read`, and carries a timeout. Checkout
# sits in the job because a local action is read from the workspace: it cannot
# do its own checkout. Every action
# and reusable workflow here is pinned by commit SHA, with the tag it
# resolves to as a trailing comment; Renovate bumps the pin and the comment
# together.
#
# docs/adr/architecture/0102-the-gate-grows-with-the-code.md: a new gate's
# script and its job land in the same pull request, and
# test/pipeline-wiring.test.ts is what notices when they do not.
'name': 'CI'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'
  'workflow_dispatch':

'concurrency':
  'group': 'ci-${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'

'jobs':
  'typecheck':
    'name': 'Typecheck'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Typecheck'
        'run': 'npm run typecheck'

  'lint':
    'name': 'Lint'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Lint'
        'run': 'npm run lint'

  'format':
    'name': 'Format'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Format check'
        'run': 'npm run format:check'

  'architecture':
    'name': 'Architecture'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      # The layer boundaries on the module graph: no layer reaching outward,
      # no adapter reading another adapter, no cycle, nothing unreachable from
      # an entry point. Skips loudly while src/ does not exist.
      # See docs/adr/architecture/0069-boundaries-enforced-on-the-graph.md.
      - 'name': 'Boundaries'
        'run': 'npm run lint:boundaries'

  'contracts':
    'name': 'Contracts'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      # The decision-record contract: frontmatter schema, register integrity,
      # qualified citations, normative anchors resolving into spec/, and
      # content shape. See docs/adr/README.md.
      - 'name': 'ADR contract'
        'run': 'npm run lint:adrs'

      # Relative links and heading anchors across every tracked Markdown file.
      # The ADR domain move rewrote about a hundred references outside the
      # decision set, and nothing checked them.
      - 'name': 'Link contract'
        'run': 'npm run lint:links'

      # Every rendered example object, against Kubernetes and CRD schemas.
      # "All parse" is what let a PVC with `storage: null` through
      # (spec/v1/examples/RENDER-GAPS.md, R8). Pinned by version, never
      # `curl | bash` from a default branch: see
      # docs/adr/deferred/0048-class-b-pinning.md.
      - 'name': 'Manifest schemas'
        'shell': 'bash'
        'run': |
          set -euo pipefail
          version='0.6.7'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          KUBECONFORM="${PWD}/kubeconform" npm run lint:manifests

      # The behaviour ledger (docs/requirements.md): every row parses, names a
      # real test that holds at least one test, its stated count matches what
      # it holds, and every REQ-NNN cited in the tracked tree resolves to a
      # row. See docs/adr/architecture/0103-a-behaviour-ledger-names-what-a-test-proves.md.
      - 'name': 'Requirements ledger'
        'run': 'npm run lint:requirements'

  'tests':
    'name': 'Tests'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      # The coverage ratchet lives in vitest.config.ts: thresholds sit on what
      # the suite reaches and only rise. See
      # docs/adr/architecture/0101-coverage-is-a-ratchet.md.
      - 'name': 'Test'
        'run': 'npm run test:coverage'

  'package-contents':
    'name': 'Package contents'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      # Until the compiler exists, the npm package ships docs/adr and spec
      # only (docs/adr/README.md). `files` in package.json states that, but
      # npm always bundles package.json, README and LICENSE regardless of it,
      # so this asks the real npm what it would ship rather than trusting the
      # field.
      - 'name': 'Package contents'
        'run': 'node scripts/check-package-contents.ts'

  'actionlint':
    'name': 'Actionlint'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      # Pinned by version, never `curl | bash` from a third-party default
      # branch: docs/adr/deferred/0048-class-b-pinning.md (deferred set)
      # records that pattern as a live supply-chain defect in the repository
      # this one replaces. Renovate bumps the pin.
      - 'name': 'Actionlint'
        'shell': 'bash'
        'env':
          'ACTIONLINT_VERSION': '1.7.7'
        'run': |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color .github/workflows/*.yml

  'secret-scan':
    'name': 'Secret scan'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      # Binary, not gitleaks-action: the action needs a paid licence for org
      # repos. Pinned version, per
      # docs/adr/deferred/0048-class-b-pinning.md.
      - 'name': 'Secret scan'
        'shell': 'bash'
        'env':
          'GITLEAKS_VERSION': '8.30.1'
        'run': |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --source . --exit-code 1

  'pipeline-complete':
    'name': 'Pipeline Complete'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 5
    'permissions':
      'contents': 'read'
    'needs':
      - 'typecheck'
      - 'lint'
      - 'format'
      - 'architecture'
      - 'contracts'
      - 'tests'
      - 'package-contents'
      - 'actionlint'
      - 'secret-scan'
    # Runs even when a dependency failed or was cancelled: the branch ruleset
    # names this job, so it has to run and report failure rather than being
    # skipped alongside whatever it depends on.
    'if': 'always()'
    'steps':
      # `needs.*.result` is 'success', 'failure', 'cancelled' or 'skipped' for
      # each job above; contains() over that list is what makes this fail on
      # any of the last three, and the negated twin below is what prints a
      # clean pass instead of leaving the job green with no step run at all.
      - 'name': 'Fail: a gate job failed, was cancelled, or was skipped'
        'if': >-
          ${{ contains(needs.*.result, 'failure') ||
              contains(needs.*.result, 'cancelled') ||
              contains(needs.*.result, 'skipped') }}
        'run': 'exit 1'

      - 'name': 'Every gate job succeeded'
        'if': >-
          ${{ !(contains(needs.*.result, 'failure') ||
                contains(needs.*.result, 'cancelled') ||
                contains(needs.*.result, 'skipped')) }}
        'run': 'echo "Every gate job succeeded."'
