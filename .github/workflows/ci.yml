# One job per gate, so a pull request shows which check failed instead of
# where in one long job it stopped. `Pipeline Complete` is the one required
# check the branch ruleset names: it fails when any gate job fails, is
# cancelled, or is skipped, so a required check can never go green by GitHub
# skipping a job whose `if:` did not match.
#
# Every job checks out and then runs .github/actions/setup (the pinned Node,
# npm ci), runs with only `contents: read`, and carries a timeout. Checkout
# sits in the job because a local action is read from the workspace: it cannot
# do its own checkout. Every action
# and reusable workflow here is pinned by commit SHA, with the tag it
# resolves to as a trailing comment; Renovate bumps the pin and the comment
# together.
#
# docs/adr/architecture/0102-the-gate-grows-with-the-code.md: a new gate's
# script and its job land in the same pull request, and
# test/pipeline-wiring.test.ts is what notices when they do not.
'name': 'CI'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'
  'workflow_dispatch':

'concurrency':
  'group': 'ci-${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'

'jobs':
  'typecheck':
    'name': 'Typecheck'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Typecheck'
        'run': 'npm run typecheck'

  'lint':
    'name': 'Lint'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Lint'
        'run': 'npm run lint'

  'format':
    'name': 'Format'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Format check'
        'run': 'npm run format:check'

  'architecture':
    'name': 'Architecture'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      # The layer boundaries on the module graph: no layer reaching outward,
      # no adapter reading another adapter, no cycle, nothing unreachable from
      # an entry point. Skips loudly while src/ does not exist.
      # See docs/adr/architecture/0069-boundaries-enforced-on-the-graph.md.
      - 'name': 'Boundaries'
        'run': 'npm run lint:boundaries'

  'contracts':
    'name': 'Contracts'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      # The decision-record contract: frontmatter schema, register integrity,
      # qualified citations, normative anchors resolving into spec/, and
      # content shape. See docs/adr/README.md.
      - 'name': 'ADR contract'
        'run': 'npm run lint:adrs'

      # The coursework implementation's register, linted as its own root.
      # Deleted with emf/ (emf/docs/adr/emf/0107).
      - 'name': 'ADR contract (emf)'
        'run': 'node scripts/lint-adrs.ts emf'

      # Relative links and heading anchors across every tracked Markdown file.
      # The ADR domain move rewrote about a hundred references outside the
      # decision set, and nothing checked them.
      - 'name': 'Link contract'
        'run': 'npm run lint:links'

      # Every rendered example object, against Kubernetes and CRD schemas.
      # "All parse" is what let a PVC with `storage: null` through
      # (spec/v1/examples/RENDER-GAPS.md, R8). Pinned by version, never
      # `curl | bash` from a default branch: see
      # docs/adr/deferred/0048-class-b-pinning.md.
      - 'name': 'Manifest schemas'
        'shell': 'bash'
        'run': |
          set -euo pipefail
          version='0.6.7'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          KUBECONFORM="${PWD}/kubeconform" npm run lint:manifests

      # The behaviour ledger (docs/requirements.md): every row parses, names a
      # real test that holds at least one test, its stated count matches what
      # it holds, and every REQ-NNN cited in the tracked tree resolves to a
      # row. See docs/adr/architecture/0103-a-behaviour-ledger-names-what-a-test-proves.md.
      - 'name': 'Requirements ledger'
        'run': 'npm run lint:requirements'

      # The rule ledger (docs/architecture-rules.md): every row resolves its
      # enforcer, every enforced row names a fixture that asserts on its
      # witness, every pending row carries a ticket and a reason, and every
      # rule the two rule configurations name is claimed by exactly one
      # enforced row. See
      # docs/adr/architecture/0104-every-enforced-rule-has-an-id-a-row-and-a-fixture.md.
      - 'name': 'Rule ledger'
        'run': 'npm run lint:rules'

      # Every E_ code the specification defines is exercised by a test or
      # pending on the ticket that will exercise it, and no other code is used.
      - 'name': 'Spec error codes'
        'run': 'npm run lint:codes'

      # README.md and CONTRIBUTING.md, held to the repository they describe:
      # every named script exists, every backtick-quoted path exists, every
      # quoted coverage number matches vitest.config.ts, every quoted Node
      # version matches .nvmrc. The link contract above proves a link and its
      # anchor resolve; this proves the prose around them is still true.
      - 'name': 'Docs contract'
        'run': 'npm run lint:docs'

  'tests':
    'name': 'Tests'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      # The coverage ratchet lives in vitest.config.ts: thresholds sit on what
      # the suite reaches and only rise. See
      # docs/adr/architecture/0101-coverage-is-a-ratchet.md.
      - 'name': 'Test'
        'run': 'npm run test:coverage'

  # Every module under src/, mutated; a surviving mutant below the break
  # threshold in stryker.config.json fails the job. The threshold is the
  # measured score and only rises, like the coverage ratchet.
  'mutation':
    'name': 'Mutation'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 20
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      - 'name': 'Mutation'
        'run': 'npm run test:mutation'

  'package-contents':
    'name': 'Package contents'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'
      # Until the compiler exists, the npm package ships docs/adr and spec
      # only (docs/adr/README.md). `files` in package.json states that, but
      # npm always bundles package.json, README and LICENSE regardless of it,
      # so this asks the real npm what it would ship rather than trusting the
      # field.
      - 'name': 'Package contents'
        'run': 'node scripts/check-package-contents.ts'

  'actionlint':
    'name': 'Actionlint'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      # Pinned by version, never `curl | bash` from a third-party default
      # branch: docs/adr/deferred/0048-class-b-pinning.md (deferred set)
      # records that pattern as a live supply-chain defect in the repository
      # this one replaces. Renovate bumps the pin.
      - 'name': 'Actionlint'
        'shell': 'bash'
        'env':
          'ACTIONLINT_VERSION': '1.7.7'
        'run': |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color .github/workflows/*.yml

  'secret-scan':
    'name': 'Secret scan'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 10
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      # Binary, not gitleaks-action: the action needs a paid licence for org
      # repos. Pinned version, per
      # docs/adr/deferred/0048-class-b-pinning.md. scripts/lint-secrets.ts is
      # the one command and one set of patterns `npm run verify` also runs;
      # this step only supplies the pinned binary it downloads.
      - 'name': 'Secret scan'
        'shell': 'bash'
        'env':
          'GITLEAKS_VERSION': '8.30.1'
        'run': |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          GITLEAKS="${PWD}/gitleaks" npm run lint:secrets

  # CodeQL over every language, as a gate: .github/workflows/codeql.yml fails on
  # any finding, and Pipeline Complete needs this job, so a finding blocks the
  # merge. The called workflow needs to upload results, hence the permissions.
  'codeql':
    'name': 'Code scanning'
    'permissions':
      'actions': 'read'
      'contents': 'read'
      'security-events': 'write'
    'uses': './.github/workflows/codeql.yml'

  # The model-driven implementation under emf/ (docs/adr/emf/0107): its own
  # Maven build, JDK and gates, deleted with the directory at its sunset.
  # Every gate it runs is listed in emf/docs/rules.md; the thresholds are in
  # emf/pom.xml. test/emf-wiring.test.ts proves this step names a real build.
  'emf':
    'name': 'Model-driven build'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 20
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': 'actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6' # v6.0.1
        'with':
          'distribution': 'temurin'
          'java-version-file': 'emf/.java-version'
          'cache': 'maven'
          # Tycho caches p2 bundles in the Maven repository too, so the target
          # platform is part of the key.
          'cache-dependency-path': |
            emf/**/pom.xml
            emf/emf.target
      - 'name': 'Verify'
        'working-directory': 'emf'
        'run': './mvnw -B -ntp verify'
      - 'name': 'Summary'
        'if': 'always()'
        'run': 'emf/scripts/summary.sh >> "$GITHUB_STEP_SUMMARY"'

  # Two jobs land here together, for issue #33. Neither gates: neither joins
  # `pipeline-complete`'s `needs` below, per
  # docs/adr/architecture/0102-the-gate-grows-with-the-code.md's own rule
  # that only a gate belongs in that list.
  #
  # `coverage-baseline` runs on a push to main only: it stages the coverage
  # `tests` just measured, wrapped with the commit it came from, and caches
  # it keyed by that commit. `pr-report` restores whatever the most recent
  # such cache holds (GitHub resolves `restore-keys` to the newest matching
  # entry, and a pull request can read a cache its base branch saved) as the
  # baseline scripts/pr-report.ts compares the branch against; with no cache
  # yet, or none reachable, scripts/lib/pr-comment.ts says so rather than
  # showing a false zero difference.
  'coverage-baseline':
    'name': 'Coverage Baseline'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'if': "${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}"
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      - 'name': 'Test with coverage'
        'run': 'npm run test:coverage'

      - 'name': 'Stage the baseline coverage summary'
        'shell': 'bash'
        'run': |
          set -euo pipefail
          mkdir -p .coverage-baseline
          node -e "
            const fs = require('node:fs');
            const total = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            fs.writeFileSync(
              '.coverage-baseline/coverage-summary.json',
              JSON.stringify({ commit: process.env.GITHUB_SHA, coverage: total }),
            );
          "

      - 'name': 'Cache the main coverage baseline'
        'uses': 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        'with':
          'path': '.coverage-baseline'
          'key': 'coverage-main-${{ github.sha }}'

  # Comment each pull request's shape and coverage (issue #33). Runs the
  # coverage suite a second time, independent of the `tests` gate above, so
  # this can read the report even when `tests` fails the ratchet; that step
  # tolerates its own failure (`continue-on-error`) because the ratchet is
  # already enforced there, not here. scripts/pr-report.ts itself never
  # returns non-zero, so the last step's own `continue-on-error` is a second,
  # redundant guarantee that a `gh api` failure (a fork's read-only token,
  # most often) cannot fail this job either.
  'pr-report':
    'name': 'PR Report'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'if': "${{ github.event_name == 'pull_request' }}"
    'permissions':
      'contents': 'read'
      'pull-requests': 'write'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        'with':
          'fetch-depth': '0'
      - 'uses': './.github/actions/setup'

      - 'name': 'Test with coverage'
        'continue-on-error': true
        'run': 'npm run test:coverage'

      - 'name': 'Restore the main coverage baseline'
        'uses': 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        'with':
          'path': '.coverage-baseline'
          'key': 'coverage-main-not-a-real-key'
          'restore-keys': 'coverage-main-'

      - 'name': "Comment the pull request's shape and coverage"
        'continue-on-error': true
        'shell': 'bash'
        'env':
          'GH_TOKEN': '${{ github.token }}'
          'PR_NUMBER': '${{ github.event.pull_request.number }}'
        'run': |
          set -euo pipefail
          upstream="refs/remotes/origin/${GITHUB_BASE_REF}"
          base_sha=$(git merge-base "${upstream}" "${GITHUB_SHA}")
          PR_BASE_SHA="${base_sha}" PR_HEAD_SHA="${GITHUB_SHA}" npm run report:pr

  # Publish a release candidate from every pull request (issue #34). Only a
  # pull request from a branch of this repository even starts this job: a
  # fork's GITHUB_TOKEN is downgraded to read-only regardless of the
  # `permissions` below, so it could not publish even if scripts/rc-publish.ts
  # let it try. scripts/lib/rc-version.ts's `eligibility` restates the same
  # rule (plus Dependabot and Renovate) in the job's own log, for the run
  # where the two conditions could ever disagree.
  'release-candidate':
    'name': 'Release Candidate'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 15
    'if': >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    'permissions':
      'contents': 'read'
      'packages': 'write'
      'id-token': 'write'
    'env':
      'NODE_AUTH_TOKEN': '${{ github.token }}'
    'steps':
      - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - 'uses': './.github/actions/setup'

      - 'name': 'Publish a release candidate'
        'shell': 'bash'
        'env':
          'RC_EVENT_NAME': '${{ github.event_name }}'
          'RC_IS_FORK': '${{ github.event.pull_request.head.repo.full_name != github.repository }}'
          'RC_ACTOR': '${{ github.event.pull_request.user.login }}'
          'RC_PR_NUMBER': '${{ github.event.pull_request.number }}'
        'run': 'npm run publish:rc'

  'pipeline-complete':
    'name': 'Pipeline Complete'
    'runs-on': 'ubuntu-latest'
    'timeout-minutes': 5
    'permissions':
      'contents': 'read'
    'needs':
      - 'typecheck'
      - 'lint'
      - 'format'
      - 'architecture'
      - 'contracts'
      - 'tests'
      - 'mutation'
      - 'package-contents'
      - 'actionlint'
      - 'secret-scan'
      - 'codeql'
      - 'emf'
    # Runs even when a dependency failed or was cancelled: the branch ruleset
    # names this job, so it has to run and report failure rather than being
    # skipped alongside whatever it depends on.
    'if': 'always()'
    'steps':
      # `needs.*.result` is 'success', 'failure', 'cancelled' or 'skipped' for
      # each job above; contains() over that list is what makes this fail on
      # any of the last three, and the negated twin below is what prints a
      # clean pass instead of leaving the job green with no step run at all.
      - 'name': 'Fail: a gate job failed, was cancelled, or was skipped'
        'if': >-
          ${{ contains(needs.*.result, 'failure') ||
              contains(needs.*.result, 'cancelled') ||
              contains(needs.*.result, 'skipped') }}
        'run': 'exit 1'

      - 'name': 'Every gate job succeeded'
        'if': >-
          ${{ !(contains(needs.*.result, 'failure') ||
                contains(needs.*.result, 'cancelled') ||
                contains(needs.*.result, 'skipped')) }}
        'run': 'echo "Every gate job succeeded."'
