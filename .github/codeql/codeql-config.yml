# Paths CodeQL does not analyse. Build output and generated sources are not
# code anyone wrote here; generated code lands in target/, src-gen/ and
# xtend-gen/.
'name': 'deploy-kit CodeQL'

'paths-ignore':
  - '**/target/**'
  - '**/src-gen/**'
  - '**/xtend-gen/**'
  - 'node_modules/**'
  - 'coverage/**'
