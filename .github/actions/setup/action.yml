# The one setup every CI job starts from: checkout, the Node .nvmrc pins, and
# a clean install. Kept in one place so a Node bump or a checkout change is
# one file, not nine.
'name': 'Setup'
'description': 'Checkout the repository, install the pinned Node, and npm ci'

'runs':
  'using': 'composite'
  'steps':
    - 'uses': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - 'uses': 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
      'with':
        'node-version-file': '.nvmrc'
        'cache': 'npm'

    - 'name': 'Install'
      'shell': 'bash'
      'run': 'npm ci'
