# collections/data/platform/config/postgresql.conf
#
# The Asset platform-postgres mounts at /etc/postgresql/postgresql.conf
# (docs/adr/model/0014-file-shaped-configuration-is-an-asset.md). Fully
# static: no placeholder and no derived value, so the file is carried into
# the projection as written, under a name its content digest decides.

# ------------------------------------------------------------ connections
listen_addresses = '*'
port = 5432
max_connections = 100
unix_socket_directories = '/var/run/postgresql'

# ----------------------------------------------------------------- memory
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# -------------------------------------------------------------------- WAL
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# -------------------------------------------------------------- extensions
shared_preload_libraries = 'vector'

# ---------------------------------------------------------------- logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '

# ---------------------------------------------------------------- locale
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
